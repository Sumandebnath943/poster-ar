<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AR Experience</title>


  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

      font-family: Arial, sans-serif;

    }


    /* =========================================
       INTRO SCREEN
    ========================================= */

    #intro {

      position: fixed;

      inset: 0;

      z-index: 10000;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding: 30px;

      text-align: center;

      color: white;

      background: #000;

    }


    #intro h1 {

      margin: 0 0 12px;

      font-size: 28px;

      font-weight: 600;

    }


    #intro p {

      max-width: 320px;

      margin: 0 0 28px;

      line-height: 1.5;

      font-size: 16px;

      opacity: 0.75;

    }


    #start {

      padding: 15px 28px;

      border: none;

      border-radius: 999px;

      background: white;

      color: black;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

    }


    /* =========================================
       LOADING
    ========================================= */

    #loading {

      position: fixed;

      inset: 0;

      z-index: 9500;

      display: none;

      align-items: center;

      justify-content: center;

      color: white;

      background: #000;

      font-size: 16px;

    }


    /* =========================================
       SCANNING
    ========================================= */

    #scanning {

      position: fixed;

      z-index: 9000;

      left: 50%;

      bottom: 45px;

      transform: translateX(-50%);

      padding: 11px 18px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.68);

      color: white;

      font-size: 14px;

      white-space: nowrap;

      display: none;

      pointer-events: none;

    }


    /* =========================================
       DETECTED
    ========================================= */

    #found {

      position: fixed;

      z-index: 9000;

      left: 50%;

      bottom: 45px;

      transform: translateX(-50%);

      padding: 10px 17px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.65);

      color: white;

      font-size: 14px;

      display: none;

      pointer-events: none;

    }

  </style>

</head>


<body>


  <!-- =========================================
       INTRO
  ========================================= -->

  <div id="intro">

    <h1>AR Experience</h1>

    <p>
      Point your camera at the poster
      to bring it to life.
    </p>

    <button id="start">
      Start Experience
    </button>

  </div>


  <!-- =========================================
       LOADING
  ========================================= -->

  <div id="loading">
    Starting camera...
  </div>


  <!-- =========================================
       SCANNING
  ========================================= -->

  <div id="scanning">
    Point your camera at the poster
  </div>


  <!-- =========================================
       FOUND
  ========================================= -->

  <div id="found">
    ✓ Poster detected
  </div>


  <!-- =========================================
       AR SCENE
  ========================================= -->

  <a-scene

    mindar-image="

      imageTargetSrc: ./targets.mind;

      /*
       * FAST TARGET ACQUISITION
       *
       * Lower warmupTolerance =
       * fewer frames required before
       * the target appears.
       */

      warmupTolerance: 1;


      /*
       * FAST TARGET LOSS RECOVERY
       */

      missTolerance: 2;


      /*
       * MORE RESPONSIVE POSITION TRACKING
       */

      filterMinCF: 0.01;

      filterBeta: 1500;

      autoStart: false;

      uiLoading: no;

      uiScanning: no;

      uiError: yes;

    "

    color-space="sRGB"

    renderer="
      colorManagement: true,
      physicallyCorrectLights
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >


    <!-- =======================================
         ASSETS
    ======================================== -->

    <a-assets>

      <video

        id="film"

        src="./film-web.mp4"

        loop

        playsinline

        webkit-playsinline

        crossorigin="anonymous"

        preload="auto"

      ></video>

    </a-assets>


    <!-- =======================================
         CAMERA
    ======================================== -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false"

    ></a-camera>


    <!-- =======================================
         POSTER TARGET
    ======================================== -->

    <a-entity

      id="posterTarget"

      mindar-image-target="targetIndex: 0"

    >


      <!--

        IMPORTANT:

        EXACTLY 16:9

        width  = 1
        height = 0.5625

        No enlargement.
        No zoom.
        No offset.

      -->

      <a-video

        id="arVideo"

        src="#film"

        width="1"

        height="0.5625"

        position="0 0 0.001"

        material="
          shader: flat;
          transparent: true;
          opacity: 0;
        "

      ></a-video>


    </a-entity>


  </a-scene>


  <script>


    /* =========================================
       ELEMENTS
    ========================================= */

    const scene =
      document.querySelector("a-scene");


    const startButton =
      document.querySelector("#start");


    const intro =
      document.querySelector("#intro");


    const loading =
      document.querySelector("#loading");


    const scanning =
      document.querySelector("#scanning");


    const found =
      document.querySelector("#found");


    const video =
      document.querySelector("#film");


    const arVideo =
      document.querySelector("#arVideo");


    const target =
      document.querySelector("#posterTarget");


    let fadeAnimation = null;

    let fadeTimer = null;

    let isTracked = false;


    /* =========================================
       OPACITY
    ========================================= */

    function setOpacity(value) {

      const material =
        arVideo.getAttribute("material");

      material.opacity = value;

      arVideo.setAttribute(
        "material",
        material
      );

    }


    /* =========================================
       CINEMATIC FADE
    ========================================= */

    function fadeVideoIn() {


      if (fadeAnimation) {

        cancelAnimationFrame(
          fadeAnimation
        );

      }


      const startTime =
        performance.now();


      /*
       * Keep this relatively short.
       *
       * The first ~2 seconds of your video
       * are black, so the physical poster
       * effectively becomes the video.
       */

      const duration = 1200;


      function animate() {


        if (!isTracked) {

          return;

        }


        const elapsed =
          performance.now() -
          startTime;


        const progress =
          Math.min(
            elapsed / duration,
            1
          );


        /*
         * Smoothstep easing.
         *
         * Starts gently,
         * finishes naturally.
         */

        const eased =
          progress *
          progress *
          (3 - 2 * progress);


        setOpacity(eased);


        if (progress < 1) {

          fadeAnimation =
            requestAnimationFrame(
              animate
            );

        }

      }


      animate();

    }


    /* =========================================
       RESET
    ========================================= */

    function resetExperience() {


      isTracked = false;


      if (fadeTimer) {

        clearTimeout(
          fadeTimer
        );

        fadeTimer = null;

      }


      if (fadeAnimation) {

        cancelAnimationFrame(
          fadeAnimation
        );

        fadeAnimation = null;

      }


      video.pause();

      video.currentTime = 0;


      setOpacity(0);


      found.style.display =
        "none";


      scanning.style.display =
        "block";

    }


    /* =========================================
       START AR
    ========================================= */

    startButton.addEventListener(
      "click",
      async () => {


        intro.style.display =
          "none";


        loading.style.display =
          "flex";


        const mindar =
          scene.systems[
            "mindar-image-system"
          ];


        try {


          await mindar.start();


          loading.style.display =
            "none";


          scanning.style.display =
            "block";


        }

        catch (error) {


          console.error(
            error
          );


          loading.innerHTML =
            "Unable to access the camera.";

        }

      }
    );


    /* =========================================
       POSTER FOUND
    ========================================= */

    target.addEventListener(
      "targetFound",
      () => {


        /*
         * Prevent duplicate starts
         * when MindAR fires multiple
         * detection events.
         */

        if (isTracked) {

          return;

        }


        isTracked = true;


        console.log(
          "POSTER FOUND"
        );


        scanning.style.display =
          "none";


        found.style.display =
          "block";


        setTimeout(
          () => {

            found.style.display =
              "none";

          },
          1000
        );


        /*
         * ALWAYS START FROM THE
         * EXACT BEGINNING.
         */

        video.currentTime = 0;


        /*
         * The video begins playing
         * while completely invisible.
         */

        setOpacity(0);


        video.play().catch(
          error => {

            console.log(
              "Video playback:",
              error
            );

          }
        );


        /*
         * Your video has a black
         * opening, so allow it to
         * naturally establish the
         * transition before revealing.
         */

        fadeTimer =
          setTimeout(
            () => {

              if (isTracked) {

                fadeVideoIn();

              }

            },
            1800
          );


      }
    );


    /* =========================================
       POSTER LOST
    ========================================= */

    target.addEventListener(
      "targetLost",
      () => {


        console.log(
          "POSTER LOST"
        );


        resetExperience();


      }
    );


  </script>


</body>

</html>
