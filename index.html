<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Living Poster AR</title>


  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }


    #intro {

      position: fixed;
      inset: 0;

      z-index: 10000;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding: 30px;

      text-align: center;

      color: white;
      background: black;

    }


    #intro h1 {

      margin: 0 0 12px;

      font-size: 28px;

      font-weight: 600;

    }


    #intro p {

      max-width: 320px;

      margin: 0 0 28px;

      line-height: 1.5;

      font-size: 16px;

      opacity: 0.75;

    }


    #start {

      padding: 15px 28px;

      border: none;

      border-radius: 999px;

      background: white;

      color: black;

      font-size: 16px;

      font-weight: 600;

    }


    #loading {

      position: fixed;

      inset: 0;

      z-index: 9500;

      display: none;

      align-items: center;

      justify-content: center;

      color: white;

      background: black;

      font-size: 16px;

    }


    #scanning {

      position: fixed;

      z-index: 9000;

      left: 50%;

      bottom: 50px;

      transform: translateX(-50%);

      padding: 12px 20px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.7);

      color: white;

      font-size: 15px;

      white-space: nowrap;

      display: none;

    }


    #found {

      position: fixed;

      z-index: 9000;

      left: 50%;

      bottom: 50px;

      transform: translateX(-50%);

      padding: 10px 18px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.65);

      color: white;

      font-size: 14px;

      display: none;

    }

  </style>


  <script>

    /*
    =====================================================
    LIVING POSTER SHADER
    =====================================================

    White areas in person-mask.png
    = keep the original poster.

    Black areas
    = show the moving video.
    */


    AFRAME.registerShader("living-poster", {

      schema: {

        video: {
          type: "selector"
        },

        poster: {
          type: "selector"
        },

        mask: {
          type: "selector"
        },

        opacity: {
          type: "number",
          default: 0
        }

      },


      init: function (data) {

        const video =
          data.video;


        const poster =
          data.poster;


        const mask =
          data.mask;


        /*
        Video texture
        */

        const videoTexture =
          new THREE.VideoTexture(video);

        videoTexture.minFilter =
          THREE.LinearFilter;

        videoTexture.magFilter =
          THREE.LinearFilter;

        videoTexture.format =
          THREE.RGBAFormat;


        /*
        Poster texture
        */

        const posterTexture =
          new THREE.Texture(poster);

        posterTexture.needsUpdate = true;


        /*
        Mask texture
        */

        const maskTexture =
          new THREE.Texture(mask);

        maskTexture.needsUpdate = true;


        /*
        Custom shader material
        */

        this.material =
          new THREE.ShaderMaterial({

            uniforms: {

              uVideo: {
                value: videoTexture
              },

              uPoster: {
                value: posterTexture
              },

              uMask: {
                value: maskTexture
              },

              uOpacity: {
                value: 0
              }

            },


            vertexShader: `

              varying vec2 vUv;

              void main() {

                vUv = uv;

                gl_Position =
                  projectionMatrix *
                  modelViewMatrix *
                  vec4(position, 1.0);

              }

            `,


            fragmentShader: `

              uniform sampler2D uVideo;

              uniform sampler2D uPoster;

              uniform sampler2D uMask;

              uniform float uOpacity;


              varying vec2 vUv;


              void main() {


                vec4 videoColor =
                  texture2D(
                    uVideo,
                    vUv
                  );


                vec4 posterColor =
                  texture2D(
                    uPoster,
                    vUv
                  );


                float mask =
                  texture2D(
                    uMask,
                    vUv
                  ).r;


                /*
                White mask = poster.

                Black mask = video.
                */

                vec4 result =
                  mix(
                    videoColor,
                    posterColor,
                    mask
                  );


                /*
                Fade the AR layer in.
                */

                result.a =
                  uOpacity;


                gl_FragColor =
                  result;

              }

            `,


            transparent: true,

            depthWrite: false

          });

      },


      update: function (data) {

        if (
          this.material &&
          this.material.uniforms
        ) {

          this.material.uniforms.uOpacity.value =
            data.opacity;

        }

      },


      tick: function () {

        if (
          this.material &&
          this.material.uniforms
        ) {

          const video =
            this.material
              .uniforms
              .uVideo
              .value;


          if (
            video &&
            video.readyState >= 2
          ) {

            this.material
              .uniforms
              .uVideo
              .value
              .needsUpdate = true;

          }

        }

      }

    });

  </script>

</head>


<body>


  <div id="intro">

    <h1>AR Experience</h1>

    <p>
      Point your camera at the poster
      to bring it to life.
    </p>

    <button id="start">
      Start Experience
    </button>

  </div>


  <div id="loading">
    Starting camera...
  </div>


  <div id="scanning">
    Point your camera at the poster
  </div>


  <div id="found">
    ✓ Poster detected
  </div>


  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true,
      physicallyCorrectLights
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >


    <a-assets>


      <video

        id="film"

        src="./film-web.mp4"

        loop

        playsinline

        webkit-playsinline

        crossorigin="anonymous"

      ></video>


      <img

        id="poster"

        src="./poster.png"

      >


      <img

        id="personMask"

        src="./person-mask.png"

      >


    </a-assets>


    <a-camera

      position="0 0 0"

      look-controls="enabled: false"

    ></a-camera>


    <a-entity

      id="posterTarget"

      mindar-image-target="targetIndex: 0"

    >


      <a-plane

        id="livingPoster"

        width="1"

        height="0.5625"

        position="0 0 0.01"

        material="
          shader: living-poster;
          video: #film;
          poster: #poster;
          mask: #personMask;
          opacity: 0;
        "

      ></a-plane>


    </a-entity>


  </a-scene>


  <script>


    const scene =
      document.querySelector("a-scene");


    const startButton =
      document.querySelector("#start");


    const intro =
      document.querySelector("#intro");


    const loading =
      document.querySelector("#loading");


    const scanning =
      document.querySelector("#scanning");


    const found =
      document.querySelector("#found");


    const video =
      document.querySelector("#film");


    const target =
      document.querySelector("#posterTarget");


    const livingPoster =
      document.querySelector("#livingPoster");


    let fadeTimer = null;


    let fadeAnimation = null;


    /*
    ==============================================
    SET OPACITY
    ==============================================
    */


    function setOpacity(value) {

      const material =
        livingPoster.components
          .material
          .material;


      if (
        material &&
        material.uniforms &&
        material.uniforms.uOpacity
      ) {

        material
          .uniforms
          .uOpacity
          .value = value;

      }

    }


    /*
    ==============================================
    FADE IN
    ==============================================
    */


    function fadeIn() {

      const startTime =
        performance.now();


      const duration =
        1500;


      function animate() {


        const elapsed =
          performance.now() -
          startTime;


        const progress =
          Math.min(
            elapsed / duration,
            1
          );


        const eased =
          progress *
          progress *
          (3 - 2 * progress);


        setOpacity(eased);


        if (progress < 1) {

          fadeAnimation =
            requestAnimationFrame(
              animate
            );

        }

      }


      animate();

    }


    /*
    ==============================================
    RESET
    ==============================================
    */


    function reset() {


      if (fadeTimer) {

        clearTimeout(
          fadeTimer
        );

      }


      if (fadeAnimation) {

        cancelAnimationFrame(
          fadeAnimation
        );

      }


      video.pause();

      video.currentTime = 0;


      setOpacity(0);

    }


    /*
    ==============================================
    START
    ==============================================
    */


    startButton.addEventListener(
      "click",
      async () => {


        intro.style.display =
          "none";


        loading.style.display =
          "flex";


        const mindar =
          scene.systems[
            "mindar-image-system"
          ];


        try {


          await mindar.start();


          loading.style.display =
            "none";


          scanning.style.display =
            "block";


        }

        catch (error) {


          console.error(error);


          loading.innerHTML =
            "Unable to access the camera.";

        }

      }
    );


    /*
    ==============================================
    POSTER FOUND
    ==============================================
    */


    target.addEventListener(
      "targetFound",
      () => {


        console.log(
          "POSTER FOUND"
        );


        scanning.style.display =
          "none";


        found.style.display =
          "block";


        setTimeout(
          () => {

            found.style.display =
              "none";

          },
          1200
        );


        /*
        Start video from beginning.
        */

        video.currentTime = 0;


        video.play().catch(
          error => {

            console.log(
              "Playback error:",
              error
            );

          }
        );


        /*
        Keep the AR layer invisible
        for the first 2 seconds.
        */

        setOpacity(0);


        /*
        Then reveal the living
        poster effect.
        */

        fadeTimer =
          setTimeout(
            () => {

              fadeIn();

            },
            2000
          );


      }
    );


    /*
    ==============================================
    POSTER LOST
    ==============================================
    */


    target.addEventListener(
      "targetLost",
      () => {


        console.log(
          "POSTER LOST"
        );


        scanning.style.display =
          "block";


        found.style.display =
          "none";


        reset();


      }
    );


  </script>


</body>

</html>
