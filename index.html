<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AR Poster Experience</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #050505;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* =====================================================
       PORTFOLIO ENTRY PAGE
    ===================================================== */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 10000;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 30px;
      text-align: center;
      color: white;

      background: linear-gradient(45deg, #0f0c29, #302b63, #24243e, #0a0a0a);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      z-index: -1;
      animation: floatOrb 8s infinite alternate ease-in-out;
    }
    .bg-orb-1 {
      width: 250px; height: 250px;
      background: rgba(255, 126, 95, 0.25);
      top: 10%; left: -10%;
      animation-delay: 0s;
    }
    .bg-orb-2 {
      width: 200px; height: 200px;
      background: rgba(0, 212, 255, 0.25);
      bottom: 10%; right: -5%;
      animation-delay: -4s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -50px) scale(1.1); }
    }

    .intro-logo {
      width: 96px;
      height: 96px;
      margin-bottom: 30px;
      border-radius: 26px;
      box-shadow: 0 15px 45px rgba(255, 126, 95, 0.4), inset 0 0 0 1px rgba(255,255,255,0.2);
      object-fit: cover;
      animation: floatLogo 4s ease-in-out infinite;
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    #intro h1 {
      margin: 0 0 16px;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #ffffff 0%, #dcdcdc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    #intro p {
      max-width: 310px;
      margin: 0 0 45px;
      line-height: 1.6;
      font-size: 17px;
      color: rgba(255,255,255,0.85);
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    #start {
      position: relative;
      overflow: hidden;
      padding: 18px 46px;
      border: none;
      border-radius: 999px;
      background: white;
      color: #050505;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.25);
      transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    #start::after {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
      transform: skewX(-20deg);
      animation: sweepShine 3s infinite;
    }

    @keyframes sweepShine {
      0% { left: -100%; }
      20% { left: 200%; }
      100% { left: 200%; }
    }

    #start:active {
      transform: scale(0.92);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
    }

    /* LOADING */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 9500;
      display: none;
      align-items: center;
      justify-content: center;
      color: white;
      background: black;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    /* SCANNING UI */
    #scanning {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: none;
      pointer-events: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    #scanning::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 70% 60% at 50% 50%,
        transparent 40%,
        rgba(0, 0, 0, 0.55) 100%
      );
    }

    .scan-frame {
      position: relative;
      width: min(72vw, 260px);
      aspect-ratio: 3 / 4;
      border-radius: 10px;
      overflow: hidden;
    }

    .scan-frame::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    .scan-corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: white;
      border-style: solid;
      animation: scanCornerPulse 2s ease-in-out infinite;
    }

    .scan-corner.tl { top: 0; left: 0; border-width: 2.5px 0 0 2.5px; border-radius: 6px 0 0 0; animation-delay: 0s; }
    .scan-corner.tr { top: 0; right: 0; border-width: 2.5px 2.5px 0 0; border-radius: 0 6px 0 0; animation-delay: 0.25s; }
    .scan-corner.bl { bottom: 0; left: 0; border-width: 0 0 2.5px 2.5px; border-radius: 0 0 0 6px; animation-delay: 0.5s; }
    .scan-corner.br { bottom: 0; right: 0; border-width: 0 2.5px 2.5px 0; border-radius: 0 0 6px 0; animation-delay: 0.75s; }

    @keyframes scanCornerPulse {
      0%, 100% { opacity: 1;    transform: scale(1);    }
      50%      { opacity: 0.3; transform: scale(0.92); }
    }

    .scan-sweep {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(
        to right,
        transparent 0%,
        rgba(255, 255, 255, 0.7) 35%,
        white 50%,
        rgba(255, 255, 255, 0.7) 65%,
        transparent 100%
      );
      box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.35);
      animation: scanSweep 2.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    @keyframes scanSweep {
      0%   { top: 0%;   opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .scan-label {
      position: relative;
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      display: flex;
      align-items: baseline;
      gap: 1px;
    }

    .scan-dot {
      opacity: 0;
      animation: dotBlink 1.5s ease-in-out infinite;
    }
    .scan-dot:nth-child(1) { animation-delay: 0s; }
    .scan-dot:nth-child(2) { animation-delay: 0.3s; }
    .scan-dot:nth-child(3) { animation-delay: 0.6s; }

    @keyframes dotBlink {
      0%, 100% { opacity: 0; }
      50%      { opacity: 1; }
    }

    /* FOUND */
    #found {
      position: fixed;
      z-index: 9000;
      left: 50%;
      bottom: 50px;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      font-size: 14px;
      display: none;
    }
  </style>
</head>

<body>

    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

  <script>
    /* ====================================================
       VERSION / CACHE BUSTING
    ==================================================== */
    const APP_VERSION = "2026-08-27-v7";

    (function bustCache() {
      const stored = localStorage.getItem("ar_version");
      if (stored && stored !== APP_VERSION) {
        localStorage.setItem("ar_version", APP_VERSION);
        location.replace(location.pathname + "?v=" + APP_VERSION);
        return;
      }
      localStorage.setItem("ar_version", APP_VERSION);
    })();


    /* ====================================================
       DOM REFERENCES
    ==================================================== */
    const scene       = document.querySelector("a-scene");
    const startButton = document.querySelector("#start");
    const intro       = document.querySelector("#intro");
    const loading     = document.querySelector("#loading");
    const scanning    = document.querySelector("#scanning");
    const found       = document.querySelector("#found");
    const video       = document.querySelector("#film");
    const arVideo     = document.querySelector("#arVideo");
    const target      = document.querySelector("#posterTarget");

    const kiteGroupFront = document.querySelector("#kiteGroupFront");
    const kiteGroupBack  = document.querySelector("#kiteGroupBack");

    const frameTop    = document.querySelector("#frameTop");
    const frameBottom = document.querySelector("#frameBottom");
    const frameLeft   = document.querySelector("#frameLeft");
    const frameRight  = document.querySelector("#frameRight");

    const kiteOrange  = document.querySelector("#kiteOrangeAR");
    const kiteWhite   = document.querySelector("#kiteWhiteAR");
    const kiteBlue    = document.querySelector("#kiteBlueAR");
    const kiteOrange2 = document.querySelector("#kiteOrange2");
    const kiteBlue2   = document.querySelector("#kiteBlue2");
    const kiteWhite2  = document.querySelector("#kiteWhite2");
    const kiteOrange3 = document.querySelector("#kiteOrange3");
    const kiteBlue3   = document.querySelector("#kiteBlue3");

    const extraKites = [kiteOrange2, kiteBlue2, kiteWhite2, kiteOrange3, kiteBlue3];
    const allKites = [kiteOrange, kiteWhite, kiteBlue, ...extraKites];

    const sparks = [
      document.querySelector("#spark1"),
      document.querySelector("#spark2"),
      document.querySelector("#spark3"),
      document.querySelector("#spark4"),
      document.querySelector("#spark5")
    ];

    const glints = [
      document.querySelector("#glint1"),
      document.querySelector("#glint2"),
      document.querySelector("#glint3")
    ];

    const trailPool = [...document.querySelectorAll(".trail-dot")];
    let trailPoolIdx = 0;


    /* ====================================================
       STATE
    ==================================================== */
    let tracked          = false;
    let fadeTimer        = null;
    let revealRaf        = null;
    let fadeOutAnimation = null;
    let kiteTimers       = [];
    let kiteLoopTimer    = null;
    let audioCtx         = null;

    let gyroTargetX = 0;
    let gyroTargetY = 0;
    let parallaxRaf = null;


    /* ====================================================
       AUDIO 
    ==================================================== */
    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function playDetectionChime() {
      try {
        const ctx = ensureAudio();
        [880, 1108].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.18 - i * 0.04, ctx.currentTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
          osc.start(ctx.currentTime + i * 0.015);
          osc.stop(ctx.currentTime + 1.2);
        });
      } catch (e) {}
    }

    function playWhoosh() {
      try {
        const ctx = ensureAudio();
        const bufferSize = ctx.sampleRate * 0.6;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(800, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.6);
        filter.Q.value = 0.8;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.22, ctx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
        source.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
        source.start(ctx.currentTime);
      } catch (e) {}
    }

    function vibrate() {
      if (navigator.vibrate) navigator.vibrate([50, 30, 80]);
    }

    /* ====================================================
       INTERACTIVE TOUCH PARTICLES
    ==================================================== */
    function spawnMagicBurst() {
      for(let i=0; i<25; i++) {
        const t = document.createElement('a-sphere');
        t.setAttribute('radius', '0.004');
        const color = Math.random() > 0.5 ? '#00d4ff' : '#ff7e5f';
        t.setAttribute('material', `shader: flat; color: ${color}; transparent: true; opacity: 1`);
        t.setAttribute('position', `0 0 0.01`);
        target.appendChild(t);

        const angle = Math.random() * Math.PI * 2;
        const spread = 0.15 + Math.random() * 0.35;
        const targetX = Math.cos(angle) * spread;
        const targetY = Math.sin(angle) * spread;
        const targetZ = 0.1 + Math.random() * 0.3; // Blast outwards

        const duration = 1200 + Math.random() * 800;
        const start = performance.now();

        function anim() {
          const p = Math.min((performance.now() - start) / duration, 1);
          const ease = 1 - Math.pow(1 - p, 3);
          
          t.object3D.position.set(
            targetX * ease,
            targetY * ease,
            0.01 + (targetZ - 0.01) * ease
          );
          
          const mesh = t.object3D.children[0];
          if(mesh && mesh.material) {
            mesh.material.opacity = 1 - p;
            mesh.material.needsUpdate = true;
          }

          if(p < 1 && tracked) requestAnimationFrame(anim);
          else if (t.parentNode) t.parentNode.removeChild(t);
        }
        requestAnimationFrame(anim);
      }
    }

    window.addEventListener('touchstart', (e) => {
      if (!tracked) return;
      vibrate();
      playWhoosh();
      spawnMagicBurst();
    });
    window.addEventListener('mousedown', (e) => {
      if (!tracked) return;
      spawnMagicBurst();
    });


    /* ====================================================
       OPACITY HELPERS
    ==================================================== */
    function setVideoOpacity(value) {
      const material = arVideo.getAttribute("material");
      if(material) {
        material.opacity = value;
        arVideo.setAttribute("material", material);
      }
    }

    function setEntityOpacity(entity, value) {
      const material = entity.getAttribute("material");
      if(material) {
        material.opacity = value;
        entity.setAttribute("material", material);
      }
    }


    /* ====================================================
       MULTI-LAYER GYRO PARALLAX
    ==================================================== */
    function handleOrientation(e) {
      const gamma = Math.max(-45, Math.min(45, e.gamma || 0));
      const beta  = Math.max(-45, Math.min(45, e.beta  || 0));
      gyroTargetX = -(gamma / 45);
      gyroTargetY =  (beta  / 45);
    }

    function runParallaxLoop() {
      if (!tracked) {
        kiteGroupFront.object3D.position.set(0, 0, 0);
        kiteGroupBack.object3D.position.set(0, 0, 0);
        parallaxRaf = null;
        return;
      }
      const fPos = kiteGroupFront.object3D.position;
      fPos.x += ((gyroTargetX * 0.20) - fPos.x) * 0.08;
      fPos.y += ((gyroTargetY * 0.14) - fPos.y) * 0.08;

      const bPos = kiteGroupBack.object3D.position;
      bPos.x += ((gyroTargetX * 0.04) - bPos.x) * 0.05;
      bPos.y += ((gyroTargetY * 0.03) - bPos.y) * 0.05;

      parallaxRaf = requestAnimationFrame(runParallaxLoop);
    }

    function startParallaxLoop() {
      if (!parallaxRaf) parallaxRaf = requestAnimationFrame(runParallaxLoop);
    }
    function stopParallaxLoop() {
      if (parallaxRaf) { cancelAnimationFrame(parallaxRaf); parallaxRaf = null; }
      kiteGroupFront.object3D.position.set(0, 0, 0);
      kiteGroupBack.object3D.position.set(0, 0, 0);
    }


    /* ====================================================
       WIND TRAIL SYSTEM
    ==================================================== */
    function spawnTrail(x, y, z, baseOpacity) {
      const t = trailPool[trailPoolIdx % trailPool.length];
      trailPoolIdx++;
      t.object3D.position.set(x, y, z - 0.003);
      const startX = x, startY = y;
      const driftDir = (trailPoolIdx % 2 === 0) ? 1 : -1;
      const startTime = performance.now();
      
      function fade() {
        const p = Math.min((performance.now() - startTime) / 560, 1);
        const ease = 1 - Math.pow(1 - p, 2);
        t.object3D.position.y = startY + ease * 0.022;
        t.object3D.position.x = startX + driftDir * ease * 0.007;
        const op = p < 0.12 ? (p / 0.12) * baseOpacity : baseOpacity * (1 - (p - 0.12) / 0.88);
        const mesh = t.object3D.children[0];
        if (mesh && mesh.material) {
          mesh.material.opacity = Math.max(0, op);
          mesh.material.needsUpdate = true;
        }
        if (p < 1) requestAnimationFrame(fade);
        else if (mesh && mesh.material) {
          mesh.material.opacity = 0;
          mesh.material.needsUpdate = true;
          t.object3D.position.set(0, -5, 0);
        }
      }
      requestAnimationFrame(fade);
    }


    /* ====================================================
       THIN ELEGANT FRAME ANIMATION
    ==================================================== */
    function animateFrameIn() {
      const bars = [ ["x", frameTop, 0], ["x", frameBottom, 55], ["y", frameLeft, 120], ["y", frameRight, 120] ];
      bars.forEach(([axis, el, delay]) => {
        setEntityOpacity(el, 0.7);
        el.object3D.scale[axis] = 0;
        setTimeout(() => {
          if (!tracked) return;
          const start = performance.now();
          function anim() {
            const p = Math.min((performance.now() - start) / 380, 1);
            el.object3D.scale[axis] = 1 - Math.pow(1 - p, 3);
            if (p < 1) requestAnimationFrame(anim);
          }
          requestAnimationFrame(anim);
        }, delay);
      });
    }

    function animateFrameOut(duration) {
      [frameTop, frameBottom, frameLeft, frameRight].forEach(el => {
        const mat = el.getAttribute("material");
        const startOp = mat ? (mat.opacity || 0) : 0;
        if (startOp <= 0) return;
        const start = performance.now();
        function anim() {
          const p = Math.min((performance.now() - start) / duration, 1);
          setEntityOpacity(el, startOp * (1 - p));
          if (p < 1) requestAnimationFrame(anim);
          else el.object3D.scale.set(1, 1, 1);
        }
        requestAnimationFrame(anim);
      });
    }


    /* ====================================================
       RESET KITES
    ==================================================== */
    function resetKites() {
      kiteTimers.forEach(timer => clearTimeout(timer));
      kiteTimers = [];

      const startPositions = {
        kiteOrange:  [-0.207, 0.165], kiteWhite:   [-0.105, 0.190],
        kiteBlue:    [ 0.135, 0.165], kiteOrange2: [-0.36,  0.08 ],
        kiteBlue2:   [ 0.34,  0.12 ], kiteWhite2:  [ 0.22,  0.25 ],
        kiteOrange3: [-0.43,  0.20 ], kiteBlue3:   [ 0.43,  0.24 ]
      };
      const namedKites = [
        ["kiteOrange", kiteOrange], ["kiteWhite", kiteWhite], ["kiteBlue", kiteBlue],
        ["kiteOrange2", kiteOrange2], ["kiteBlue2", kiteBlue2], ["kiteWhite2", kiteWhite2],
        ["kiteOrange3", kiteOrange3], ["kiteBlue3", kiteBlue3]
      ];

      namedKites.forEach(([name, kite]) => {
        const [x, y] = startPositions[name];
        kite.object3D.position.set(x, y, 0.025);
        kite.object3D.rotation.z = Math.PI / 4;
        setEntityOpacity(kite, 0);
      });

      sparks.forEach(spark => setEntityOpacity(spark, 0));
      glints.forEach(glint => { setEntityOpacity(glint, 0); glint.object3D.scale.set(0.5, 0.5, 0.5); });

      trailPool.forEach(t => {
        const mesh = t.object3D && t.object3D.children[0];
        if (mesh && mesh.material) { mesh.material.opacity = 0; mesh.material.needsUpdate = true; }
        t.object3D.position.set(0, -5, 0);
      });
    }


    /* ====================================================
       ANIMATE KITES
    ==================================================== */
    function animateKite(kite, startX, startY, endX, endY, duration, delay) {
      const timer = setTimeout(() => {
        if (!tracked) return;
        const startTime = performance.now();
        let lastTrailProg = -0.09;

        function frame() {
          if (!tracked) return;
          const progress = Math.min((performance.now() - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const arc = Math.sin(progress * Math.PI) * 0.055;
          const x = startX + (endX - startX) * eased;
          const y = startY + (endY - startY) * eased + arc;
          const z = 0.025 + (0.14 - 0.025) * eased;

          kite.object3D.position.set(x, y, z);
          kite.object3D.rotation.z = Math.PI / 4 + progress * Math.PI * 2.35;

          let opacity = progress < 0.08 ? progress / 0.08 : (progress < 0.72 ? 1 : 1 - ((progress - 0.72) / 0.28));
          setEntityOpacity(kite, opacity);

          if (progress - lastTrailProg >= 0.07 && progress > 0.06 && progress < 0.87) {
            lastTrailProg = progress;
            spawnTrail(x, y, z, opacity * 0.52);
          }
          if (progress < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }, delay);
      kiteTimers.push(timer);
    }


    /* ====================================================
       LAUNCH ALL KITES
    ==================================================== */
    function launchKites() {
      resetKites();
      playWhoosh();
      animateKite(kiteOrange, -0.207, 0.165, -0.46, 0.60, 1700, 0);
      animateKite(kiteWhite,  -0.105, 0.190, -0.02, 0.68, 1850, 140);
      animateKite(kiteBlue,    0.135, 0.165,  0.46, 0.58, 1950, 260);
      animateKite(kiteOrange2, -0.36, 0.08, -0.60, 0.34, 1450, 420);
      animateKite(kiteBlue2,    0.34, 0.12,  0.62, 0.42, 1500, 560);
      animateKite(kiteWhite2,   0.22, 0.25,  0.34, 0.66, 1650, 720);
      animateKite(kiteOrange3, -0.43, 0.20, -0.66, 0.50, 1350, 880);
      animateKite(kiteBlue3,    0.43, 0.24,  0.68, 0.54, 1450, 1020);

      sparks.forEach((spark, index) => {
        const timer = setTimeout(() => {
          if (!tracked) return;
          const start = spark.object3D.position.clone();
          const startTime = performance.now();
          const duration = 900 + index * 120;
          const targetX = start.x + (index % 2 === 0 ? -1 : 1) * (0.06 + index * 0.008);
          const targetY = start.y + 0.10 + index * 0.012;

          function sparkFrame() {
            if (!tracked) return;
            const progress = Math.min((performance.now() - startTime) / duration, 1);
            const eased = 1 - Math.pow(1 - p, 3);
            spark.object3D.position.x = start.x + (targetX - start.x) * eased;
            spark.object3D.position.y = start.y + (targetY - start.y) * eased;
            const opacity = progress < 0.15 ? progress / 0.15 : 1 - ((progress - 0.15) / 0.85);
            setEntityOpacity(spark, Math.max(0, opacity * 0.8));
            if (progress < 1) requestAnimationFrame(sparkFrame);
          }
          requestAnimationFrame(sparkFrame);
        }, 450 + index * 90);
        kiteTimers.push(timer);
      });

      glints.forEach((glint, index) => {
        const timer = setTimeout(() => {
          if (!tracked) return;
          const start = performance.now();
          function glintFrame() {
            if (!tracked) return;
            const progress = Math.min((performance.now() - start) / 700, 1);
            const brightness = Math.sin(progress * Math.PI);
            const scale = 0.5 + brightness * 1.5;
            glint.object3D.scale.set(scale, scale, scale);
            setEntityOpacity(glint, brightness * 0.95);
            if (progress < 1) requestAnimationFrame(glintFrame);
          }
          requestAnimationFrame(glintFrame);
        }, 600 + index * 430);
        kiteTimers.push(timer);
      });
    }

    function startKiteLoop() {
      stopKiteLoop();
      kiteLoopTimer = setInterval(() => { if (!tracked) stopKiteLoop(); else launchKites(); }, 4200);
    }
    function stopKiteLoop() {
      if (kiteLoopTimer !== null) { clearInterval(kiteLoopTimer); kiteLoopTimer = null; }
    }


    /* ====================================================
       FLAT CINEMATIC REVEAL (Fixes perspective cutoffs)
    ==================================================== */
    function smoothCinematicReveal() {
      if (revealRaf) cancelAnimationFrame(revealRaf);
      
      arVideo.object3D.position.set(0, 0, 0.005);
      arVideo.object3D.scale.set(0.95, 0.95, 1);
      setVideoOpacity(0);
      
      const start = performance.now();
      const duration = 1200;

      function anim() {
        if (!tracked) { setVideoOpacity(0); return; }
        const p = Math.min((performance.now() - start) / duration, 1);
        const ease = 1 - Math.pow(1 - p, 3);
        
        const currentScale = 0.95 + (0.05 * ease);
        arVideo.object3D.scale.set(currentScale, currentScale, 1);
        
        const opEase = Math.min(p / 0.6, 1);
        setVideoOpacity(opEase);

        if (p < 1) revealRaf = requestAnimationFrame(anim);
      }
      revealRaf = requestAnimationFrame(anim);
    }


    /* ====================================================
       VIDEO FADE OUT / RESET
    ==================================================== */
    function fadeVideoOut(onComplete) {
      if (revealRaf) { cancelAnimationFrame(revealRaf); revealRaf = null; }
      if (fadeOutAnimation) { cancelAnimationFrame(fadeOutAnimation); fadeOutAnimation = null; }

      const startOpacity = arVideo.getAttribute("material")?.opacity || 0;
      if (startOpacity <= 0) { onComplete && onComplete(); return; }

      const startTime = performance.now();
      function animate() {
        const progress = Math.min((performance.now() - startTime) / 600, 1);
        setVideoOpacity(startOpacity * (1 - progress));

        if (progress < 1) {
          fadeOutAnimation = requestAnimationFrame(animate);
        } else {
          fadeOutAnimation = null;
          video.pause(); video.currentTime = 0; 
          setVideoOpacity(0);
          onComplete && onComplete();
        }
      }
      fadeOutAnimation = requestAnimationFrame(animate);
    }

    function resetVideo() {
      if (fadeTimer) { clearTimeout(fadeTimer); fadeTimer = null; }
      if (revealRaf) { cancelAnimationFrame(revealRaf); revealRaf = null; }
      if (fadeOutAnimation) { cancelAnimationFrame(fadeOutAnimation); fadeOutAnimation = null; }
      video.pause(); video.currentTime = 0; 
      setVideoOpacity(0);
    }


    function fadeKitesOut(duration, onComplete) {
      const startTime = performance.now();
      const kiteStartOps = allKites.map(k => k.getAttribute("material")?.opacity || 0);
      const sparkStartOps = sparks.map(s => s.getAttribute("material")?.opacity || 0);
      const glintStartOps = glints.map(g => g.getAttribute("material")?.opacity || 0);

      function frame() {
        const progress = Math.min((performance.now() - startTime) / duration, 1);
        allKites.forEach((k, i) => setEntityOpacity(k, kiteStartOps[i] * (1 - progress)));
        sparks.forEach((s, i) => setEntityOpacity(s, sparkStartOps[i] * (1 - progress)));
        glints.forEach((g, i) => setEntityOpacity(g, glintStartOps[i] * (1 - progress)));
        if (progress < 1) requestAnimationFrame(frame); else onComplete && onComplete();
      }
      requestAnimationFrame(frame);
    }


    /* ====================================================
       START AR
    ==================================================== */
    startButton.addEventListener("click", async () => {
      ensureAudio();

      video.muted = true; 
      video.play().then(() => {
        video.pause();
        video.currentTime = 0;
        video.muted = false;
      }).catch(err => console.warn("Video unlock failed:", err));

      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        try {
          const state = await DeviceOrientationEvent.requestPermission();
          if (state === "granted") window.addEventListener("deviceorientation", handleOrientation);
        } catch (e) {}
      } else {
        window.addEventListener("deviceorientation", handleOrientation);
      }

      intro.style.display = "none";
      loading.style.display = "flex";
      
      const mindar = scene.systems["mindar-image-system"];
      try {
        await mindar.start();
        loading.style.display = "none";
        scanning.style.display = "flex";
      } catch (error) {
        console.error(error);
        loading.innerHTML = "Unable to access the camera.";
      }
    });


    /* ====================================================
       POSTER FOUND
    ==================================================== */
    target.addEventListener("targetFound", () => {
      if (tracked) return;
      tracked = true;

      scanning.style.display = "none";
      found.style.display = "block";
      setTimeout(() => { found.style.display = "none"; }, 1200);

      vibrate();
      playDetectionChime();
      animateFrameIn();
      resetKites();
      resetVideo();

      video.currentTime = 0;
      video.play().catch(err => console.log("Video playback:", err));

      launchKites();
      startKiteLoop();
      startParallaxLoop();

      // Trigger standard flat reveal after 2 seconds
      fadeTimer = setTimeout(() => {
        if (!tracked) return;
        smoothCinematicReveal();
      }, 2000);
    });


    /* ====================================================
       POSTER LOST
    ==================================================== */
    target.addEventListener("targetLost", () => {
      tracked = false;
      stopKiteLoop();
      stopParallaxLoop();
      kiteTimers.forEach(t => clearTimeout(t)); kiteTimers = [];
      if (fadeTimer) { clearTimeout(fadeTimer); fadeTimer = null; }
      
      animateFrameOut(400);
      fadeKitesOut(400, () => resetKites());
      fadeVideoOut(() => {});
      
      setTimeout(() => { if (!tracked) scanning.style.display = "flex"; }, 350);
      found.style.display = "none";
    });

  </script>
</body>
