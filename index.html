          sum += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
        }
        return sum / (d.length / 4);
      } catch (e) { return -1; }
    }

    function updateScanCoach(dt) {
      coachAcc += dt;
      if (coachAcc < 700) return;
      coachAcc = 0;

      const lum = sampleBrightness();
      if (lum >= 0) coachDark = lum < 42;

      let msg, warn = false;
      if (coachDark) {
        msg = "Too dark — find more light";
        warn = true;
      } else if (lostCount >= 3) {
        msg = "Hold steady";
        warn = true;
      } else if (scanClock < 6000) {
        msg = "Scanning…";
      } else if (scanClock < 14000) {
        msg = "Fill the frame with the poster";
      } else {
        msg = "Move closer, and hold the phone steady";
        warn = true;
      }

      if (scanLabel.textContent !== msg) scanLabel.textContent = msg;
      scanLabel.classList.toggle("warn", warn);
    }

    function getCameraVideo() {
      try {
        const sys = sceneEl.systems["mindar-image-system"];
        if (sys && sys.video) return sys.video;
      } catch (e) {}
      const vids = document.querySelectorAll("video");
      for (const v of vids) if (v !== video) return v;
      return null;
    }


    /* ====================================================
       BLOW TO FLY
       Mic through a lowpass so breath rumble scores far higher
       than speech or room noise. The film is muted while wind
       mode is on, otherwise the speaker feeds back into the mic
       and every kite launches at once forever.
    ==================================================== */
    let micAnalyser = null, micData = null, micStream = null;

    async function enableWind() {
      if (micAnalyser) { windMode = true; applyWindMode(); return; }
      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        const ctx = ensureAudio();
        const src = ctx.createMediaStreamSource(micStream);
        const lp = ctx.createBiquadFilter();
        lp.type = "lowpass"; lp.frequency.value = 420; lp.Q.value = 0.7;
        const an = ctx.createAnalyser();
        an.fftSize = 512;
        an.smoothingTimeConstant = 0.55;
        src.connect(lp); lp.connect(an);       /* never connected to destination */
        micAnalyser = an;
        micData = new Uint8Array(an.fftSize);
        windMode = true;
        applyWindMode();
      } catch (e) {
        showChip("Microphone unavailable", 2600);
        windMode = false;
        btnWind.classList.remove("on");
      }
    }

    function disableWind() {
      windMode = false;
      gust = 0;
      applyWindMode();
    }

    function applyWindMode() {
      btnWind.classList.toggle("on", windMode);
      /* Mute the film while listening so it can't trigger itself */
      video.muted = windMode ? true : !soundOn;
      if (windMode) showChip("Wind mode — blow at your phone 🌬️", 3200);
      else hideChip();
    }

    function updateMic(dt) {
      if (!windMode || !micAnalyser) {
        if (gust > 0) gust = Math.max(0, gust - dt / 700);
        return;
      }
      micAnalyser.getByteTimeDomainData(micData);
      let sum = 0;
      for (let i = 0; i < micData.length; i++) {
        const v = (micData[i] - 128) / 128;
        sum += v * v;
      }
      const rms = Math.sqrt(sum / micData.length);
      const raw = clamp((rms - CONFIG.blowThreshold) / (CONFIG.blowCeiling - CONFIG.blowThreshold), 0, 1);
      /* attack fast, release slow */
      gust += (raw - gust) * (raw > gust ? 0.35 : 0.06);

      if (gust > 0.55 && sessionLive && tracked) {
        const idle = kites.filter(k => !k.active);
        if (idle.length && Math.random() < 0.25) {
          const k = idle[Math.floor(Math.random() * idle.length)];
          k.active = true; k.wait = 0; k.t = 0;
          k.speed = 1.4; k.lift = 0.03; k.spin = 2; k.pop = 0.2;
        }
      }
    }


    /* ====================================================
       TRACKING
    ==================================================== */
    function onTargetFound() {
      tracked = true;
      clearTimeout(graceTimer); graceTimer = null;

      if (sessionLive) {
        /* Re-acquired inside the grace window: no restart, no
           two-second wait, no rewinding the film. */
        hideChip();
        setState("tracking");
        if (portalOn && portalGroup) portalGroup.visible = true;
        if (hasRevealed && video.paused && !cinema) video.play().catch(() => {});
        return;
      }

      sessionLive = true;
      scanClock = 0;
      setState("tracking");
      showChip("✓ Poster detected", 1400);
      vibrate([50, 30, 80]);
      playDetectionChime();

      startWindBed();
      setWindLevel(todPalette().wind, 2.0);

      if (portalOn) openPortal();
      animateFrameIn();
      resetKites();
      launchKites(false);
      kiteClock = 0;

      playFilm();

      if (hasRevealed) {
        revealFilm();
      } else {
        clearTimeout(revealTimer);
        revealTimer = setTimeout(() => { if (sessionLive) revealFilm(); }, CONFIG.firstRevealDelay);
      }
    }

    function onTargetLost() {
      tracked = false;

      /* Count dropouts so the coach can say "hold steady" */
      lostCount++;
      lostWindow = 10000;

      if (!sessionLive) return;

      /* Do NOT tear down. Keep the audio running so the film feels
         continuous, and give the user a moment to re-aim. */
      showChip("Realigning…", 0);
      clearTimeout(graceTimer);
      graceTimer = setTimeout(endSession, CONFIG.graceMs);
    }

    function endSession() {
      graceTimer = null;
      sessionLive = false;
      hideChip();
      clearTimeout(revealTimer);

      saveProgress();
      wantPlaying = false;
      video.pause();              /* NOTE: currentTime is preserved */

      setWindLevel(0, 0.8);
      animateFrameOut(400);
      fadeAllOut(400);
      closePortal();

      scanClock = 0;
      setState("scanning");
      scanLabel.textContent = "Scanning…";
    }

    function playFilm() {
      if (cinema) return;
      wantPlaying = true;
      video.muted = windMode ? true : !soundOn;
      const p = video.play();
      if (p && p.catch) {
        p.catch(() => {
          /* Autoplay with sound refused — fall back to muted */
          video.muted = true;
          video.play().catch(() => {});
          showChip("Tap 🔊 for sound", 3000);
        });
      }
      if (pendingSeek > 0) {
        const seek = pendingSeek;
        pendingSeek = 0;
        const apply = () => { try { video.currentTime = seek; } catch (e) {} };
        if (video.readyState >= 1) apply();
        else video.addEventListener("loadedmetadata", apply, { once: true });
      }
    }


    /* ====================================================
       PROGRESS PERSISTENCE
    ==================================================== */
    let lastSave = 0;
    video.addEventListener("timeupdate", () => {
      const now = performance.now();
      if (now - lastSave < 4000) return;
      lastSave = now;
      saveProgress();
    });

    function saveProgress() {
      if (!video.duration || !isFinite(video.duration)) return;
      const t = video.currentTime;
      if (t > 5 && t < video.duration - CONFIG.resumeTailSec) store.set(K_TIME, t.toFixed(1));
      else store.del(K_TIME);
    }

    video.addEventListener("loadedmetadata", () => {
      if (isFinite(video.duration)) {
        document.querySelector("#runtimeLabel").textContent =
          "Short film · " + fmtTime(video.duration);
      }
    });

    /* Bind the GL texture only once real frames exist. Binding a
       preload="none" video produces an empty texture. */
    video.addEventListener("loadeddata", () => {
      if (videoBound) return;
      videoBound = true;
      arVideo.setAttribute("material", "src", "#film");
      setOp(arVideo, 0);
      /* Re-apply placement: A-Frame has just rebuilt the material, so
         any stencil state set earlier is gone. Deferred a tick so the
         rebuild has finished. */
      setTimeout(() => applyFilmPlacement(false), 0);
    });


    /* ====================================================
       END OF FILM
    ==================================================== */
    video.addEventListener("ended", () => {
      store.del(K_TIME);
      if (cinema) {
        document.body.classList.add("ended");
        return;
      }
      /* Curtain call: every kite at once, then the card. */
      if (sessionLive) {
        launchKites(true);
        vibrate([30, 40, 30, 40, 60]);
        setWindLevel(0.07, 1.2);
        let t = 0;
        const start = getOp(arVideo);
        addTask(dt => {
          t += dt;
          const p = Math.min(t / 1400, 1);
          setOp(arVideo, start * (1 - p));
          return p < 1;
        });
      }
      setTimeout(() => document.body.classList.add("ended"), 2400);
    });


    /* ====================================================
       CAPTURE & SHARE
    ==================================================== */
    async function captureShot() {
      playShutter();
      flash.classList.remove("fire");
      void flash.offsetWidth;
      flash.classList.add("fire");
      vibrate(18);

      try {
        const gl = sceneEl.renderer.domElement;
        const scale = Math.min(2, window.devicePixelRatio || 1);
        const out = document.createElement("canvas");
        out.width  = Math.round(window.innerWidth  * scale);
        out.height = Math.round(window.innerHeight * scale);
        const g = out.getContext("2d");

        g.fillStyle = "#000";
        g.fillRect(0, 0, out.width, out.height);

        /* Camera feed is a DOM <video> behind the canvas, so it has
           to be drawn separately — its on-screen rect tells us how
           MindAR cropped it. */
        const cam = getCameraVideo();
        if (cam && cam.videoWidth) {
          const r = cam.getBoundingClientRect();
          g.drawImage(cam, r.left * scale, r.top * scale, r.width * scale, r.height * scale);
        }

        /* Re-render synchronously, then read before the buffer is
           cleared — avoids paying for preserveDrawingBuffer. */
        sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
        g.drawImage(gl, 0, 0, out.width, out.height);

        const pad = 22 * scale;
        g.font = "600 " + Math.round(13 * scale) + "px -apple-system, Segoe UI, Roboto, sans-serif";
        g.textAlign = "right";
        g.shadowColor = "rgba(0,0,0,0.6)";
        g.shadowBlur = 8 * scale;
        g.fillStyle = "rgba(255,255,255,0.9)";
        g.fillText("Into the Void · AR", out.width - pad, out.height - pad);

        const blob = await new Promise(res => out.toBlob(res, "image/png"));
        if (!blob) throw new Error("no blob");

        const file = new File([blob], "into-the-void.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: "Into the Void" });
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = "into-the-void.png";
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 5000);
          showChip("Saved to your device", 2200);
        }
      } catch (e) {
        if (e && e.name !== "AbortError") showChip("Couldn't capture that one", 2400);
      }
    }


    /* ====================================================
       CINEMA MODE
       Nobody holds a phone against a wall for six minutes. The
       AR is the hook; this is where the film actually gets
       watched. Same <video> element throughout, so playback
       position and buffer survive the switch.
    ==================================================== */
    function enterCinema(fromIntro) {
      if (cinema) return;
      cinema = true;
      wantPlaying = true;
      cinemaFromIntro = !!fromIntro;
      document.body.classList.add("cinema");
      video.setAttribute("controls", "");
      video.muted = !soundOn;
      updateSoundButtons();

      if (windMode) disableWind();
      setWindLevel(0, 0.4);

      if (arStarted) {
        try { sceneEl.systems["mindar-image-system"].pause(false); } catch (e) {}
      }

      if (pendingSeek > 0) {
        const seek = pendingSeek;
        pendingSeek = 0;
        const apply = () => { try { video.currentTime = seek; } catch (e) {} };
        if (video.readyState >= 1) apply();
        else video.addEventListener("loadedmetadata", apply, { once: true });
      }
      video.play().catch(() => {});
    }

    function exitCinema() {
      if (!cinema) return;
      cinema = false;
      document.body.classList.remove("cinema", "ended");
      video.removeAttribute("controls");
      saveProgress();
      wantPlaying = false;

      if (cinemaFromIntro || !arStarted) {
        video.pause();
        setState("intro");
        refreshResumeUI();
        return;
      }

      try { sceneEl.systems["mindar-image-system"].unpause(); } catch (e) {}
      video.pause();
      sessionLive = false;
      tracked = false;
      resetKites();
      setOp(arVideo, 0);
      scanClock = 0;
      setState("scanning");
      scanLabel.textContent = "Scanning…";
    }


    /* ====================================================
       SOUND
    ==================================================== */
    function updateSoundButtons() {
      const icon = soundOn ? "🔊" : "🔇";
      btnSound.textContent = icon;
      btnSound.classList.toggle("on", soundOn);
      btnCineSnd.textContent = icon + " Sound";
    }

    function toggleSound() {
      soundOn = !soundOn;
      store.set(K_SOUND, soundOn ? "1" : "0");
      video.muted = windMode ? true : !soundOn;
      if (!soundOn) setWindLevel(0, 0.3);
      else if (sessionLive && !hasRevealed) setWindLevel(0.05, 0.6);
      updateSoundButtons();
      ensureAudio();
    }


    /* ====================================================
       START
    ==================================================== */
    function patchCameraConstraints() {
      if (!navigator.mediaDevices || navigator.mediaDevices.__arPatched) return;
      const orig = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
      navigator.mediaDevices.getUserMedia = function (c) {
        /* Only touch MindAR's video-only request, never the mic. */
        if (c && c.video && !c.audio) {
          const base = typeof c.video === "object" ? c.video : {};
          c = Object.assign({}, c, {
            video: Object.assign({}, base, {
              width:     { ideal: CONFIG.camWidth },
              height:    { ideal: CONFIG.camHeight },
              frameRate: { ideal: 30 }
            })
          });
        }
        return orig(c);
      };
      navigator.mediaDevices.__arPatched = true;
    }

    function primeVideo() {
      /* Must happen inside the tap, before any await, or iOS
         refuses to ever play this element with sound. */
      video.muted = true;
      try {
        video.load();
        const p = video.play();
        if (p && p.then) {
          p.then(() => {
            /* Cinema mode or targetFound may already have taken
               over — don't pause playback somebody else started. */
            if (!wantPlaying) {
              video.pause();
              video.currentTime = 0;
            }
            video.muted = windMode ? true : !soundOn;
          }).catch(() => { video.muted = windMode ? true : !soundOn; });
        }
      } catch (e) {}
      setupSpatialAudio();
    }

    async function startAR(resumeFrom) {
      if (arStarted) return;
      ensureAudio();
      primeVideo();
      pendingSeek = resumeFrom || 0;

      patchCameraConstraints();

      setState("loading");

      /* Only re-run setup when a URL override is actually present, so
         the default path keeps whatever the mindar-image attribute set. */
      if (TRACK_OVERRIDDEN) {
        try {
          const sys = sceneEl.systems["mindar-image-system"];
          if (sys && typeof sys.setup === "function") {
            sys.setup({
              imageTargetSrc: "./targets.mind?v=2",
              maxTrack: 1,
              showStats: false,
              uiLoading: "no", uiScanning: "no", uiError: "no",
              filterMinCF:     TRACK.filterMinCF,
              filterBeta:      TRACK.filterBeta,
              missTolerance:   TRACK.missTolerance,
              warmupTolerance: TRACK.warmupTolerance
            });
          }
        } catch (e) { console.warn("tracking override failed, using defaults", e); }
      }

      try {
        await sceneEl.systems["mindar-image-system"].start();
        arStarted = true;
        scanClock = 0;
        setState("scanning");
        scanLabel.textContent = "Scanning…";
      } catch (error) {
        console.error(error);
        loading.innerHTML =
          "Unable to access the camera.<br><br>" +
          "<span style='opacity:.6;font-size:13px'>Check camera permission, " +
          "or use “Watch the film” instead.</span>";
      }
    }

    function refreshResumeUI() {
      const saved = parseFloat(store.get(K_TIME, "0"));
      if (saved > CONFIG.resumeMinSec) {
        document.querySelector("#resumeTime").textContent = fmtTime(saved);
        document.body.classList.add("has-resume");
      } else {
        document.body.classList.remove("has-resume");
      }
    }


    /* ====================================================
       CONTACT CARD
       Everything here degrades: leave a CONTACT field blank and
       its link simply doesn't render.
    ==================================================== */
    function buildContactCard() {
      document.querySelector("#endName").textContent = CONTACT.name || "The End";
      const roleEl = document.querySelector("#endRole");
      roleEl.textContent = CONTACT.role || "";
      roleEl.style.display = CONTACT.role ? "" : "none";

      const links = document.querySelector("#endLinks");
      links.innerHTML = "";
      const add = (label, href) => {
        if (!href) return;
        const a = document.createElement("a");
        a.textContent = label;
        a.href = href;
        a.rel = "noopener noreferrer";
        if (!href.startsWith("mailto:")) a.target = "_blank";
        links.appendChild(a);
      };
      add("Email", CONTACT.email ? "mailto:" + CONTACT.email : "");
      add("LinkedIn", CONTACT.linkedin);
      add("Website", CONTACT.site);

      document.querySelector("#btnSaveContact").hidden =
        !(CONTACT.email || CONTACT.phone || CONTACT.linkedin);
    }

    function vcardText() {
      const esc = s => String(s).replace(/([,;\\])/g, "\\$1");
      const l = ["BEGIN:VCARD", "VERSION:3.0"];
      if (CONTACT.name) {
        l.push("FN:" + esc(CONTACT.name));
        l.push("N:" + esc(CONTACT.name) + ";;;;");
      }
      if (CONTACT.role)     l.push("TITLE:" + esc(CONTACT.role));
      if (CONTACT.email)    l.push("EMAIL;TYPE=INTERNET:" + CONTACT.email);
      if (CONTACT.phone)    l.push("TEL;TYPE=CELL:" + CONTACT.phone);
      if (CONTACT.linkedin) l.push("URL:" + CONTACT.linkedin);
      if (CONTACT.site && CONTACT.site !== CONTACT.linkedin) l.push("URL:" + CONTACT.site);
      l.push("END:VCARD");
      return l.join("\r\n");
    }

    async function saveContact() {
      const fname = (CONTACT.name || "contact").trim().replace(/\s+/g, "-").toLowerCase() + ".vcf";
      const blob = new Blob([vcardText()], { type: "text/vcard;charset=utf-8" });
      try {
        const file = new File([blob], fname, { type: "text/vcard" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: CONTACT.name || "Contact" });
          return;
        }
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = fname;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }


    /* ====================================================
       WIRING
    ==================================================== */
    btnStart.addEventListener("click", () => startAR(0));
    document.querySelector("#btnSaveContact").addEventListener("click", saveContact);

    btnResume.addEventListener("click", () => {
      startAR(parseFloat(store.get(K_TIME, "0")) || 0);
    });

    btnNoPoster.addEventListener("click", () => {
      ensureAudio();
      primeVideo();
      pendingSeek = parseFloat(store.get(K_TIME, "0")) || 0;
      enterCinema(true);
    });

    btnSound.addEventListener("click", toggleSound);
    btnCineSnd.addEventListener("click", toggleSound);

    btnWind.addEventListener("click", () => {
      if (windMode) disableWind(); else enableWind();
    });

    btnShot.addEventListener("click", captureShot);
    btnCinema.addEventListener("click", () => enterCinema(false));

    btnPortal.addEventListener("click", () => {
      setPortal(!portalOn, true);
      showChip(portalOn ? "Portal open — look around it" : "Back on the poster", 2200);
      vibrate(12);
    });
    btnExitCine.addEventListener("click", exitCinema);
    btnEndClose.addEventListener("click", () => {
      document.body.classList.remove("ended");
      if (cinema) exitCinema();
    });

    btnReplay.addEventListener("click", () => {
      document.body.classList.remove("ended");
      wantPlaying = true;
      video.currentTime = 0;
      video.play().catch(() => {});
      if (!cinema) enterCinema(!arStarted);
    });

    targetEl.addEventListener("targetFound", onTargetFound);
    targetEl.addEventListener("targetLost", onTargetLost);

    window.addEventListener("pointerdown", onPointerDown, { passive: true });

    /* Pause cleanly when the tab goes away */
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) { saveProgress(); if (!cinema) { wantPlaying = false; video.pause(); } }
    });

    function updateOrientationClass() {
      document.body.classList.toggle("portrait", window.innerHeight > window.innerWidth);
    }
    window.addEventListener("resize", updateOrientationClass);
    window.addEventListener("orientationchange", () => setTimeout(updateOrientationClass, 250));


    /* ====================================================
       INIT
    ==================================================== */
    /* ====================================================
       DEBUG READOUT  (?debug=1)
       If fps is low the tracker is starving and the fix is CPU
       (?camW=640), not filter values.
    ==================================================== */
    let dbgEl = null, dbgFrames = 0, dbgAcc = 0, dbgFps = 0;

    function initDebug() {
      if (!DEBUG) return;
      dbgEl = document.createElement("div");
      dbgEl.style.cssText =
        "position:fixed;left:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:13000;" +
        "font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#8fffa8;" +
        "background:rgba(0,0,0,.62);padding:7px 9px;border-radius:8px;white-space:pre;pointer-events:none";
      document.body.appendChild(dbgEl);
    }

    function updateDebug(dt) {
      if (!dbgEl) return;
      dbgFrames++; dbgAcc += dt;
      if (dbgAcc < 500) return;
      dbgFps = Math.round(dbgFrames / (dbgAcc / 1000));
      dbgFrames = 0; dbgAcc = 0;
      const cam = getCameraVideo();
      dbgEl.textContent =
        "fps      " + dbgFps + "\n" +
        "camera   " + (cam && cam.videoWidth ? cam.videoWidth + "x" + cam.videoHeight : "—") + "\n" +
        "minCF    " + TRACK.filterMinCF + "\n" +
        "beta     " + TRACK.filterBeta + "\n" +
        "miss     " + TRACK.missTolerance + "\n" +
        "portal   " + (CONFIG.portal ? "on" : "off") + "\n" +
        "tracked  " + (tracked ? "yes" : "no");
    }


    /* Anything outside the portal must draw after the void, or the
       stencil pass will have it appear through the aperture. */
    function applyOutsideRenderOrder() {
      const bump = (el, order) => {
        const m = el && el.getObject3D("mesh");
        if (m) m.renderOrder = order;
      };
      frameEls.forEach(el => bump(el, 10));
      kites.forEach(k => bump(k.el, 11));
      sparks.forEach(s => bump(s, 11));
      glints.forEach(g => bump(g, 11));
    }

    function init() {
      dotTexture = makeDotTexture();
      buildKites();
      trailsFront = makeTrailSystem(groupFront.object3D);
      trailsBack  = makeTrailSystem(groupBack.object3D);
      applyOutsideRenderOrder();
      resetKites();
      setOp(arVideo, 0);

      /* An explicit ?portal= wins; otherwise remember the viewer's
         last choice; otherwise the seamless default. */
      const saved = store.get(K_PORTAL, null);
      setPortal(QS.has("portal") ? CONFIG.portal
                : (saved !== null ? saved === "1" : CONFIG.portal), false);
      sceneEl.setAttribute("experience-driver", "");
      updateSoundButtons();
      updateOrientationClass();
      refreshResumeUI();
      buildContactCard();
      initDebug();
      setState("intro");
    }

    if (sceneEl.hasLoaded) init();
    else sceneEl.addEventListener("loaded", init);

  })();
  </script>
</body>
</html>
