<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AR Experience</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    /* INTRO */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 10000;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 30px;
      text-align: center;

      color: white;
      background: black;
    }

    #intro h1 {
      margin: 0 0 12px;
      font-size: 28px;
      font-weight: 600;
    }

    #intro p {
      max-width: 320px;
      margin: 0 0 28px;
      line-height: 1.5;
      font-size: 16px;
      opacity: 0.75;
    }

    #start {
      padding: 15px 28px;
      border: none;
      border-radius: 999px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    /* LOADING */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 9500;

      display: none;
      align-items: center;
      justify-content: center;

      color: white;
      background: black;
      font-size: 16px;
    }

    /* SCANNING */
    #scanning {
      position: fixed;
      z-index: 9000;

      left: 50%;
      bottom: 50px;
      transform: translateX(-50%);

      padding: 12px 20px;
      border-radius: 999px;

      background: rgba(0, 0, 0, 0.7);
      color: white;

      font-size: 15px;
      white-space: nowrap;

      display: none;
    }

    /* FOUND */
    #found {
      position: fixed;
      z-index: 9000;

      left: 50%;
      bottom: 50px;
      transform: translateX(-50%);

      padding: 10px 18px;
      border-radius: 999px;

      background: rgba(0, 0, 0, 0.65);
      color: white;

      font-size: 14px;
      display: none;
    }
  </style>
</head>


<body>

  <!-- INTRO -->
  <div id="intro">
    <h1>AR Experience</h1>

    <p>
      Point your camera at the poster
      to bring it to life.
    </p>

    <button id="start">
      Start Experience
    </button>
  </div>


  <!-- LOADING -->
  <div id="loading">
    Starting camera...
  </div>


  <!-- SCANNING -->
  <div id="scanning">
    Point your camera at the poster
  </div>


  <!-- FOUND -->
  <div id="found">
    ✓ Poster detected
  </div>


  <!--
    IMPORTANT:
    This scene structure is intentionally kept close
    to the working V3. Do not add fullscreen CSS to
    a-scene or the camera feed can break.
  -->
  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;

      autoStart: false;

      uiLoading: no;
      uiScanning: no;
      uiError: yes;

      warmupTolerance: 3;
      missTolerance: 5;

      filterMinCF: 0.01;
      filterBeta: 10000;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true,
      physicallyCorrectLights
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >


    <!-- ==================================================
         ASSETS
    ================================================== -->

    <a-assets>

      <video
        id="film"
        src="./film-web.mp4"
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        preload="auto"
      ></video>

      <!-- Put these three files beside index.html -->
      <img id="kiteOrange" src="./kite-orange.png">
      <img id="kiteBlue" src="./kite-blue.png">
      <img id="kiteWhite" src="./kite-white.png">

    </a-assets>


    <!-- ==================================================
         CAMERA
    ================================================== -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>


    <!-- ==================================================
         POSTER TARGET
    ================================================== -->

    <a-entity
      id="posterTarget"
      mindar-image-target="targetIndex: 0"
    >


      <!-- =================================================
           KITE 1
           Starts over the printed kite.
      ================================================= -->

      <a-image
        id="kiteOrangeAR"
        src="#kiteOrange"

        width="0.055"
        height="0.055"

        position="-0.207 0.165 0.025"
        rotation="0 0 45"

        material="
          shader: flat;
          transparent: true;
          opacity: 0;
        "
      ></a-image>


      <!-- =================================================
           KITE 2
      ================================================= -->

      <a-image
        id="kiteWhiteAR"
        src="#kiteWhite"

        width="0.052"
        height="0.052"

        position="-0.105 0.190 0.025"
        rotation="0 0 45"

        material="
          shader: flat;
          transparent: true;
          opacity: 0;
        "
      ></a-image>


      <!-- =================================================
           KITE 3
      ================================================= -->

      <a-image
        id="kiteBlueAR"
        src="#kiteBlue"

        width="0.048"
        height="0.048"

        position="0.135 0.165 0.025"
        rotation="0 0 45"

        material="
          shader: flat;
          transparent: true;
          opacity: 0;
        "
      ></a-image>



      <!-- =================================================
           EXTRA KITES + ATMOSPHERE
           These are all children of the tracked target.
      ================================================= -->

      <a-image id="kiteOrange2" src="#kiteOrange"
        width="0.040" height="0.040"
        position="-0.36 0.08 0.026"
        rotation="0 0 35"
        material="shader: flat; transparent: true; opacity: 0;">
      </a-image>

      <a-image id="kiteBlue2" src="#kiteBlue"
        width="0.032" height="0.032"
        position="0.34 0.12 0.026"
        rotation="0 0 55"
        material="shader: flat; transparent: true; opacity: 0;">
      </a-image>

      <a-image id="kiteWhite2" src="#kiteWhite"
        width="0.028" height="0.028"
        position="0.22 0.25 0.026"
        rotation="0 0 40"
        material="shader: flat; transparent: true; opacity: 0;">
      </a-image>

      <a-image id="kiteOrange3" src="#kiteOrange"
        width="0.025" height="0.025"
        position="-0.43 0.20 0.026"
        rotation="0 0 35"
        material="shader: flat; transparent: true; opacity: 0;">
      </a-image>

      <a-image id="kiteBlue3" src="#kiteBlue"
        width="0.022" height="0.022"
        position="0.43 0.24 0.026"
        rotation="0 0 55"
        material="shader: flat; transparent: true; opacity: 0;">
      </a-image>

      <!-- Small atmospheric sparks -->
      <a-sphere id="spark1" radius="0.004" position="-0.40 0.05 0.035"
        material="shader: flat; color: white; transparent: true; opacity: 0;"></a-sphere>

      <a-sphere id="spark2" radius="0.003" position="-0.28 0.24 0.035"
        material="shader: flat; color: white; transparent: true; opacity: 0;"></a-sphere>

      <a-sphere id="spark3" radius="0.004" position="-0.02 0.20 0.035"
        material="shader: flat; color: white; transparent: true; opacity: 0;"></a-sphere>

      <a-sphere id="spark4" radius="0.003" position="0.30 0.18 0.035"
        material="shader: flat; color: white; transparent: true; opacity: 0;"></a-sphere>

      <a-sphere id="spark5" radius="0.003" position="0.42 0.06 0.035"
        material="shader: flat; color: white; transparent: true; opacity: 0;"></a-sphere>

      <!-- Tiny glints -->
      <a-ring id="glint1"
        radius-inner="0.006" radius-outer="0.009"
        position="-0.30 0.14 0.04"
        material="shader: flat; color: white; transparent: true; opacity: 0;">
      </a-ring>

      <a-ring id="glint2"
        radius-inner="0.005" radius-outer="0.008"
        position="0.28 0.08 0.04"
        material="shader: flat; color: white; transparent: true; opacity: 0;">
      </a-ring>

      <a-ring id="glint3"
        radius-inner="0.004" radius-outer="0.007"
        position="0.02 0.29 0.04"
        material="shader: flat; color: white; transparent: true; opacity: 0;">
      </a-ring>

      <!-- =================================================
           EXISTING WORKING VIDEO
           DO NOT CHANGE THESE VALUES
      ================================================= -->

      <a-video
        id="arVideo"

        src="#film"

        width="1"
        height="0.5625"

        position="0 0 0.01"

        material="
          shader: flat;
          transparent: true;
          opacity: 0;
        "
      ></a-video>


    </a-entity>


  </a-scene>


  <script>

    /* ====================================================
       DOM REFERENCES
    ==================================================== */

    const scene =
      document.querySelector("a-scene");

    const startButton =
      document.querySelector("#start");

    const intro =
      document.querySelector("#intro");

    const loading =
      document.querySelector("#loading");

    const scanning =
      document.querySelector("#scanning");

    const found =
      document.querySelector("#found");

    const video =
      document.querySelector("#film");

    const arVideo =
      document.querySelector("#arVideo");

    const target =
      document.querySelector("#posterTarget");


    /* ====================================================
       KITE REFERENCES
    ==================================================== */

    const kiteOrange =
      document.querySelector("#kiteOrangeAR");

    const kiteWhite =
      document.querySelector("#kiteWhiteAR");

    const kiteBlue =
      document.querySelector("#kiteBlueAR");

    const kiteOrange2 = document.querySelector("#kiteOrange2");
    const kiteBlue2 = document.querySelector("#kiteBlue2");
    const kiteWhite2 = document.querySelector("#kiteWhite2");
    const kiteOrange3 = document.querySelector("#kiteOrange3");
    const kiteBlue3 = document.querySelector("#kiteBlue3");

    const extraKites = [
      kiteOrange2,
      kiteBlue2,
      kiteWhite2,
      kiteOrange3,
      kiteBlue3
    ];

    const allKites = [
      kiteOrange,
      kiteWhite,
      kiteBlue,
      ...extraKites
    ];

    const sparks = [
      document.querySelector("#spark1"),
      document.querySelector("#spark2"),
      document.querySelector("#spark3"),
      document.querySelector("#spark4"),
      document.querySelector("#spark5")
    ];

    const glints = [
      document.querySelector("#glint1"),
      document.querySelector("#glint2"),
      document.querySelector("#glint3")
    ];


    /* ====================================================
       STATE
    ==================================================== */

    let tracked = false;

    let fadeTimer = null;

    let fadeAnimation = null;

    let kiteTimers = [];


    /* ====================================================
       VIDEO OPACITY
    ==================================================== */

    function setVideoOpacity(value) {

      const material =
        arVideo.getAttribute("material");

      material.opacity = value;

      arVideo.setAttribute(
        "material",
        material
      );
    }


    /* ====================================================
       GENERIC MATERIAL OPACITY
    ==================================================== */

    function setEntityOpacity(
      entity,
      value
    ) {

      const material =
        entity.getAttribute("material");

      material.opacity = value;

      entity.setAttribute(
        "material",
        material
      );
    }


    /* ====================================================
       RESET KITES
    ==================================================== */

    function resetKites() {

      kiteTimers.forEach(
        timer => clearTimeout(timer)
      );

      kiteTimers = [];

      const startPositions = {
        kiteOrange: [-0.207, 0.165],
        kiteWhite:  [-0.105, 0.190],
        kiteBlue:   [ 0.135, 0.165],
        kiteOrange2:[-0.36,  0.08 ],
        kiteBlue2:  [ 0.34,  0.12 ],
        kiteWhite2: [ 0.22,  0.25 ],
        kiteOrange3:[-0.43,  0.20 ],
        kiteBlue3:  [ 0.43,  0.24 ]
      };

      const namedKites = [
        ["kiteOrange", kiteOrange],
        ["kiteWhite", kiteWhite],
        ["kiteBlue", kiteBlue],
        ["kiteOrange2", kiteOrange2],
        ["kiteBlue2", kiteBlue2],
        ["kiteWhite2", kiteWhite2],
        ["kiteOrange3", kiteOrange3],
        ["kiteBlue3", kiteBlue3]
      ];

      namedKites.forEach(
        ([name, kite]) => {

          const [x, y] =
            startPositions[name];

          kite.object3D.position.set(
            x,
            y,
            0.025
          );

          kite.object3D.rotation.z =
            Math.PI / 4;

          setEntityOpacity(
            kite,
            0
          );
        }
      );

      sparks.forEach(
        spark => {
          setEntityOpacity(spark, 0);
        }
      );

      glints.forEach(
        glint => {
          setEntityOpacity(glint, 0);
          glint.object3D.scale.set(
            0.5,
            0.5,
            0.5
          );
        }
      );
    }


    /* ====================================================
       ANIMATE ONE KITE
    ==================================================== */

    function animateKite(
      kite,
      startX,
      startY,
      endX,
      endY,
      duration,
      delay
    ) {

      const timer = setTimeout(() => {

        if (!tracked) return;

        const startTime = performance.now();

        const startZ = 0.025;
        const endZ = 0.14;

        function frame() {

          if (!tracked) return;

          const progress = Math.min(
            (performance.now() - startTime) / duration,
            1
          );

          const eased =
            1 - Math.pow(1 - progress, 3);

          const arc =
            Math.sin(progress * Math.PI) * 0.055;

          const x =
            startX +
            (endX - startX) * eased;

          const y =
            startY +
            (endY - startY) * eased +
            arc;

          const z =
            startZ +
            (endZ - startZ) * eased;

          kite.object3D.position.set(
            x,
            y,
            z
          );

          kite.object3D.rotation.z =
            Math.PI / 4 +
            progress * Math.PI * 2.35;

          let opacity;

          if (progress < 0.08) {
            opacity = progress / 0.08;
          } else if (progress < 0.72) {
            opacity = 1;
          } else {
            opacity =
              1 -
              ((progress - 0.72) / 0.28);
          }

          setEntityOpacity(
            kite,
            opacity
          );

          if (progress < 1) {
            requestAnimationFrame(frame);
          }
        }

        requestAnimationFrame(frame);

      }, delay);

      kiteTimers.push(timer);
    }


    /* ====================================================
       LAUNCH ALL KITES
    ==================================================== */

    function launchKites() {

      resetKites();

      /* Hero kites */
      animateKite(
        kiteOrange,
        -0.207, 0.165,
        -0.46, 0.60,
        1700, 0
      );

      animateKite(
        kiteWhite,
        -0.105, 0.190,
        -0.02, 0.68,
        1850, 140
      );

      animateKite(
        kiteBlue,
        0.135, 0.165,
        0.46, 0.58,
        1950, 260
      );

      /* Secondary kites move across the scene
         at different depths and timings. */
      animateKite(
        kiteOrange2,
        -0.36, 0.08,
        -0.60, 0.34,
        1450, 420
      );

      animateKite(
        kiteBlue2,
        0.34, 0.12,
        0.62, 0.42,
        1500, 560
      );

      animateKite(
        kiteWhite2,
        0.22, 0.25,
        0.34, 0.66,
        1650, 720
      );

      animateKite(
        kiteOrange3,
        -0.43, 0.20,
        -0.66, 0.50,
        1350, 880
      );

      animateKite(
        kiteBlue3,
        0.43, 0.24,
        0.68, 0.54,
        1450, 1020
      );

      /* Atmospheric sparks: quick upward drifting points. */
      sparks.forEach(
        (spark, index) => {

          const timer = setTimeout(
            () => {

              if (!tracked) return;

              const start =
                spark.object3D.position.clone();

              const startTime =
                performance.now();

              const duration =
                900 + index * 120;

              const targetX =
                start.x +
                (index % 2 === 0 ? -1 : 1) *
                (0.06 + index * 0.008);

              const targetY =
                start.y +
                0.10 +
                index * 0.012;

              function sparkFrame() {

                if (!tracked) return;

                const progress =
                  Math.min(
                    (performance.now() - startTime) /
                    duration,
                    1
                  );

                const eased =
                  1 -
                  Math.pow(1 - progress, 3);

                spark.object3D.position.x =
                  start.x +
                  (targetX - start.x) *
                  eased;

                spark.object3D.position.y =
                  start.y +
                  (targetY - start.y) *
                  eased;

                let opacity;

                if (progress < 0.15) {
                  opacity = progress / 0.15;
                } else {
                  opacity = 1 - ((progress - 0.15) / 0.85);
                }

                setEntityOpacity(
                  spark,
                  Math.max(0, opacity * 0.8)
                );

                if (progress < 1) {
                  requestAnimationFrame(
                    sparkFrame
                  );
                }
              }

              requestAnimationFrame(
                sparkFrame
              );

            },
            450 + index * 90
          );

          kiteTimers.push(timer);
        }
      );

      /* Glints pulse at different moments.
         These are tiny flashes, not generic particles. */
      glints.forEach(
        (glint, index) => {

          const timer = setTimeout(
            () => {

              if (!tracked) return;

              const start =
                performance.now();

              const duration =
                700;

              function glintFrame() {

                if (!tracked) return;

                const progress =
                  Math.min(
                    (performance.now() - start) /
                    duration,
                    1
                  );

                const brightness =
                  Math.sin(
                    progress * Math.PI
                  );

                const scale =
                  0.5 +
                  brightness * 1.5;

                glint.object3D.scale.set(
                  scale,
                  scale,
                  scale
                );

                setEntityOpacity(
                  glint,
                  brightness * 0.95
                );

                if (progress < 1) {
                  requestAnimationFrame(
                    glintFrame
                  );
                }
              }

              requestAnimationFrame(
                glintFrame
              );

            },
            600 + index * 430
          );

          kiteTimers.push(timer);
        }
      );
    }


    /* ====================================================
       FADE VIDEO IN
    ==================================================== */

    function fadeVideoIn() {

      if (fadeAnimation) {

        cancelAnimationFrame(
          fadeAnimation
        );

      }


      const startTime =
        performance.now();


      const duration =
        1500;


      function animate() {

        if (!tracked) {
          return;
        }


        const elapsed =
          performance.now() -
          startTime;


        const progress =
          Math.min(
            elapsed / duration,
            1
          );


        /* Smooth ease-in/out. */

        const eased =
          progress *
          progress *
          (3 - 2 * progress);


        setVideoOpacity(
          eased
        );


        if (progress < 1) {

          fadeAnimation =
            requestAnimationFrame(
              animate
            );

        }
      }


      animate();

    }


    /* ====================================================
       RESET VIDEO
    ==================================================== */

    function resetVideo() {

      if (fadeTimer) {

        clearTimeout(
          fadeTimer
        );

        fadeTimer = null;
      }


      if (fadeAnimation) {

        cancelAnimationFrame(
          fadeAnimation
        );

        fadeAnimation = null;
      }


      video.pause();

      video.currentTime = 0;

      setVideoOpacity(0);

    }


    /* ====================================================
       START AR
    ==================================================== */

    startButton.addEventListener(
      "click",
      async () => {

        intro.style.display =
          "none";

        loading.style.display =
          "flex";


        const mindar =
          scene.systems[
            "mindar-image-system"
          ];


        try {

          await mindar.start();


          loading.style.display =
            "none";


          scanning.style.display =
            "block";

        }

        catch (error) {

          console.error(
            error
          );


          loading.innerHTML =
            "Unable to access the camera.";

        }

      }
    );


    /* ====================================================
       POSTER FOUND
    ==================================================== */

    target.addEventListener(
      "targetFound",
      () => {

        console.log(
          "POSTER FOUND"
        );


        /* Ignore duplicate events while
           this target is already active. */

        if (tracked) {
          return;
        }


        tracked = true;


        scanning.style.display =
          "none";


        found.style.display =
          "block";


        setTimeout(
          () => {

            found.style.display =
              "none";

          },
          1200
        );


        /* -----------------------------------------------
           RESET THE EFFECT STATE
        ------------------------------------------------ */

        resetKites();

        setVideoOpacity(0);


        /* -----------------------------------------------
           START VIDEO IMMEDIATELY.

           It stays invisible while the
           original poster remains visible.
        ------------------------------------------------ */

        video.currentTime = 0;


        video.play().catch(
          error => {

            console.log(
              "Video playback:",
              error
            );

          }
        );


        /* -----------------------------------------------
           KITES ESCAPE.

           They begin while the printed poster
           is still visible.
        ------------------------------------------------ */

        launchKites();


        /* -----------------------------------------------
           VIDEO TRANSITION.

           The 2-second delay is preserved
           from your working V3.
        ------------------------------------------------ */

        fadeTimer =
          setTimeout(
            () => {

              if (!tracked) {
                return;
              }


              fadeVideoIn();

            },
            2000
          );

      }
    );


    /* ====================================================
       POSTER LOST
    ==================================================== */

    target.addEventListener(
      "targetLost",
      () => {

        console.log(
          "POSTER LOST"
        );


        tracked = false;


        scanning.style.display =
          "block";


        found.style.display =
          "none";


        resetVideo();

        resetKites();

      }
    );


    /* ====================================================
       INITIAL STATE
    ==================================================== */

    resetKites();

    setVideoOpacity(0);

  </script>

</body>

</html>
