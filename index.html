<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Living Poster AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* IMPORTANT:
       Do NOT position/style a-scene here.
       MindAR controls the camera canvas.
    */

    #intro {

      position: fixed;
      inset: 0;

      z-index: 10000;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding: 30px;

      text-align: center;

      color: white;
      background: #000;
    }

    #intro h1 {

      margin: 0 0 12px;

      font-size: 28px;

      font-weight: 600;
    }

    #intro p {

      max-width: 320px;

      margin: 0 0 28px;

      line-height: 1.5;

      font-size: 16px;

      opacity: 0.75;
    }

    #start {

      padding: 15px 28px;

      border: none;
      border-radius: 999px;

      background: white;
      color: black;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;
    }

    #loading {

      position: fixed;
      inset: 0;

      z-index: 9500;

      display: none;

      align-items: center;
      justify-content: center;

      color: white;
      background: #000;

      font-size: 16px;
    }

    #scanning {

      position: fixed;

      z-index: 9000;

      left: 50%;
      bottom: 45px;

      transform: translateX(-50%);

      padding: 11px 18px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.68);

      color: white;

      font-size: 14px;

      white-space: nowrap;

      display: none;

      pointer-events: none;
    }

    #found {

      position: fixed;

      z-index: 9000;

      left: 50%;
      bottom: 45px;

      transform: translateX(-50%);

      padding: 10px 17px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.65);

      color: white;

      font-size: 14px;

      display: none;

      pointer-events: none;
    }

  </style>

</head>


<body>


  <!-- =====================================================
       INTRO
  ====================================================== -->

  <div id="intro">

    <h1>AR Experience</h1>

    <p>
      Point your camera at the poster
      to bring it to life.
    </p>

    <button id="start">
      Start Experience
    </button>

  </div>


  <!-- =====================================================
       LOADING
  ====================================================== -->

  <div id="loading">
    Starting camera...
  </div>


  <!-- =====================================================
       SCANNING
  ====================================================== -->

  <div id="scanning">
    Point your camera at the poster
  </div>


  <!-- =====================================================
       DETECTED
  ====================================================== -->

  <div id="found">
    ✓ Poster detected
  </div>


  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: yes;

      warmupTolerance: 3;
      missTolerance: 5;

      filterMinCF: 0.01;
      filterBeta: 10000;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true,
      physicallyCorrectLights
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >


    <!-- =================================================
         ASSETS
    ================================================== -->

    <a-assets>

      <video

        id="film"

        src="./film-web.mp4"

        loop

        playsinline

        webkit-playsinline

        crossorigin="anonymous"

        preload="auto"

      ></video>


      <!-- KITE SVGs -->

      <img
        id="kiteWhite"
        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,0 100,50 50,100 0,50' fill='none' stroke='white' stroke-width='7'/%3E%3Cpath d='M50 100 C50 120 35 130 25 140' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"
      >

    </a-assets>


    <!-- =================================================
         CAMERA
    ================================================== -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false"

    ></a-camera>


    <!-- =================================================
         POSTER TARGET
    ================================================== -->

    <a-entity

      id="posterTarget"

      mindar-image-target="targetIndex: 0"

    >


      <!-- =================================================
           THE ORIGINAL V3 VIDEO
           DO NOT CHANGE THIS GEOMETRY
      ================================================== -->

      <a-video

        id="arVideo"

        src="#film"

        width="1"

        height="0.5625"

        position="0 0 0.01"

        material="
          shader: flat;
          transparent: true;
          opacity: 0;
        "

      ></a-video>


      <!-- =================================================
           EDGE GLOW
      ================================================== -->

      <!-- TOP -->

      <a-plane

        id="edgeTop"

        width="1.02"

        height="0.006"

        position="0 0.286 0.032"

        material="
          shader: flat;
          color: #ffffff;
          transparent: true;
          opacity: 0;
        "

      ></a-plane>


      <!-- BOTTOM -->

      <a-plane

        id="edgeBottom"

        width="1.02"

        height="0.006"

        position="0 -0.286 0.032"

        material="
          shader: flat;
          color: #ffffff;
          transparent: true;
          opacity: 0;
        "

      ></a-plane>


      <!-- LEFT -->

      <a-plane

        id="edgeLeft"

        width="0.006"

        height="0.562"

        position="-0.5 0 0.032"

        material="
          shader: flat;
          color: #ffffff;
          transparent: true;
          opacity: 0;
        "

      ></a-plane>


      <!-- RIGHT -->

      <a-plane

        id="edgeRight"

        width="0.006"

        height="0.562"

        position="0.5 0 0.032"

        material="
          shader: flat;
          color: #ffffff;
          transparent: true;
          opacity: 0;
        "

      ></a-plane>


      <!-- =================================================
           ENERGY SWEEP
      ================================================== -->

      <a-plane

        id="energySweep"

        width="1.08"

        height="0.012"

        position="0 -0.286 0.04"

        material="
          shader: flat;
          color: #ffffff;
          transparent: true;
          opacity: 0;
        "

      ></a-plane>


      <!-- =================================================
           CENTRAL SHOCKWAVE
      ================================================== -->

      <a-ring

        id="shockwave"

        radius-inner="0.035"

        radius-outer="0.048"

        position="0 0 0.045"

        material="
          shader: flat;
          color: #ffffff;
          transparent: true;
          opacity: 0;
        "

      ></a-ring>


      <!-- SECOND SHOCKWAVE -->

      <a-ring

        id="shockwave2"

        radius-inner="0.025"

        radius-outer="0.035"

        position="0 0 0.044"

        material="
          shader: flat;
          color: #ffffff;
          transparent: true;
          opacity: 0;
        "

      ></a-ring>


      <!-- =================================================
           KITES / OBJECTS ESCAPING THE POSTER
      ================================================== -->

      <a-image

        id="kite1"

        src="#kiteWhite"

        width="0.055"

        height="0.055"

        position="-0.22 0.28 0.065"

        rotation="0 0 45"

        material="
          transparent: true;
          opacity: 0;
          shader: flat;
        "

      ></a-image>


      <a-image

        id="kite2"

        src="#kiteWhite"

        width="0.042"

        height="0.042"

        position="0.05 0.285 0.065"

        rotation="0 0 45"

        material="
          transparent: true;
          opacity: 0;
          shader: flat;
        "

      ></a-image>


      <a-image

        id="kite3"

        src="#kiteWhite"

        width="0.034"

        height="0.034"

        position="0.30 0.27 0.065"

        rotation="0 0 45"

        material="
          transparent: true;
          opacity: 0;
          shader: flat;
        "

      ></a-image>


      <!-- =================================================
           PARTICLE FIELD

           Small but numerous. These are deliberately
           subtle and are used as atmosphere, not as
           the main effect.
      ================================================== -->

      <a-sphere
        class="particle"
        radius="0.004"
        position="-0.44 0.18 0.05"
        material="shader: flat; color: white; transparent: true; opacity: 0;"
      ></a-sphere>

      <a-sphere
        class="particle"
        radius="0.003"
        position="-0.34 0.22 0.05"
        material="shader: flat; color: white; transparent: true; opacity: 0;"
      ></a-sphere>

      <a-sphere
        class="particle"
        radius="0.005"
        position="-0.25 0.18 0.05"
        material="shader: flat; color: white; transparent: true; opacity: 0;"
      ></a-sphere>

      <a-sphere
        class="particle"
        radius="0.003"
        position="-0.12 0.25 0.05"
        material="shader: flat; color: white; transparent: true; opacity: 0;"
      ></a-sphere>

      <a-sphere
        class="particle"
        radius="0.004"
        position="0.08 0.24 0.05"
        material="shader: flat; color: white; transparent: true; opacity: 0;"
      ></a-sphere>

      <a-sphere
        class="particle"
        radius="0.003"
        position="0.21 0.21 0.05"
        material="shader: flat; color: white; transparent: true; opacity: 0;"
      ></a-sphere>

      <a-sphere
        class="particle"
        radius="0.004"
        position="0.39 0.18 0.05"
        material="shader: flat; color: white; transparent: true; opacity: 0;"
      ></a-sphere>


    </a-entity>


  </a-scene>


  <script>


    /* =====================================================
       DOM
    ====================================================== */

    const scene =
      document.querySelector("a-scene");


    const startButton =
      document.querySelector("#start");


    const intro =
      document.querySelector("#intro");


    const loading =
      document.querySelector("#loading");


    const scanning =
      document.querySelector("#scanning");


    const found =
      document.querySelector("#found");


    const video =
      document.querySelector("#film");


    const target =
      document.querySelector("#posterTarget");


    const arVideo =
      document.querySelector("#arVideo");


    const energySweep =
      document.querySelector("#energySweep");


    const shockwave =
      document.querySelector("#shockwave");


    const shockwave2 =
      document.querySelector("#shockwave2");


    const edges = [

      document.querySelector("#edgeTop"),

      document.querySelector("#edgeRight"),

      document.querySelector("#edgeBottom"),

      document.querySelector("#edgeLeft")

    ];


    const kites = [

      document.querySelector("#kite1"),

      document.querySelector("#kite2"),

      document.querySelector("#kite3")

    ];


    const particles =
      document.querySelectorAll(
        ".particle"
      );


    let tracked =
      false;


    let fadeTimer =
      null;


    let fadeAnimation =
      null;


    /* =====================================================
       MATERIAL OPACITY
    ====================================================== */

    function setOpacity(
      entity,
      value
    ) {

      const material =
        entity.getAttribute(
          "material"
        );


      material.opacity =
        value;


      entity.setAttribute(
        "material",
        material
      );

    }


    /* =====================================================
       VIDEO OPACITY
    ====================================================== */

    function setVideoOpacity(
      value
    ) {

      setOpacity(
        arVideo,
        value
      );

    }


    /* =====================================================
       RESET EVERYTHING
    ====================================================== */

    function resetEffects() {


      if (fadeTimer) {

        clearTimeout(
          fadeTimer
        );

        fadeTimer = null;

      }


      if (fadeAnimation) {

        cancelAnimationFrame(
          fadeAnimation
        );

        fadeAnimation = null;

      }


      setVideoOpacity(
        0
      );


      edges.forEach(
        edge => {

          setOpacity(
            edge,
            0
          );

        }
      );


      setOpacity(
        energySweep,
        0
      );


      setOpacity(
        shockwave,
        0
      );


      setOpacity(
        shockwave2,
        0
      );


      kites.forEach(
        kite => {

          setOpacity(
            kite,
            0
          );

        }
      );


      particles.forEach(
        particle => {

          setOpacity(
            particle,
            0
          );

        }
      );


      video.pause();

      video.currentTime =
        0;

    }


    /* =====================================================
       EDGE IGNITION
    ====================================================== */

    function igniteEdges() {


      edges.forEach(
        (edge, index) => {


          setTimeout(
            () => {

              if (!tracked) {
                return;
              }


              setOpacity(
                edge,
                0.95
              );


              edge.animate(
                [
                  {
                    opacity: 0
                  },
                  {
                    opacity: 1
                  },
                  {
                    opacity: 0.65
                  },
                  {
                    opacity: 0
                  }
                ],
                {
                  duration: 900,
                  easing:
                    "cubic-bezier(.16,1,.3,1)"
                }
              );


            },
            index * 180
          );

        }
      );

    }


    /* =====================================================
       ENERGY SWEEP
    ====================================================== */

    function runEnergySweep() {


      setOpacity(
        energySweep,
        0
      );


      energySweep.setAttribute(
        "position",
        "0 -0.286 0.04"
      );


      setOpacity(
        energySweep,
        0.95
      );


      energySweep.animate(
        [
          {
            object3D: {
              position: {
                x: 0,
                y: -0.286,
                z: 0.04
              }
            },

            opacity: 0
          }
        ],
        {
          duration: 1
        }
      );


      const startY =
        -0.286;

      const endY =
        0.286;


      const start =
        performance.now();


      const duration =
        950;


      function frame() {


        if (!tracked) {
          return;
        }


        const progress =
          Math.min(
            (
              performance.now()
              - start
            ) / duration,
            1
          );


        const eased =
          progress *
          progress *
          (3 - 2 * progress);


        energySweep.object3D.position.y =
          startY +
          (
            endY -
            startY
          ) *
          eased;


        if (progress < 1) {

          requestAnimationFrame(
            frame
          );

        } else {

          setOpacity(
            energySweep,
            0
          );

        }

      }


      requestAnimationFrame(
        frame
      );

    }


    /* =====================================================
       SHOCKWAVE
    ====================================================== */

    function runShockwave() {


      [shockwave, shockwave2]
        .forEach(
          (ring, index) => {


            setOpacity(
              ring,
              0.9
            );


            ring.object3D.scale.set(
              0.15,
              0.15,
              0.15
            );


            ring.animate(
              [
                {
                  opacity: 0.9,
                  transform:
                    "scale(0.15)"
                },
                {
                  opacity: 0,
                  transform:
                    "scale(6)"
                }
              ],
              {
                duration:
                  850 +
                  index * 220,

                easing:
                  "cubic-bezier(.16,1,.3,1)"
              }
            );


            const start =
              performance.now();


            const duration =
              850 +
              index * 220;


            function frame() {


              if (!tracked) {
                return;
              }


              const progress =
                Math.min(
                  (
                    performance.now()
                    - start
                  ) / duration,
                  1
                );


              const scale =
                0.15 +
                (
                  6 -
                  0.15
                ) *
                (
                  progress *
                  progress *
                  (3 - 2 * progress)
                );


              ring.object3D.scale.set(
                scale,
                scale,
                scale
              );


              const opacity =
                0.9 *
                (1 - progress);


              setOpacity(
                ring,
                opacity
              );


              if (
                progress < 1
              ) {

                requestAnimationFrame(
                  frame
                );

              }

            }


            requestAnimationFrame(
              frame
            );

          }
        );

    }


    /* =====================================================
       PARTICLE BURST
    ====================================================== */

    function runParticleBurst() {


      particles.forEach(
        (particle, index) => {


          setTimeout(
            () => {


              if (!tracked) {
                return;
              }


              setOpacity(
                particle,
                0.0
              );


              particle.animate(
                [
                  {
                    opacity: 0
                  },
                  {
                    opacity: 0.9
                  },
                  {
                    opacity: 0
                  }
                ],
                {
                  duration:
                    1200 +
                    index * 130,

                  easing:
                    "ease-out"
                }
              );


              const original =
                particle.object3D
                  .position.clone();


              particle.object3D
                .position.copy(
                  original
                );


              const targetX =
                original.x +
                (
                  Math.random()
                  - 0.5
                ) *
                0.28;


              const targetY =
                original.y +
                0.18 +
                Math.random() *
                0.20;


              const start =
                performance.now();


              const duration =
                800 +
                index * 90;


              function frame() {


                if (!tracked) {
                  return;
                }


                const progress =
                  Math.min(
                    (
                      performance.now()
                      - start
                    ) /
                    duration,
                    1
                  );


                const eased =
                  1 -
                  Math.pow(
                    1 - progress,
                    3
                  );


                particle.object3D
                  .position.x =
                    original.x +
                    (
                      targetX -
                      original.x
                    ) *
                    eased;


                particle.object3D
                  .position.y =
                    original.y +
                    (
                      targetY -
                      original.y
                    ) *
                    eased;


                setOpacity(
                  particle,
                  progress < 0.75
                    ? progress * 1.1
                    : (1 - progress) * 4
                );


                if (
                  progress < 1
                ) {

                  requestAnimationFrame(
                    frame
                  );

                }

              }


              requestAnimationFrame(
                frame
              );


            },
            index * 65
          );

        }
      );

    }


    /* =====================================================
       KITE ESCAPE
    ====================================================== */

    function runKites() {


      const paths = [

        {
          x: -0.22,
          y: 0.28,
          tx: -0.43,
          ty: 0.62,
          duration: 1500
        },

        {
          x: 0.05,
          y: 0.285,
          tx: 0.16,
          ty: 0.69,
          duration: 1750
        },

        {
          x: 0.30,
          y: 0.27,
          tx: 0.51,
          ty: 0.57,
          duration: 1900
        }

      ];


      kites.forEach(
        (kite, index) => {


          const path =
            paths[index];


          kite.object3D
            .position.set(
              path.x,
              path.y,
              0.065
            );


          setOpacity(
            kite,
            0
          );


          const startDelay =
            index * 140;


          setTimeout(
            () => {


              if (!tracked) {
                return;
              }


              const start =
                performance.now();


              const duration =
                path.duration;


              function frame() {


                if (!tracked) {
                  return;
                }


                const progress =
                  Math.min(
                    (
                      performance.now()
                      - start
                    ) /
                    duration,
                    1
                  );


                const eased =
                  1 -
                  Math.pow(
                    1 - progress,
                    3
                  );


                kite.object3D
                  .position.x =
                    path.x +
                    (
                      path.tx -
                      path.x
                    ) *
                    eased;


                kite.object3D
                  .position.y =
                    path.y +
                    (
                      path.ty -
                      path.y
                    ) *
                    eased;


                kite.object3D
                  .position.z =
                    0.065 +
                    progress *
                    0.13;


                kite.object3D
                  .rotation.z =
                    THREE.MathUtils.degToRad(
                      45 +
                      progress *
                      260
                    );


                let opacity;


                if (
                  progress < 0.12
                ) {

                  opacity =
                    progress /
                    0.12;

                } else if (
                  progress < 0.72
                ) {

                  opacity =
                    1;

                } else {

                  opacity =
                    1 -
                    (
                      progress -
                      0.72
                    ) / 0.28;

                }


                setOpacity(
                  kite,
                  opacity
                );


                if (
                  progress < 1
                ) {

                  requestAnimationFrame(
                    frame
                  );

                }

              }


              requestAnimationFrame(
                frame
              );


            },
            startDelay
          );

        }
      );

    }


    /* =====================================================
       VIDEO FADE
    ====================================================== */

    function fadeVideoIn() {


      const start =
        performance.now();


      const duration =
        1100;


      function animate() {


        if (!tracked) {
          return;
        }


        const progress =
          Math.min(
            (
              performance.now()
              - start
            ) /
            duration,
            1
          );


        const eased =
          progress *
          progress *
          (3 - 2 * progress);


        setVideoOpacity(
          eased
        );


        if (
          progress < 1
        ) {

          fadeAnimation =
            requestAnimationFrame(
              animate
            );

        }

      }


      animate();

    }


    /* =====================================================
       START EXPERIENCE
    ====================================================== */

    startButton.addEventListener(
      "click",
      async () => {


        intro.style.display =
          "none";


        loading.style.display =
          "flex";


        const mindar =
          scene.systems[
            "mindar-image-system"
          ];


        try {


          await mindar.start();


          loading.style.display =
            "none";


          scanning.style.display =
            "block";


        } catch (error) {


          console.error(
            error
          );


          loading.innerHTML =
            "Unable to access the camera.";

        }

      }
    );


    /* =====================================================
       POSTER FOUND
    ====================================================== */

    target.addEventListener(
      "targetFound",
      () => {


        if (tracked) {
          return;
        }


        tracked = true;


        scanning.style.display =
          "none";


        found.style.display =
          "block";


        setTimeout(
          () => {

            found.style.display =
              "none";

          },
          800
        );


        /* -----------------------------------------------
           START FROM A COMPLETELY CLEAN STATE
        ------------------------------------------------ */

        setVideoOpacity(
          0
        );


        video.currentTime =
          0;


        /* -----------------------------------------------
           VIDEO STARTS IMMEDIATELY,
           BUT REMAINS INVISIBLE
        ------------------------------------------------ */

        video.play().catch(
          error => {

            console.log(
              "Video playback:",
              error
            );

          }
        );


        /* -----------------------------------------------
           1. EDGE IGNITION
        ------------------------------------------------ */

        igniteEdges();


        /* -----------------------------------------------
           2. ENERGY SWEEP
        ------------------------------------------------ */

        setTimeout(
          () => {

            if (!tracked) {
              return;
            }


            runEnergySweep();

          },
          180
        );


        /* -----------------------------------------------
           3. SHOCKWAVE
        ------------------------------------------------ */

        setTimeout(
          () => {

            if (!tracked) {
              return;
            }


            runShockwave();

          },
          650
        );


        /* -----------------------------------------------
           4. PARTICLES
        ------------------------------------------------ */

        setTimeout(
          () => {

            if (!tracked) {
              return;
            }


            runParticleBurst();

          },
          750
        );


        /* -----------------------------------------------
           5. KITES ESCAPE
        ------------------------------------------------ */

        setTimeout(
          () => {

            if (!tracked) {
              return;
            }


            runKites();

          },
          1050
        );


        /* -----------------------------------------------
           6. VIDEO TRANSITION

           YOUR EXISTING WORKING V3 TIMING.
        ------------------------------------------------ */

        fadeTimer =
          setTimeout(
            () => {

              if (!tracked) {
                return;
              }


              fadeVideoIn();

            },
            1800
          );

      }
    );


    /* =====================================================
       POSTER LOST
    ====================================================== */

    target.addEventListener(
      "targetLost",
      () => {


        tracked = false;


        scanning.style.display =
          "block";


        found.style.display =
          "none";


        resetEffects();

      }
    );


  </script>


</body>
