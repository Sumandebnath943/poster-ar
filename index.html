<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AR Experience</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    /* INTRO */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 10000;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 30px;
      text-align: center;

      color: white;
      background: black;
    }

    #intro h1 {
      margin: 0 0 12px;
      font-size: 28px;
      font-weight: 600;
    }

    #intro p {
      max-width: 320px;
      margin: 0 0 28px;
      line-height: 1.5;
      font-size: 16px;
      opacity: 0.75;
    }

    #start {
      padding: 15px 28px;
      border: none;
      border-radius: 999px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    /* LOADING */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 9500;

      display: none;
      align-items: center;
      justify-content: center;

      color: white;
      background: black;
      font-size: 16px;
    }

    /* =====================================================
       SCANNING UI — centered viewfinder
    ===================================================== */

    #scanning {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: none;
      pointer-events: none;

      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    #scanning::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 70% 60% at 50% 50%,
        transparent 40%,
        rgba(0, 0, 0, 0.55) 100%
      );
    }

    .scan-frame {
      position: relative;
      width: min(72vw, 260px);
      aspect-ratio: 3 / 4;
      border-radius: 10px;
      overflow: hidden;
    }

    .scan-frame::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    .scan-corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: white;
      border-style: solid;
      animation: scanCornerPulse 2s ease-in-out infinite;
    }

    .scan-corner.tl {
      top: 0; left: 0;
      border-width: 2.5px 0 0 2.5px;
      border-radius: 6px 0 0 0;
      animation-delay: 0s;
    }
    .scan-corner.tr {
      top: 0; right: 0;
      border-width: 2.5px 2.5px 0 0;
      border-radius: 0 6px 0 0;
      animation-delay: 0.25s;
    }
    .scan-corner.bl {
      bottom: 0; left: 0;
      border-width: 0 0 2.5px 2.5px;
      border-radius: 0 0 0 6px;
      animation-delay: 0.5s;
    }
    .scan-corner.br {
      bottom: 0; right: 0;
      border-width: 0 2.5px 2.5px 0;
      border-radius: 0 0 6px 0;
      animation-delay: 0.75s;
    }

    @keyframes scanCornerPulse {
      0%, 100% { opacity: 1;    transform: scale(1);    }
      50%       { opacity: 0.3; transform: scale(0.92); }
    }

    .scan-sweep {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(
        to right,
        transparent 0%,
        rgba(255, 255, 255, 0.7) 35%,
        white 50%,
        rgba(255, 255, 255, 0.7) 65%,
        transparent 100%
      );
      box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.35);
      animation: scanSweep 2.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    @keyframes scanSweep {
      0%   { top: 0%;   opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .scan-label {
      position: relative;
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      display: flex;
      align-items: baseline;
      gap: 1px;
    }

    .scan-dot {
      opacity: 0;
      animation: dotBlink 1.5s ease-in-out infinite;
    }
    .scan-dot:nth-child(1) { animation-delay: 0s; }
    .scan-dot:nth-child(2) { animation-delay: 0.3s; }
    .scan-dot:nth-child(3) { animation-delay: 0.6s; }

    @keyframes dotBlink {
      0%, 100% { opacity: 0; }
      50%       { opacity: 1; }
    }

    /* FOUND */
    #found {
      position: fixed;
      z-index: 9000;

      left: 50%;
      bottom: 50px;
      transform: translateX(-50%);

      padding: 10px 18px;
      border-radius: 999px;

      background: rgba(0, 0, 0, 0.65);
      color: white;

      font-size: 14px;
      display: none;
    }
  </style>
</head>


<body>

  <!-- INTRO -->
  <div id="intro">
    <h1>AR Experience</h1>

    <p>
      Point your camera at the poster
      to bring it to life.
    </p>

    <button id="start">
      Start Experience
    </button>
  </div>


  <!-- LOADING -->
  <div id="loading">
    Starting camera...
  </div>


  <!-- SCANNING — centered viewfinder -->
  <div id="scanning">
    <div class="scan-frame">
      <div class="scan-corner tl"></div>
      <div class="scan-corner tr"></div>
      <div class="scan-corner bl"></div>
      <div class="scan-corner br"></div>
      <div class="scan-sweep"></div>
    </div>
    <div class="scan-label">
      Scanning<span class="scan-dot">.</span><span class="scan-dot">.</span><span class="scan-dot">.</span>
    </div>
  </div>


  <!-- FOUND -->
  <div id="found">
    ✓ Poster detected
  </div>


  <!--
    IMPORTANT:
    This scene structure is intentionally kept close
    to the working V3. Do not add fullscreen CSS to
    a-scene or the camera feed can break.
  -->
  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;

      autoStart: false;

      uiLoading: no;
      uiScanning: no;
      uiError: yes;

      warmupTolerance: 5;
      missTolerance: 10;

      filterMinCF: 0.001;
      filterBeta: 1000;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true,
      physicallyCorrectLights
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >


    <!-- ==================================================
         ASSETS
    ================================================== -->

    <a-assets>

      <video
        id="film"
        src="./film-web.mp4"
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        preload="auto"
      ></video>

      <img id="kiteOrange" src="./kite-orange.png">
      <img id="kiteBlue"   src="./kite-blue.png">
      <img id="kiteWhite"  src="./kite-white.png">

    </a-assets>


    <!-- ==================================================
         CAMERA
    ================================================== -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>


    <!-- ==================================================
         POSTER TARGET
    ================================================== -->

    <a-entity
      id="posterTarget"
      mindar-image-target="targetIndex: 0"
    >

      <!-- ================================================
           KITE GROUP
           A single entity that receives the gyroscope
           parallax offset. All flying elements live here
           so they shift together as a depth layer while
           the frame and video stay locked to the poster.
      ================================================= -->

      <a-entity id="kiteGroup">

        <!-- KITE 1 — starts over the printed kite -->
        <a-image
          id="kiteOrangeAR"
          src="#kiteOrange"
          width="0.055"
          height="0.055"
          position="-0.207 0.165 0.025"
          rotation="0 0 45"
          material="shader: flat; transparent: true; opacity: 0;"

        <a-image
          id="kiteWhiteAR"

        <a-sphere class="trail-dot" radius="0.004" position="0 -5 0" material="shader: flat; color: #FFF3E0; transparent: true; opacity: 0;"></a-sphere>

        <a-sphere class="trail-dot" radius="0.004" position="0 -5 0" material="shader: flat; color: #FFF3E0; transparent: true; opacity: 0;"></a-sphere>

      </a-entity><!-- /kiteGroup -->


      <!-- ================================================
           ANIMATED POSTER FRAME
           Four white bars that expand from the centre
           outward on detection, framing the video.
           Lives outside kiteGroup so parallax doesn't move it.
      ================================================= -->

      <!-- Top and bottom expand horizontally (scale.x: 0 → 1) -->
      <a-plane id="frameTop"
        width="1.044" height="0.011"
        position="0 0.289 0.013"
        material="shader: flat; color: #FFFFFF; transparent: true; opacity: 0;"
        scale="0 1 1">
      </a-plane>

      <a-plane id="frameBottom"
        width="1.044" height="0.011"
        position="0 -0.289 0.013"
        material="shader: flat; color: #FFFFFF; transparent: true; opacity: 0;"
        scale="0 1 1">
      </a-plane>

      <!-- Left and right expand vertically (scale.y: 0 → 1) -->
      <a-plane id="frameLeft"
        width="0.011" height="0.5825"
        position="-0.527 0 0.013"
        material="shader: flat; color: #FFFFFF; transparent: true; opacity: 0;"
        scale="1 0 1">
      </a-plane>

      <a-plane id="frameRight"
        width="0.011" height="0.5825"
        position="0.527 0 0.013"
        material="shader: flat; color: #FFFFFF; transparent: true; opacity: 0;"
        scale="1 0 1">

      <!-- ================================================
           INK-BLEED DISSOLVE PANELS (5 cols × 4 rows = 20)
           Pre-positioned as a grid covering the video area.
           Parked at opacity 0. inkBleedReveal() snaps them

           reveal the video underneath.
      ================================================= -->

      <!-- Row 0 (bottom) y ≈ -0.211 -->

      <!-- Row 2 y ≈ +0.070 -->

      <!-- ================================================
           VIDEO — DO NOT CHANGE THESE VALUES

  </a-scene>


  <script>

    /* ====================================================
       VERSION / CACHE BUSTING
       Update APP_VERSION string on every deploy.
       On load, the page compares it against localStorage.
       If stale, it redirects to a cache-busted URL so the
       browser fetches fresh assets instead of serving old
       cached files.
    ==================================================== */

    const APP_VERSION = "2026-08-26-v3";

    (function bustCache() {
      const stored = localStorage.getItem("ar_version");
      if (stored && stored !== APP_VERSION) {
        localStorage.setItem("ar_version", APP_VERSION);
        location.replace(
          location.pathname + "?v=" + APP_VERSION
        );
        return;
      }
      localStorage.setItem("ar_version", APP_VERSION);
    })();


    /* ====================================================
       DOM REFERENCES
    ==================================================== */

    const scene       = document.querySelector("a-scene");
    const startButton = document.querySelector("#start");
    const intro       = document.querySelector("#intro");
    const loading     = document.querySelector("#loading");
    const scanning    = document.querySelector("#scanning");
    const found       = document.querySelector("#found");
    const video       = document.querySelector("#film");
    const arVideo     = document.querySelector("#arVideo");
    const target      = document.querySelector("#posterTarget");

    /* Parallax wrapper */
    const kiteGroup   = document.querySelector("#kiteGroup");

    /* Frame bars */
    const frameTop    = document.querySelector("#frameTop");
    const frameBottom = document.querySelector("#frameBottom");
    const frameLeft   = document.querySelector("#frameLeft");
    const frameRight  = document.querySelector("#frameRight");


    /* ====================================================
       KITE REFERENCES
    ==================================================== */

    const kiteOrange  = document.querySelector("#kiteOrangeAR");
    const kiteWhite   = document.querySelector("#kiteWhiteAR");
    const kiteBlue    = document.querySelector("#kiteBlueAR");

    const kiteOrange2 = document.querySelector("#kiteOrange2");
    const kiteBlue2   = document.querySelector("#kiteBlue2");
    const kiteWhite2  = document.querySelector("#kiteWhite2");
    const kiteOrange3 = document.querySelector("#kiteOrange3");
    const kiteBlue3   = document.querySelector("#kiteBlue3");

    const extraKites = [
      kiteOrange2, kiteBlue2, kiteWhite2, kiteOrange3, kiteBlue3
    ];

    const allKites = [
      kiteOrange, kiteWhite, kiteBlue, ...extraKites
    ];

    const sparks = [
      document.querySelector("#spark1"),
      document.querySelector("#spark2"),
      document.querySelector("#spark3"),
      document.querySelector("#spark4"),
      document.querySelector("#spark5")
    ];

    const glints = [
      document.querySelector("#glint1"),
      document.querySelector("#glint2"),
      document.querySelector("#glint3")
    ];


    /* ====================================================
       WIND TRAIL POOL
    ==================================================== */

    const trailPool = [
      ...document.querySelectorAll(".trail-dot")
    ];

    let trailPoolIdx = 0;


    /* ====================================================
       INK PANEL REFERENCES
    ==================================================== */

    const inkPanels = [
      ...document.querySelectorAll(".ink-panel")
    ];


    /* ====================================================
       STATE
    ==================================================== */

    let tracked        = false;
    let fadeTimer      = null;
    let fadeAnimation  = null;
    let fadeOutAnimation = null;
    let kiteTimers     = [];
    let kiteLoopTimer  = null;
    let audioCtx       = null;

    /* Gyroscope target offsets (updated by deviceorientation) */
    let gyroTargetX = 0;
    let gyroTargetY = 0;

    /* rAF handle for the parallax loop */
    let parallaxRaf = null;


    /* ====================================================
       AUDIO — lazy init + sound generators
    ==================================================== */

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    /* Gentle bell chime — on poster detection */
    function playDetectionChime() {
      try {
        const ctx = ensureAudio();
        [880, 1108].forEach((freq, i) => {
          const osc  = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.18 - i * 0.04, ctx.currentTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
          osc.start(ctx.currentTime + i * 0.015);
          osc.stop(ctx.currentTime + 1.2);
        });
      } catch (e) {}
    }

    /* Soft whoosh — when kites launch */
    function playWhoosh() {
      try {
        const ctx        = ensureAudio();
        const bufferSize = ctx.sampleRate * 0.6;
        const buffer     = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data       = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const source = ctx.createBufferSource();
        source.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(800, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.6);
        filter.Q.value = 0.8;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.22, ctx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);

        source.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        source.start(ctx.currentTime);
      } catch (e) {}
    }


    /* ====================================================
       HAPTIC FEEDBACK
    ==================================================== */

    function vibrate() {
      if (navigator.vibrate) navigator.vibrate([50, 30, 80]);
    }


    /* ====================================================
       VIDEO OPACITY
    ==================================================== */

    function setVideoOpacity(value) {
      const material = arVideo.getAttribute("material");
      material.opacity = value;
      arVideo.setAttribute("material", material);
    }


    /* ====================================================
       GENERIC ENTITY OPACITY
    ==================================================== */

    function setEntityOpacity(entity, value) {
      const material = entity.getAttribute("material");
      material.opacity = value;
      entity.setAttribute("material", material);
    }


    /* ====================================================
       GYROSCOPE PARALLAX
       Reads device tilt and smoothly shifts kiteGroup
       in the opposite direction — creating a layered
       depth illusion between the kites and the poster.
    ==================================================== */

    function handleOrientation(e) {
      /* gamma = left/right tilt  (-90 → 90 degrees)
         beta  = front/back tilt  (-180 → 180 degrees) */
      const gamma = Math.max(-30, Math.min(30, e.gamma || 0));
      const beta  = Math.max(-30, Math.min(30, e.beta  || 0));

      /* Negate gamma: tilt right → kites drift left (parallax) */
      gyroTargetX = -(gamma / 30) * 0.065;
      gyroTargetY =  (beta  / 30) * 0.045;
    }

    function runParallaxLoop() {
      if (!tracked) {
        kiteGroup.object3D.position.set(0, 0, 0);
        parallaxRaf = null;
        return;
      }

      const pos = kiteGroup.object3D.position;
      /* Lerp toward target — smooth but responsive */
      pos.x += (gyroTargetX - pos.x) * 0.06;
      pos.y += (gyroTargetY - pos.y) * 0.06;

      parallaxRaf = requestAnimationFrame(runParallaxLoop);
    }

    function startParallaxLoop() {
      if (!parallaxRaf) {
        parallaxRaf = requestAnimationFrame(runParallaxLoop);
      }
    }

    function stopParallaxLoop() {
      if (parallaxRaf) {
        cancelAnimationFrame(parallaxRaf);
        parallaxRaf = null;
      }
      kiteGroup.object3D.position.set(0, 0, 0);
    }


    /* ====================================================
       WIND TRAIL SYSTEM
       Round-robin borrows a sphere from the pool, places
       it at the kite's current position, then fades it
       out while drifting it upward — like a wisp of smoke
       breaking off the kite's tail.
       Uses direct Three.js material access for performance.
    ==================================================== */

    function spawnTrail(x, y, z, baseOpacity) {
      const t = trailPool[trailPoolIdx % trailPool.length];
      trailPoolIdx++;

      t.object3D.position.set(x, y, z - 0.003);

      const startX     = x;
      const startY     = y;
      const driftDir   = (trailPoolIdx % 2 === 0) ? 1 : -1;
      const startTime  = performance.now();
      const duration   = 560;

      function fade() {
        const p    = Math.min((performance.now() - startTime) / duration, 1);
        const ease = 1 - Math.pow(1 - p, 2);     /* ease-out quad */

        /* Drift: upward + slight sideways */
        t.object3D.position.y = startY + ease * 0.022;
        t.object3D.position.x = startX + driftDir * ease * 0.007;

        /* Opacity: quick ramp-in, slow fade-out */
        const op = p < 0.12
          ? (p / 0.12) * baseOpacity
          : baseOpacity * (1 - (p - 0.12) / 0.88);

        /* Direct Three.js update — bypasses A-Frame's attribute
           parsing overhead so this can run every rAF frame. */
        const mesh = t.object3D.children[0];
        if (mesh && mesh.material) {
          mesh.material.opacity = Math.max(0, op);
          mesh.material.needsUpdate = true;
        }

        if (p < 1) {
          requestAnimationFrame(fade);
        } else if (mesh && mesh.material) {
          mesh.material.opacity = 0;
          mesh.material.needsUpdate = true;
          /* Park out of view until needed again */
          t.object3D.position.set(0, -5, 0);
        }
      }

      requestAnimationFrame(fade);
    }


    /* ====================================================
       ANIMATED POSTER FRAME
       Four bars expand from the center outward —
       top/bottom expand horizontally, sides expand
       vertically — then fade out on target loss.
    ==================================================== */

    function animateFrameIn() {
      /* [axis, bar element, delay ms] */
      const bars = [
        ["x", frameTop,    0  ],
        ["x", frameBottom, 55 ],
        ["y", frameLeft,   120],
        ["y", frameRight,  120]
      ];

      bars.forEach(([axis, el, delay]) => {
        /* Make bar visible */
        setEntityOpacity(el, 0.88);
        /* Reset collapsed state */
        el.object3D.scale[axis] = 0;

        setTimeout(() => {
          if (!tracked) return;
          const start = performance.now();

          function anim() {
            const p = Math.min((performance.now() - start) / 380, 1);
            /* Ease-out cubic */
            el.object3D.scale[axis] = 1 - Math.pow(1 - p, 3);
            if (p < 1) requestAnimationFrame(anim);
          }

          requestAnimationFrame(anim);
        }, delay);
      });
    }

    function animateFrameOut(duration) {
      [frameTop, frameBottom, frameLeft, frameRight].forEach(el => {
        const mat     = el.getAttribute("material");
        const startOp = mat ? (mat.opacity || 0) : 0;
        if (startOp <= 0) return;

        const start = performance.now();

        function anim() {
          const p = Math.min((performance.now() - start) / duration, 1);
          setEntityOpacity(el, startOp * (1 - p));
          if (p < 1) {
            requestAnimationFrame(anim);
          } else {
            /* Reset scale so it's ready for next targetFound */
            el.object3D.scale.set(1, 1, 1);
          }
        }

        requestAnimationFrame(anim);
      });
    }


    /* ====================================================
       RESET KITES
    ==================================================== */

    function resetKites() {

      kiteTimers.forEach(timer => clearTimeout(timer));
      kiteTimers = [];

      const startPositions = {
        kiteOrange:  [-0.207, 0.165],
        kiteWhite:   [-0.105, 0.190],
        kiteBlue:    [ 0.135, 0.165],
        kiteOrange2: [-0.36,  0.08 ],
        kiteBlue2:   [ 0.34,  0.12 ],
        kiteWhite2:  [ 0.22,  0.25 ],
        kiteOrange3: [-0.43,  0.20 ],
        kiteBlue3:   [ 0.43,  0.24 ]
      };

      const namedKites = [
        ["kiteOrange",  kiteOrange ],
        ["kiteWhite",   kiteWhite  ],
        ["kiteBlue",    kiteBlue   ],
        ["kiteOrange2", kiteOrange2],
        ["kiteBlue2",   kiteBlue2  ],
        ["kiteWhite2",  kiteWhite2 ],
        ["kiteOrange3", kiteOrange3],
        ["kiteBlue3",   kiteBlue3  ]
      ];

      namedKites.forEach(([name, kite]) => {
        const [x, y] = startPositions[name];
        kite.object3D.position.set(x, y, 0.025);
        kite.object3D.rotation.z = Math.PI / 4;
        setEntityOpacity(kite, 0);
      });

      sparks.forEach(spark => setEntityOpacity(spark, 0));

      glints.forEach(glint => {
        setEntityOpacity(glint, 0);
        glint.object3D.scale.set(0.5, 0.5, 0.5);
      });

      /* Return all trail particles to their parked position */
      trailPool.forEach(t => {
        const mesh = t.object3D && t.object3D.children[0];
        if (mesh && mesh.material) {
          mesh.material.opacity = 0;
          mesh.material.needsUpdate = true;
        }
        t.object3D.position.set(0, -5, 0);
      });
    }


    /* ====================================================
       ANIMATE ONE KITE
       Modified to spawn wind trail particles at each
       7% progress step while the kite is visible.
    ==================================================== */

    function animateKite(
      kite,
      startX, startY,
      endX,   endY,
      duration,
      delay
    ) {
      const timer = setTimeout(() => {

        if (!tracked) return;

        const startTime = performance.now();
        const startZ    = 0.025;
        const endZ      = 0.14;
        let lastTrailProg = -0.09;

        function frame() {

          if (!tracked) return;

          const progress = Math.min(
            (performance.now() - startTime) / duration,
            1
          );

          const eased = 1 - Math.pow(1 - progress, 3);
          const arc   = Math.sin(progress * Math.PI) * 0.055;

          const x = startX + (endX - startX) * eased;
          const y = startY + (endY - startY) * eased + arc;
          const z = startZ + (endZ - startZ) * eased;

          kite.object3D.position.set(x, y, z);
          kite.object3D.rotation.z =
            Math.PI / 4 + progress * Math.PI * 2.35;

          let opacity;
          if (progress < 0.08)       opacity = progress / 0.08;
          else if (progress < 0.72)  opacity = 1;
          else                       opacity = 1 - ((progress - 0.72) / 0.28);

          setEntityOpacity(kite, opacity);

          /* Spawn a trail wisp every ~7% of travel distance
             while the kite is meaningfully visible */
          if (
            progress - lastTrailProg >= 0.07 &&
            progress > 0.06 &&
            progress < 0.87
          ) {
            lastTrailProg = progress;
            spawnTrail(x, y, z, opacity * 0.52);
          }

          if (progress < 1) requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);

      }, delay);

      kiteTimers.push(timer);
    }


    /* ====================================================
       LAUNCH ALL KITES
    ==================================================== */

    function launchKites() {

      resetKites();
      playWhoosh();

      /* Hero kites */
      animateKite(kiteOrange, -0.207, 0.165, -0.46, 0.60, 1700,  0  );
      animateKite(kiteWhite,  -0.105, 0.190, -0.02, 0.68, 1850,  140);
      animateKite(kiteBlue,    0.135, 0.165,  0.46, 0.58, 1950,  260);

      /* Secondary kites */
      animateKite(kiteOrange2, -0.36, 0.08, -0.60, 0.34, 1450, 420 );
      animateKite(kiteBlue2,    0.34, 0.12,  0.62, 0.42, 1500, 560 );
      animateKite(kiteWhite2,   0.22, 0.25,  0.34, 0.66, 1650, 720 );
      animateKite(kiteOrange3, -0.43, 0.20, -0.66, 0.50, 1350, 880 );
      animateKite(kiteBlue3,    0.43, 0.24,  0.68, 0.54, 1450, 1020);

      /* Atmospheric sparks */
      sparks.forEach((spark, index) => {
        const timer = setTimeout(() => {
          if (!tracked) return;

          const start    = spark.object3D.position.clone();
          const startTime = performance.now();
          const duration  = 900 + index * 120;
          const targetX   = start.x + (index % 2 === 0 ? -1 : 1) * (0.06 + index * 0.008);
          const targetY   = start.y + 0.10 + index * 0.012;

          function sparkFrame() {
            if (!tracked) return;

            const progress = Math.min(
              (performance.now() - startTime) / duration,
              1
            );
            const eased = 1 - Math.pow(1 - progress, 3);

            spark.object3D.position.x = start.x + (targetX - start.x) * eased;
            spark.object3D.position.y = start.y + (targetY - start.y) * eased;

            const opacity = progress < 0.15
              ? progress / 0.15
              : 1 - ((progress - 0.15) / 0.85);

            setEntityOpacity(spark, Math.max(0, opacity * 0.8));

            if (progress < 1) requestAnimationFrame(sparkFrame);
          }

          requestAnimationFrame(sparkFrame);

        }, 450 + index * 90);

        kiteTimers.push(timer);
      });

      /* Glint pulses */
      glints.forEach((glint, index) => {
        const timer = setTimeout(() => {
          if (!tracked) return;

          const start    = performance.now();
          const duration = 700;

          function glintFrame() {
            if (!tracked) return;

            const progress   = Math.min((performance.now() - start) / duration, 1);
            const brightness = Math.sin(progress * Math.PI);
            const scale      = 0.5 + brightness * 1.5;

            glint.object3D.scale.set(scale, scale, scale);
            setEntityOpacity(glint, brightness * 0.95);

            if (progress < 1) requestAnimationFrame(glintFrame);
          }

          requestAnimationFrame(glintFrame);

        }, 600 + index * 430);

        kiteTimers.push(timer);
      });
    }


    /* ====================================================
       KITE LOOP — re-launches every ~4.2 s while tracked
    ==================================================== */

    function startKiteLoop() {
      stopKiteLoop();
      kiteLoopTimer = setInterval(() => {
        if (!tracked) { stopKiteLoop(); return; }
        launchKites();
      }, 4200);
    }

    function stopKiteLoop() {
      if (kiteLoopTimer !== null) {
        clearInterval(kiteLoopTimer);
        kiteLoopTimer = null;
      }
    }


    /* ====================================================
       INK-BLEED PORTAL WIPE REVEAL
       Snaps the 20 ink panels to opaque black (covering
       the video), sets the video to full opacity behind
       them, then dissolves the panels away in a randomised
       order so the video "bleeds" through like ink washing
       off paper.
    ==================================================== */

    function inkBleedReveal() {

      /* Video is visible immediately — panels conceal it */
      setVideoOpacity(1);

      /* Activate all panels */
      inkPanels.forEach(panel => setEntityOpacity(panel, 0.97));

      /* Randomise dissolve order */
      const shuffled = [...inkPanels].sort(() => Math.random() - 0.5);

      shuffled.forEach((panel, i) => {

        /* Stagger start times across a 750ms window */
        const startDelay = (i / shuffled.length) * 750 + Math.random() * 160;

        setTimeout(() => {

          /* If tracking was lost during the reveal, clear immediately */
          if (!tracked) {
            setEntityOpacity(panel, 0);
            return;
          }

          const start = performance.now();

          function dissolve() {
            if (!tracked) {
              setEntityOpacity(panel, 0);
              return;
            }

            const p = Math.min((performance.now() - start) / 290, 1);
            /* Ease-in — accelerates toward the end for a sharp ink-snap */
            setEntityOpacity(panel, 0.97 * (1 - p * p));

            if (p < 1) requestAnimationFrame(dissolve);
            else        setEntityOpacity(panel, 0);
          }

          requestAnimationFrame(dissolve);

        }, startDelay);
      });
    }


    /* ====================================================
       FADE VIDEO OUT (graceful — used on targetLost)
    ==================================================== */

    function fadeVideoOut(onComplete) {

      if (fadeAnimation) {
        cancelAnimationFrame(fadeAnimation);
        fadeAnimation = null;
      }

      const material    = arVideo.getAttribute("material");
      const startOpacity = material ? material.opacity : 0;

      if (startOpacity <= 0) {
        onComplete && onComplete();
        return;
      }

      const duration  = 600;
      const startTime = performance.now();

      function animate() {
        const progress = Math.min(
          (performance.now() - startTime) / duration,
          1
        );
        setVideoOpacity(startOpacity * (1 - progress));

        if (progress < 1) {
          fadeOutAnimation = requestAnimationFrame(animate);
        } else {
          fadeOutAnimation = null;
          video.pause();
          video.currentTime = 0;
          setVideoOpacity(0);
          onComplete && onComplete();
        }
      }

      fadeOutAnimation = requestAnimationFrame(animate);
    }


    /* ====================================================
       RESET VIDEO (instant)
    ==================================================== */

    function resetVideo() {
      if (fadeTimer)        { clearTimeout(fadeTimer); fadeTimer = null; }
      if (fadeAnimation)    { cancelAnimationFrame(fadeAnimation);    fadeAnimation    = null; }
      if (fadeOutAnimation) { cancelAnimationFrame(fadeOutAnimation); fadeOutAnimation = null; }

      video.pause();
      video.currentTime = 0;
      setVideoOpacity(0);
    }


    /* ====================================================
       FADE KITES OUT (graceful — on targetLost)
    ==================================================== */

    function fadeKitesOut(duration, onComplete) {

      const startTime = performance.now();

      const kiteStartOps  = allKites.map(k => { const m = k.getAttribute("material"); return m ? (m.opacity || 0) : 0; });
      const sparkStartOps = sparks.map(s   => { const m = s.getAttribute("material"); return m ? (m.opacity || 0) : 0; });
      const glintStartOps = glints.map(g   => { const m = g.getAttribute("material"); return m ? (m.opacity || 0) : 0; });

      function frame() {
        const progress = Math.min((performance.now() - startTime) / duration, 1);

        allKites.forEach((k, i) => setEntityOpacity(k, kiteStartOps[i]  * (1 - progress)));
        sparks.forEach(  (s, i) => setEntityOpacity(s, sparkStartOps[i] * (1 - progress)));
        glints.forEach(  (g, i) => setEntityOpacity(g, glintStartOps[i] * (1 - progress)));

        if (progress < 1) requestAnimationFrame(frame);
        else onComplete && onComplete();
      }

      requestAnimationFrame(frame);
    }


    /* ====================================================
       START AR
    ==================================================== */

    startButton.addEventListener("click", async () => {

      /* Unlock AudioContext on this user gesture */
      ensureAudio();

      /* Request gyroscope permission (required on iOS 13+) */
      if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
      ) {
        try {
          const state = await DeviceOrientationEvent.requestPermission();
          if (state === "granted") {
            window.addEventListener("deviceorientation", handleOrientation);
          }
        } catch (e) {
          /* Permission denied or unavailable — parallax simply won't run */
        }
      } else {
        /* Android + non-iOS browsers don't need a permission prompt */
        window.addEventListener("deviceorientation", handleOrientation);
      }

      intro.style.display   = "none";
      loading.style.display = "flex";

      const mindar = scene.systems["mindar-image-system"];

      try {
        await mindar.start();
        loading.style.display  = "none";
        scanning.style.display = "flex";
      } catch (error) {
        console.error(error);
        loading.innerHTML = "Unable to access the camera.";
      }
    });


    /* ====================================================
       POSTER FOUND
    ==================================================== */

    target.addEventListener("targetFound", () => {

      console.log("POSTER FOUND");

      if (tracked) return;

      tracked = true;

      scanning.style.display = "none";

      found.style.display = "block";
      setTimeout(() => { found.style.display = "none"; }, 1200);

      /* Haptic + chime */
      vibrate();
      playDetectionChime();

      /* Animate the frame border in */
      animateFrameIn();

      /* Reset flying elements */
      resetKites();
      setVideoOpacity(0);

      /* Start video (invisible until ink-bleed reveal) */
      video.currentTime = 0;
      video.play().catch(err => console.log("Video playback:", err));

      /* Launch kites immediately, then loop */
      launchKites();
      startKiteLoop();

      /* Start gyroscope parallax */
      startParallaxLoop();

      /* Ink-bleed reveal after 2s (replacing plain fadeVideoIn) */
      fadeTimer = setTimeout(() => {
        if (!tracked) return;
        inkBleedReveal();
      }, 2000);
    });


    /* ====================================================
       POSTER LOST — graceful fade-out
    ==================================================== */

    target.addEventListener("targetLost", () => {

      console.log("POSTER LOST");

      tracked = false;

      /* Stop all repeating loops immediately */
      stopKiteLoop();
      stopParallaxLoop();

      /* Cancel any pending kite timers */
      kiteTimers.forEach(t => clearTimeout(t));
      kiteTimers = [];

      /* Cancel pending video-start timer */
      if (fadeTimer) { clearTimeout(fadeTimer); fadeTimer = null; }

      /* Fade frame out */
      animateFrameOut(400);

      /* Fade kites out, then hard-reset them */
      fadeKitesOut(400, () => resetKites());

      /* Fade video out */
      fadeVideoOut(() => {});

      /* Clear any in-progress ink panels immediately */
      inkPanels.forEach(panel => setEntityOpacity(panel, 0));

      /* Show scanning UI after the fade so it doesn't flash */
      setTimeout(() => {
        if (!tracked) scanning.style.display = "flex";
      }, 350);

      found.style.display = "none";
    });


    /* ====================================================
       INITIAL STATE
    ==================================================== */

    resetKites();
    setVideoOpacity(0);
    inkPanels.forEach(panel => setEntityOpacity(panel, 0));

  </script>


</body>

</html>
