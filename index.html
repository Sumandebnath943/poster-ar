<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AR Experience</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }


    /* INTRO */

    #intro {

      position: fixed;
      inset: 0;

      z-index: 10000;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding: 30px;

      text-align: center;

      color: white;
      background: black;

    }


    #intro h1 {

      margin: 0 0 12px;

      font-size: 28px;
      font-weight: 600;

    }


    #intro p {

      max-width: 320px;

      margin: 0 0 28px;

      line-height: 1.5;

      font-size: 16px;

      opacity: 0.75;

    }


    #start {

      padding: 15px 28px;

      border: none;

      border-radius: 999px;

      background: white;
      color: black;

      font-size: 16px;
      font-weight: 600;

    }


    /* LOADING */

    #loading {

      position: fixed;
      inset: 0;

      z-index: 9500;

      display: none;

      align-items: center;
      justify-content: center;

      color: white;
      background: black;

      font-size: 16px;

    }


    /* SCANNING */

    #scanning {

      position: fixed;

      z-index: 9000;

      left: 50%;
      bottom: 50px;

      transform: translateX(-50%);

      padding: 12px 20px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.7);

      color: white;

      font-size: 15px;

      white-space: nowrap;

      display: none;

    }


    /* FOUND */

    #found {

      position: fixed;

      z-index: 9000;

      left: 50%;
      bottom: 50px;

      transform: translateX(-50%);

      padding: 10px 18px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.65);

      color: white;

      font-size: 14px;

      display: none;

    }

  </style>

</head>


<body>


  <!-- INTRO -->

  <div id="intro">

    <h1>AR Experience</h1>

    <p>
      Point your camera at the poster
      to bring it to life.
    </p>

    <button id="start">
      Start Experience
    </button>

  </div>


  <!-- LOADING -->

  <div id="loading">
    Starting camera...
  </div>


  <!-- SCANNING -->

  <div id="scanning">
    Point your camera at the poster
  </div>


  <!-- FOUND -->

  <div id="found">
    ✓ Poster detected
  </div>


  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true,
      physicallyCorrectLights
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >


    <a-assets>

      <video

        id="film"

        src="./film-web.mp4"

        loop

        playsinline
        webkit-playsinline

        crossorigin="anonymous"

      ></video>

    </a-assets>


    <a-camera

      position="0 0 0"

      look-controls="enabled: false"

    ></a-camera>


    <!-- POSTER TARGET -->

    <a-entity
      id="posterTarget"
      mindar-image-target="targetIndex: 0"
    >

      <a-video

        id="arVideo"

        src="#film"

        width="1"

        height="0.5625"

        position="0 0 0.01"

        material="
          shader: flat;
          transparent: true;
          opacity: 0;
        "

      ></a-video>

    </a-entity>


  </a-scene>


  <script>


    const scene =
      document.querySelector("a-scene");


    const startButton =
      document.querySelector("#start");


    const intro =
      document.querySelector("#intro");


    const loading =
      document.querySelector("#loading");


    const scanning =
      document.querySelector("#scanning");


    const found =
      document.querySelector("#found");


    const video =
      document.querySelector("#film");


    const arVideo =
      document.querySelector("#arVideo");


    const target =
      document.querySelector("#posterTarget");


    let fadeTimer = null;

    let fadeAnimation = null;


    /* ----------------------------------
       VIDEO OPACITY
    ---------------------------------- */


    function setVideoOpacity(value) {

      const material =
        arVideo.getAttribute("material");

      material.opacity = value;

      arVideo.setAttribute(
        "material",
        material
      );

    }


    /* ----------------------------------
       FADE VIDEO IN
    ---------------------------------- */


    function fadeVideoIn() {

      if (fadeAnimation) {

        cancelAnimationFrame(
          fadeAnimation
        );

      }


      const startTime =
        performance.now();


      const duration = 1500;


      function animate() {

        const elapsed =
          performance.now() - startTime;


        const progress =
          Math.min(elapsed / duration, 1);


        // Smooth ease-in

        const eased =
          progress * progress *
          (3 - 2 * progress);


        setVideoOpacity(eased);


        if (progress < 1) {

          fadeAnimation =
            requestAnimationFrame(animate);

        }

      }


      animate();

    }


    /* ----------------------------------
       RESET VIDEO
    ---------------------------------- */


    function resetVideo() {

      if (fadeTimer) {

        clearTimeout(fadeTimer);

        fadeTimer = null;

      }


      if (fadeAnimation) {

        cancelAnimationFrame(
          fadeAnimation
        );

        fadeAnimation = null;

      }


      video.pause();

      video.currentTime = 0;

      setVideoOpacity(0);

    }


    /* ----------------------------------
       START AR
    ---------------------------------- */


    startButton.addEventListener(
      "click",
      async () => {

        intro.style.display = "none";

        loading.style.display = "flex";


        const mindar =
          scene.systems[
            "mindar-image-system"
          ];


        try {

          await mindar.start();


          loading.style.display = "none";

          scanning.style.display = "block";

        }

        catch (error) {

          console.error(error);

          loading.innerHTML =
            "Unable to access the camera.";

        }

      }
    );


    /* ----------------------------------
       POSTER FOUND
    ---------------------------------- */


    target.addEventListener(
      "targetFound",
      () => {

        console.log(
          "POSTER FOUND"
        );


        scanning.style.display = "none";

        found.style.display = "block";


        setTimeout(() => {

          found.style.display = "none";

        }, 1200);


        /*
          Start the actual video immediately.

          BUT keep it invisible.

          The camera therefore continues
          showing the original poster.
        */


        setVideoOpacity(0);


        video.currentTime = 0;


        video.play().catch(
          error => {

            console.log(
              "Video playback:",
              error
            );

          }
        );


        /*
          Wait approximately 2 seconds.

          By this point the video has
          moved past the black opening.

          Then reveal it.
        */


        fadeTimer = setTimeout(
          () => {

            fadeVideoIn();

          },
          2000
        );

      }
    );


    /* ----------------------------------
       POSTER LOST
    ---------------------------------- */


    target.addEventListener(
      "targetLost",
      () => {

        console.log(
          "POSTER LOST"
        );


        scanning.style.display = "block";

        found.style.display = "none";


        resetVideo();

      }
    );


  </script>


</body>

</html>
