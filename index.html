<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >
  <meta name="theme-color" content="#0f0c29">

  <title>Into the Void</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #050505;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* =====================================================
       PORTFOLIO ENTRY PAGE
    ===================================================== */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 10000;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 30px;
      text-align: center;
      color: white;

      /* Animated cosmic mesh background */
      background: linear-gradient(45deg, #0f0c29, #302b63, #24243e, #0a0a0a);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating glowing orbs behind the text */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      z-index: -1;
      animation: floatOrb 8s infinite alternate ease-in-out;
    }
    .bg-orb-1 {
      width: 250px; height: 250px;
      background: rgba(255, 126, 95, 0.25);
      top: 10%; left: -10%;
      animation-delay: 0s;
    }
    .bg-orb-2 {
      width: 200px; height: 200px;
      background: rgba(0, 212, 255, 0.25);
      bottom: 10%; right: -5%;
      animation-delay: -4s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -50px) scale(1.1); }
    }

    .intro-logo {
      width: 96px;
      height: 96px;
      margin-bottom: 26px;
      border-radius: 26px;
      box-shadow: 0 15px 45px rgba(255, 126, 95, 0.4), inset 0 0 0 1px rgba(255,255,255,0.2);
      object-fit: cover;
      animation: floatLogo 4s ease-in-out infinite;
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    #intro h1 {
      margin: 0 0 14px;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #ffffff 0%, #dcdcdc 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    #intro p {
      max-width: 310px;
      margin: 0 0 10px;
      line-height: 1.6;
      font-size: 17px;
      color: rgba(255,255,255,0.85);
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .runtime {
      margin: 0 0 34px !important;
      font-size: 12px !important;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45) !important;
    }

    #start {
      position: relative;
      overflow: hidden;
      padding: 18px 46px;
      border: none;
      border-radius: 999px;
      background: white;
      color: #050505;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.25);
      transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* Sweeping shine effect on button */
    #start::after {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
      transform: skewX(-20deg);
      animation: sweepShine 3s infinite;
    }

    @keyframes sweepShine {
      0% { left: -100%; }
      20% { left: 200%; }
      100% { left: 200%; }
    }

    #start:active { transform: scale(0.92); }

    /* Secondary intro actions */
    .intro-secondary {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 22px;
    }

    .link-btn {
      padding: 8px 14px;
      border: none;
      background: none;
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    .link-btn:active { color: white; }

    #resumeRow {
      display: none;
      align-items: center;
      gap: 10px;
    }
    body.has-resume #resumeRow { display: flex; }

    #resume {
      padding: 11px 22px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }
    #resume:active { transform: scale(0.94); }

    /* LOADING */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 9500;
      display: none;
      align-items: center;
      justify-content: center;
      color: white;
      background: black;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 1px;
      text-align: center;
      padding: 30px;
    }

    /* =====================================================
       SCANNING UI
    ===================================================== */
    #scanning {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: none;
      pointer-events: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    #scanning::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 78% 55% at 50% 50%,
        transparent 40%,
        rgba(0, 0, 0, 0.55) 100%
      );
    }

    /* Matches the poster: 16:9 landscape, NOT 3:4 portrait. */
    .scan-frame {
      position: relative;
      width: min(88vw, 460px);
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
    }

    .scan-frame::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    .scan-corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: white;
      border-style: solid;
      animation: scanCornerPulse 2s ease-in-out infinite;
    }

    .scan-corner.tl { top: 0; left: 0; border-width: 2.5px 0 0 2.5px; border-radius: 6px 0 0 0; animation-delay: 0s; }
    .scan-corner.tr { top: 0; right: 0; border-width: 2.5px 2.5px 0 0; border-radius: 0 6px 0 0; animation-delay: 0.25s; }
    .scan-corner.bl { bottom: 0; left: 0; border-width: 0 0 2.5px 2.5px; border-radius: 0 0 0 6px; animation-delay: 0.5s; }
    .scan-corner.br { bottom: 0; right: 0; border-width: 0 2.5px 2.5px 0; border-radius: 0 0 6px 0; animation-delay: 0.75s; }

    @keyframes scanCornerPulse {
      0%, 100% { opacity: 1;    transform: scale(1);    }
      50%      { opacity: 0.3; transform: scale(0.92); }
    }

    .scan-sweep {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(
        to right,
        transparent 0%,
        rgba(255, 255, 255, 0.7) 35%,
        white 50%,
        rgba(255, 255, 255, 0.7) 65%,
        transparent 100%
      );
      box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.35);
      animation: scanSweep 2.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    @keyframes scanSweep {
      0%   { top: 0%;   opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .scan-label {
      position: relative;
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      padding: 0 24px;
      min-height: 16px;
      transition: color 0.3s;
    }
    .scan-label.warn { color: #ffd08a; }

    /* Rotate-to-landscape nudge */
    #rotateHint {
      position: relative;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255,255,255,0.18);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      color: white;
      font-size: 12.5px;
      font-weight: 600;
    }
    body.portrait.state-scanning #rotateHint { display: flex; }

    .rotate-icon {
      display: inline-block;
      width: 13px; height: 20px;
      border: 2px solid white;
      border-radius: 3px;
      animation: rotatePhone 2.6s ease-in-out infinite;
    }
    @keyframes rotatePhone {
      0%, 40%   { transform: rotate(0deg); }
      60%, 100% { transform: rotate(-90deg); }
    }

    /* =====================================================
       TRANSIENT CHIP (found / realigning / errors)
    ===================================================== */
    #chip {
      position: fixed;
      z-index: 9200;
      left: 50%;
      bottom: 118px;
      transform: translateX(-50%) translateY(8px);
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.62);
      border: 1px solid rgba(255,255,255,0.14);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      color: white;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    #chip.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =====================================================
       AR HUD
    ===================================================== */
    #hud {
      position: fixed;
      z-index: 9300;
      left: 0; right: 0;
      bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      display: none;
      justify-content: center;
      gap: 14px;
      pointer-events: none;
    }
    body.state-scanning #hud,
    body.state-tracking #hud { display: flex; }
    body.cinema #hud { display: none; }

    .hud-btn {
      width: 52px;
      height: 52px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 50%;
      background: rgba(12, 12, 16, 0.5);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      color: white;
      font-size: 21px;
      line-height: 1;
      cursor: pointer;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.2s ease, opacity 0.2s ease;
    }
    .hud-btn:active { transform: scale(0.88); }
    .hud-btn.on {
      background: rgba(255, 255, 255, 0.9);
      color: #0a0a0a;
      border-color: transparent;
    }
    .hud-btn[disabled] { opacity: 0.3; pointer-events: none; }

    /* Capture, portal + cinema only make sense once the film is up */
    #btnShot, #btnCinema, #btnPortal { display: none; }
    body.revealed #btnShot,
    body.revealed #btnCinema,
    body.revealed #btnPortal { display: flex; }

    /* Shutter flash */
    #flash {
      position: fixed;
      inset: 0;
      z-index: 11000;
      background: white;
      opacity: 0;
      pointer-events: none;
    }
    #flash.fire { animation: flashFade 0.42s ease-out; }
    @keyframes flashFade {
      0%   { opacity: 0.85; }
      100% { opacity: 0; }
    }

    /* =====================================================
       VIDEO HOST — one <video>, two presentations.
       In AR it stays technically on-screen (2px, near-invisible)
       so the browser keeps decoding frames for the GL texture.
    ===================================================== */
    #videoHost {
      position: fixed;
      right: 0;
      bottom: 0;
      width: 2px;
      height: 2px;
      overflow: hidden;
      opacity: 0.01;
      z-index: 0;
      pointer-events: none;
      background: #000;
    }
    #videoHost video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    body.cinema #videoHost {
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 1;
      z-index: 12000;
      pointer-events: auto;
    }

    #cinemaBar {
      position: fixed;
      z-index: 12100;
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: 16px;
      right: 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    body.cinema #cinemaBar { display: flex; }

    .pill-btn {
      padding: 11px 18px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      background: rgba(12, 12, 16, 0.62);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      color: white;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    .pill-btn:active { transform: scale(0.94); }

    /* =====================================================
       END CARD
    ===================================================== */
    #endCard {
      position: fixed;
      inset: 0;
      z-index: 12500;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 30px;
      text-align: center;
      color: white;
      background: rgba(5, 5, 8, 0.82);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
    }
    body.ended #endCard { display: flex; }

    #endCard h2 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }
    #endCard p {
      margin: 0 0 12px;
      max-width: 300px;
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255,255,255,0.7);
    }
    .end-logo {
      width: 64px; height: 64px;
      border-radius: 18px;
      object-fit: cover;
      margin-bottom: 4px;
      box-shadow: 0 10px 30px rgba(255,126,95,0.28);
    }
    .end-role {
      margin: 0 0 4px !important;
      font-size: 13px !important;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5) !important;
    }
    .end-links {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 8px;
    }
    .end-links a {
      color: rgba(255,255,255,0.82);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.25);
      padding-bottom: 2px;
    }
    .end-links a:active { color: #fff; }
    .end-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .pill-btn.primary {
      background: #fff;
      color: #0a0a0a;
      border-color: transparent;
      font-weight: 800;
    }
    .pill-btn[hidden] { display: none; }

    /* A-Frame's own canvas must never eat HUD taps */
    a-scene { z-index: 1; }

    /* A-Frame still injects its VR / fullscreen affordances even with
       vr-mode-ui disabled — they have no meaning in a poster AR view. */
    .a-enter-vr, .a-enter-ar, .a-orientation-modal { display: none !important; }
  </style>
</head>

<body class="state-intro">

  <!-- =====================================================
       ENTRY PAGE
  ====================================================== -->
  <div id="intro">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <img src="./logo-256.jpg" alt="" class="intro-logo" width="96" height="96">

    <h1>Into the Void</h1>
    <p>Point your camera at the poster to reveal the hidden 3D dimension.</p>
    <p class="runtime" id="runtimeLabel">Short film &middot; 5 min 58 sec</p>

    <button id="start">Enter AR Experience</button>

    <div class="intro-secondary">
      <div id="resumeRow">
        <button id="resume">Resume from <span id="resumeTime">0:00</span></button>
      </div>
      <button class="link-btn" id="noPoster">No poster? Watch the film</button>
    </div>
  </div>

  <!-- LOADING -->
  <div id="loading">Starting camera&hellip;</div>

  <!-- SCANNING -->
  <div id="scanning">
    <div class="scan-frame">
      <div class="scan-corner tl"></div>
      <div class="scan-corner tr"></div>
      <div class="scan-corner bl"></div>
      <div class="scan-corner br"></div>
      <div class="scan-sweep"></div>
    </div>
    <div class="scan-label" id="scanLabel">Scanning&hellip;</div>
    <div id="rotateHint"><span class="rotate-icon"></span> Turn sideways for a faster lock</div>
  </div>

  <!-- TRANSIENT CHIP -->
  <div id="chip"></div>

  <!-- AR HUD -->
  <div id="hud">
    <button class="hud-btn" id="btnSound"  aria-label="Toggle sound">&#128266;</button>
    <button class="hud-btn" id="btnWind"   aria-label="Blow to fly">&#127788;</button>
    <button class="hud-btn" id="btnPortal" aria-label="Open the portal">&#128506;</button>
    <button class="hud-btn" id="btnShot"   aria-label="Capture photo">&#128247;</button>
    <button class="hud-btn" id="btnCinema" aria-label="Watch full screen">&#9974;</button>
  </div>

  <div id="flash"></div>

  <!-- =====================================================
       THE FILM
       Deliberately OUTSIDE <a-assets>: a 20 MB / 6 min file in
       a-assets blocks scene load. preload="none" means nothing
       downloads until the user actually commits by tapping start.
  ====================================================== -->
  <div id="videoHost">
    <video
      id="film"
      src="./film-web.mp4"
      playsinline
      webkit-playsinline
      crossorigin="anonymous"
      preload="none"
      disablepictureinpicture
    ></video>
  </div>

  <div id="cinemaBar">
    <button class="pill-btn" id="btnExitCinema">&larr; Back to AR</button>
    <button class="pill-btn" id="btnCinemaSound">&#128266; Sound</button>
  </div>

  <!-- END CARD / CONTACT
       The film used to end on a dead stop. This is the moment the
       piece has earned attention, so it hands over details. -->
  <div id="endCard">
    <img src="./logo-256.jpg" alt="" class="end-logo" width="64" height="64">
    <h2 id="endName">&nbsp;</h2>
    <p class="end-role" id="endRole">&nbsp;</p>
    <div class="end-links" id="endLinks"></div>
    <div class="end-actions">
      <button class="pill-btn primary" id="btnSaveContact">Save contact</button>
      <button class="pill-btn" id="btnReplay">Watch again</button>
      <button class="pill-btn" id="btnEndClose">Back to AR</button>
    </div>
  </div>

  <!--
    renderer properties are separated by SEMICOLONS in A-Frame. Using commas
    collapses the whole string into one bogus `colorManagement` value and
    silently drops everything after it — which is why antialias never applied.
    `precision` also only accepts high/medium/low, not "highp".
  -->
  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind?v=2;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
      filterMinCF: 0.001;
      filterBeta: 2500;
      missTolerance: 10;
      warmupTolerance: 5;
    "
    renderer="colorManagement: true; antialias: true; precision: high; sortTransparentObjects: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <!-- ASSETS (small images only — the film loads on demand) -->
    <a-assets>
      <img id="kiteOrange" src="./kite-orange.png">
      <img id="kiteBlue"   src="./kite-blue.png">
      <img id="kiteWhite"  src="./kite-white.png">
    </a-assets>

    <!-- CAMERA -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- POSTER TARGET -->
    <a-entity id="posterTarget" mindar-image-target="targetIndex: 0">

      <!-- ================================================
           PARALLAX LAYERS
           Heights are width * 1.3849 (the kite PNGs are
           317x439). Square planes were squashing them ~28%.
      ================================================= -->

      <!-- BACKGROUND LAYER -->
      <a-entity id="kiteGroupBack">
        <a-image id="kiteWhiteAR" src="#kiteWhite" width="0.052" height="0.0720" position="-0.105 0.190 0.025" rotation="0 0 45" material="shader: flat; transparent: true; opacity: 0;"></a-image>
        <a-image id="kiteBlue2" src="#kiteBlue" width="0.032" height="0.0443" position="0.34 0.12 0.026" rotation="0 0 55" material="shader: flat; transparent: true; opacity: 0;"></a-image>
        <a-image id="kiteWhite2" src="#kiteWhite" width="0.028" height="0.0388" position="0.22 0.25 0.026" rotation="0 0 40" material="shader: flat; transparent: true; opacity: 0;"></a-image>
        <a-sphere id="spark2" radius="0.003" position="-0.28 0.24 0.035" material="shader: flat; color: white; transparent: true; opacity: 0;"></a-sphere>
        <a-sphere id="spark4" radius="0.003" position="0.30 0.18 0.035" material="shader: flat; color: white; transparent: true; opacity: 0;"></a-sphere>
        <a-ring id="glint2" radius-inner="0.005" radius-outer="0.008" position="0.28 0.08 0.04" material="shader: flat; color: white; transparent: true; opacity: 0;"></a-ring>
      </a-entity>

      <!-- FOREGROUND LAYER -->
      <a-entity id="kiteGroupFront">
        <a-image id="kiteOrangeAR" src="#kiteOrange" width="0.055" height="0.0762" position="-0.207 0.165 0.025" rotation="0 0 45" material="shader: flat; transparent: true; opacity: 0;"></a-image>
        <a-image id="kiteBlueAR" src="#kiteBlue" width="0.048" height="0.0665" position="0.135 0.165 0.025" rotation="0 0 45" material="shader: flat; transparent: true; opacity: 0;"></a-image>
        <a-image id="kiteOrange2" src="#kiteOrange" width="0.040" height="0.0554" position="-0.36 0.08 0.026" rotation="0 0 35" material="shader: flat; transparent: true; opacity: 0;"></a-image>

  <script>
  (function () {
    "use strict";

    /* ====================================================
       TUNING
    ==================================================== */
    const CONFIG = {
      /* Camera stream. `ideal` never hard-fails — the browser
         degrades to whatever the device can actually give. */
      camWidth:  1280,
      camHeight: 720,

      /* How long the experience survives a tracking dropout
         before it actually tears down and returns to scanning.
         MindAR's own missTolerance (20 frames) freezes the last
         pose first, so these two stack. */
      graceMs: 2200,

      /* Delay before the film fades in, first acquisition only.
         Re-acquisitions resume instantly. */
      firstRevealDelay: 1500,

      kiteCycleMs: 4200,

      /* Parallax amplification. The perspective camera already
         gives real parallax from the kites' z offsets; this
         exaggerates it in the same direction so a few centimetres
         of depth read like metres. */
      parallaxFront: 0.35,
      parallaxBack:  0.08,
      parallaxClamp: 0.80,

      /* Only offer to resume if there's a meaningful amount left */
      resumeMinSec: 15,
      resumeTailSec: 20,

      /* Blow-to-fly sensitivity (RMS of low-passed mic signal) */
      blowThreshold: 0.055,
      blowCeiling:   0.20,

      /* ---- PORTAL ----  OFF by default.
         The poster becomes a hole in the wall: a stencil mask at the
         poster plane is the aperture, and everything inside only draws
         where that mask wrote.

         It looks good, but it costs the thing the piece is actually
         for. Anything set back from the target plane amplifies pose
         error — the same small rotational jitter that is invisible on
         the poster surface becomes visible swimming at depth — and it
         breaks the illusion that the film is printed on the poster.

         Turn it on for a demo with ?portal=1. */
      portal: false,
      portalDepth: 0.42,      /* how far the void recedes, in poster widths */
      portalOpenMs: 780,
      filmDepth: -0.16,       /* film screen sits inside, behind the wall */
      /* Smaller than the aperture on purpose — at full width the screen
         covers the void and you lose the depth you just built. */
      filmScaleInPortal: 0.62,

      /* Route the film through a PannerNode positioned at the poster,
         so the sound genuinely comes from it. Falls back to plain
         stereo if the audio graph can't be built. */
      spatialAudio: true,

      /* Tint the void to the viewer's local time of day */
      timeOfDay: true,

      /* ---- EDGE SOFTENING ----
         A few pixels of tracking error against a hard rectangular
         edge reads as a glaring misalignment; against a feathered
         one it reads as nothing. This does not improve tracking, it
         makes the error that remains far less visible — which is
         worth as much, because on a hand-held bending sheet the
         error is never going fully away.

         It works especially well here: the film's opening frame IS
         the poster art, so the blend is close to invisible. */
      featherEdges: true,
      featherAmount: 0.05,   /* fraction of the plane faded at each edge */

      /* The thin frame is a lovely reveal, but leaving a perfectly
         rigid rectangle sitting on a curved sheet advertises every
         pixel of error. Draw it, then let it go. */
      frameHoldMs: 2600,
      frameFadeMs: 900
    };

    /* Fill these in — they drive the end card and the saved contact.
       Left blank the card still works, it just shows less. */
    const CONTACT = {
      name:     "Suman Debnath",
      role:     "Senior Brand Marketing Manager",
      email:    "",
      phone:    "",
      linkedin: "",
      site:     "https://github.com/Sumandebnath943/poster-ar"
    };

    const KITE_ASPECT = 439 / 317;   /* source PNG aspect */
    const POSTER_W = 1.0;            /* MindAR normalises target width to 1 */
    const POSTER_H = 0.5614;         /* 1536 / 2736, from the compiled target */
    const APP_VERSION = "2026-08-29-v8";


    /* ====================================================
       ON-DEVICE TUNING
       How tracking *feels* can only be judged against the real
       poster, so everything worth turning is reachable from the
       URL — no edit, no redeploy, just reload on the phone:

         ?minCF=0.002   filterMinCF   raise to cut LAG, lower to cut JITTER
         ?beta=4000     filterBeta    raise to cut lag while the poster moves
         ?miss=6        missTolerance lower = less freeze-then-snap
         ?camW=640      camera width  lower frees CPU for the tracker
         ?portal=1      bring the portal back
         ?debug=1       live fps / camera resolution / current values

       Sweep one at a time. minCF and beta pull against each other.
    ==================================================== */
    const QS = new URLSearchParams(location.search);
    const qsNum = (k, d) => { const v = parseFloat(QS.get(k)); return isFinite(v) ? v : d; };

    if (QS.has("portal")) CONFIG.portal = QS.get("portal") !== "0";
    CONFIG.camWidth  = qsNum("camW", CONFIG.camWidth);
    CONFIG.camHeight = qsNum("camH", CONFIG.camHeight);
    CONFIG.filmDepth = qsNum("filmDepth", CONFIG.filmDepth);

    /* Defaults here must mirror the mindar-image attribute above. */
    const TRACK = {
      filterMinCF:     qsNum("minCF",  0.001),
      filterBeta:      qsNum("beta",   2500),
      missTolerance:   qsNum("miss",   10),
      warmupTolerance: qsNum("warmup", 5)
    };
    const TRACK_OVERRIDDEN = ["minCF", "beta", "miss", "warmup"].some(k => QS.has(k));
    const DEBUG = QS.get("debug") === "1";

    const K_TIME   = "ar_film_time";
    const K_SOUND  = "ar_sound";
    const K_PORTAL = "ar_portal";

    /* Version bump forces one reload so stale HTML can't linger. */
    try {
      const stored = localStorage.getItem("ar_version");
      if (stored && stored !== APP_VERSION) {
        localStorage.setItem("ar_version", APP_VERSION);
        /* Preserve any tuning params — dropping them mid-sweep would
           silently reset the values being tested. */
        const qs = new URLSearchParams(location.search);
        qs.set("v", APP_VERSION);
        location.replace(location.pathname + "?" + qs.toString());
        return;
      }
      localStorage.setItem("ar_version", APP_VERSION);
    } catch (e) {}

    const store = {
      get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} },
      del(k)    { try { localStorage.removeItem(k); } catch (e) {} }
    };


    /* ====================================================
       DOM
    ==================================================== */
    const sceneEl   = document.querySelector("a-scene");
    const intro     = document.querySelector("#intro");
    const loading   = document.querySelector("#loading");
    const scanLabel = document.querySelector("#scanLabel");
    const chip      = document.querySelector("#chip");
    const flash     = document.querySelector("#flash");
    const video     = document.querySelector("#film");
    const arVideo   = document.querySelector("#arVideo");
    const targetEl  = document.querySelector("#posterTarget");

    const groupFront = document.querySelector("#kiteGroupFront");
    const groupBack  = document.querySelector("#kiteGroupBack");

    const frameEls = ["#frameTop", "#frameBottom", "#frameLeft", "#frameRight"].map(s => document.querySelector(s));
    const sparks   = ["#spark1", "#spark2", "#spark3", "#spark4", "#spark5"].map(s => document.querySelector(s));
    const glints   = ["#glint1", "#glint2", "#glint3"].map(s => document.querySelector(s));

    const btnStart    = document.querySelector("#start");
    const btnResume   = document.querySelector("#resume");
    const btnNoPoster = document.querySelector("#noPoster");
    const btnSound    = document.querySelector("#btnSound");
    const btnWind     = document.querySelector("#btnWind");
    const btnShot     = document.querySelector("#btnShot");
    const btnCinema   = document.querySelector("#btnCinema");
    const btnPortal   = document.querySelector("#btnPortal");
    const btnExitCine = document.querySelector("#btnExitCinema");
    const btnCineSnd  = document.querySelector("#btnCinemaSound");
    const btnReplay   = document.querySelector("#btnReplay");
    const btnEndClose = document.querySelector("#btnEndClose");


    /* ====================================================
       STATE
    ==================================================== */
    let arStarted   = false;   /* camera + MindAR running */
    let tracked     = false;   /* target visible right now */
    let sessionLive = false;   /* experience running (survives brief dropouts) */
    let hasRevealed = false;   /* film has faded in at least once */
    let cinema      = false;
    let cinemaFromIntro = false;
    let windMode    = false;
    let soundOn     = store.get(K_SOUND, "1") === "1";
    let videoBound  = false;
    let pendingSeek = 0;
    let wantPlaying = false;   /* guards the async unlock in primeVideo() */

    let graceTimer  = null;
    let revealTimer = null;
    let kiteClock   = 0;
    let scanClock   = 0;
    let lostCount   = 0;
    let lostWindow  = 0;
    let gust        = 0;      /* 0..1 wind strength from the mic */

    const tasks = [];         /* fn(dt) -> false when finished */
    function addTask(fn) { tasks.push(fn); }

    const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
    const easeOutCubic = p => 1 - Math.pow(1 - p, 3);

    function setState(name) {
      document.body.classList.remove("state-intro", "state-loading", "state-scanning", "state-tracking");
      document.body.classList.add("state-" + name);
      intro.style.display   = name === "intro"   ? "flex" : "none";
      loading.style.display = name === "loading" ? "flex" : "none";
      document.querySelector("#scanning").style.display = name === "scanning" ? "flex" : "none";
    }

    let chipTimer = null;
    function showChip(text, ms) {
      chip.textContent = text;
      chip.classList.add("show");
      clearTimeout(chipTimer);
      if (ms) chipTimer = setTimeout(() => chip.classList.remove("show"), ms);
    }
    function hideChip() { clearTimeout(chipTimer); chip.classList.remove("show"); }

    function fmtTime(s) {
      s = Math.max(0, Math.floor(s));
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }


    /* ====================================================
       MATERIAL HELPERS
       Writing straight to the three.js material instead of
       el.setAttribute('material', ...) — setAttribute re-parses
       the component schema and rebuilds the material every call,
       which at 60fps across ~16 entities was starving the frame
       budget that MindAR's tracker shares.
    ==================================================== */
    /* Soft-edged alpha mask for the film plane. The plane is 16:9 and
       so is this canvas, so a uniform pixel inset gives a uniform
       feather in world units on all four sides. */
    let featherTex = null;

    function makeFeatherTexture(amount) {
      const W = 256, H = 144;
      const c = document.createElement("canvas");
      c.width = W; c.height = H;
      const g = c.getContext("2d");
      const f = Math.max(2, Math.round(W * amount));

      g.fillStyle = "#000";
      g.fillRect(0, 0, W, H);
      /* canvas blur does the falloff; without support this degrades
         to the hard edge we already had, which is no worse. */
      try { g.filter = "blur(" + (f * 0.62).toFixed(1) + "px)"; } catch (e) {}
      g.fillStyle = "#fff";
      g.fillRect(f, f, W - 2 * f, H - 2 * f);
      try { g.filter = "none"; } catch (e) {}

      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.NoColorSpace;   /* alphaMap reads the green channel */
      return t;
    }

    function setOp(el, v) {
      const mesh = el && el.getObject3D("mesh");
      if (!mesh || !mesh.material) return;
      mesh.material.opacity = v;
      mesh.visible = v > 0.002;
    }
    function getOp(el) {
      const mesh = el && el.getObject3D("mesh");
      return mesh && mesh.material ? mesh.material.opacity : 0;
    }


    /* ====================================================
       AUDIO
    ==================================================== */
    let audioCtx = null;

    function ensureAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
      } catch (e) {}
      return audioCtx;
    }

    function sfxGain() { return soundOn ? 1 : 0; }

    function playDetectionChime() {
      const ctx = ensureAudio(); if (!ctx || !soundOn) return;
      try {
        [880, 1108].forEach((freq, i) => {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0, ctx.currentTime);
          gain.gain.linearRampToValueAtTime((0.18 - i * 0.04) * sfxGain(), ctx.currentTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
          osc.start(ctx.currentTime + i * 0.015);
          osc.stop(ctx.currentTime + 1.2);
        });
      } catch (e) {}
    }

    function playWhoosh(strength) {
      const ctx = ensureAudio(); if (!ctx || !soundOn) return;
      try {
        const dur = 0.6;
        const bufferSize = Math.floor(ctx.sampleRate * dur);
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const source = ctx.createBufferSource(); source.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(800, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + dur);
        filter.Q.value = 0.8;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.22 * (strength || 1) * sfxGain(), ctx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        source.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
        source.start(ctx.currentTime);
      } catch (e) {}
    }

    /* Short plucked note when a kite is tapped */
    function playPluck() {
      const ctx = ensureAudio(); if (!ctx || !soundOn) return;
      try {
        const notes = [1318.5, 1567.98, 2093];
        const f = notes[Math.floor(Math.random() * notes.length)];
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(f, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(f * 1.35, ctx.currentTime + 0.28);
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.14 * sfxGain(), ctx.currentTime + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.45);
      } catch (e) {}
    }

    function playShutter() {
      const ctx = ensureAudio(); if (!ctx || !soundOn) return;
      try {
        const bufferSize = Math.floor(ctx.sampleRate * 0.08);
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const d = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        const src = ctx.createBufferSource(); src.buffer = buffer;
        const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1800;
        const g = ctx.createGain(); g.gain.value = 0.3 * sfxGain();
        src.connect(hp); hp.connect(g); g.connect(ctx.destination);
        src.start();
      } catch (e) {}
    }

    /* Procedural rooftop wind bed — plays under the kite phase,
       ducks away once the film's own audio takes over. */
    let windSrc = null, windGain = null;
    function startWindBed() {
      const ctx = ensureAudio(); if (!ctx || windSrc) return;
      try {
        const len = Math.floor(ctx.sampleRate * 2);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
        const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 420; bp.Q.value = 0.65;
        const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
        const lfoAmt = ctx.createGain(); lfoAmt.gain.value = 250;
        lfo.connect(lfoAmt); lfoAmt.connect(bp.frequency);
        const g = ctx.createGain(); g.gain.value = 0;
        src.connect(bp); bp.connect(g); g.connect(ctx.destination);
        src.start(); lfo.start();
        windSrc = src; windGain = g;
      } catch (e) {}
    }
    function setWindLevel(v, secs) {
      if (!windGain || !audioCtx) return;
      try {
        windGain.gain.cancelScheduledValues(audioCtx.currentTime);
        windGain.gain.setValueAtTime(windGain.gain.value, audioCtx.currentTime);
        windGain.gain.linearRampToValueAtTime(soundOn ? v : 0, audioCtx.currentTime + (secs || 1.2));
      } catch (e) {}
    }

    function vibrate(pattern) {
      try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
    }


    /* ====================================================
       SPATIAL AUDIO
       Route the film through a PannerNode sitting at the poster,
       so the sound comes from the wall rather than from the phone.
       MindAR moves the target and leaves the camera at the origin,
       so the target's world position IS its position relative to
       the listener — no extra maths needed.

       createMediaElementSource permanently diverts the element's
       output, so if anything here throws we leave the film on the
       default path rather than risk silent playback.
    ==================================================== */
    let filmSource = null, filmPanner = null;

    function setupSpatialAudio() {
      if (!CONFIG.spatialAudio || filmSource) return;
      const ctx = ensureAudio();
      if (!ctx) return;
      try {
        filmSource = ctx.createMediaElementSource(video);
        filmPanner = ctx.createPanner();
        filmPanner.panningModel   = "HRTF";
        filmPanner.distanceModel  = "inverse";
        filmPanner.refDistance    = 0.7;
        filmPanner.maxDistance    = 25;
        filmPanner.rolloffFactor  = 0.5;
        filmPanner.positionZ.value = -1;   /* straight ahead until tracked */
        filmSource.connect(filmPanner);
        filmPanner.connect(ctx.destination);
      } catch (e) {
        /* Older Safari throws if called twice, or if the element is
           mid-load. Fall back to unspatialised audio. */
        filmSource = null;
        filmPanner = null;
      }
    }

    const _panPos = new THREE.Vector3();

    function updateSpatialAudio() {
      if (!filmPanner) return;
      /* In cinema mode the poster is irrelevant — centre it. */
      if (cinema || !tracked) {
        _panPos.set(0, 0, -1);
      } else {
        targetEl.object3D.getWorldPosition(_panPos);
        if (!isFinite(_panPos.x) || !isFinite(_panPos.y) || !isFinite(_panPos.z)) {
          _panPos.set(0, 0, -1);
        }
      }
      try {
        if (filmPanner.positionX) {
          filmPanner.positionX.value = _panPos.x;
          filmPanner.positionY.value = _panPos.y;
          filmPanner.positionZ.value = _panPos.z;
        } else {
          filmPanner.setPosition(_panPos.x, _panPos.y, _panPos.z);
        }
      } catch (e) {}
    }


    /* ====================================================
       WIND TRAIL PARTICLES
       Was 30 individual <a-sphere> entities = 30 draw calls and
       30 materials. Now one THREE.Points per parallax layer.
    ==================================================== */
    const TRAIL_MAX = 110;

    function makeDotTexture() {
      const c = document.createElement("canvas");
      c.width = c.height = 64;
      const g = c.getContext("2d");
      const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0,    "rgba(255,255,255,1)");
      grad.addColorStop(0.32, "rgba(255,255,255,0.55)");
      grad.addColorStop(1,    "rgba(255,255,255,0)");
      g.fillStyle = grad;
      g.fillRect(0, 0, 64, 64);
      const t = new THREE.CanvasTexture(c);
      t.needsUpdate = true;
      return t;
    }

    let dotTexture = null;

    function makeTrailSystem(parentObj) {
      const pos  = new Float32Array(TRAIL_MAX * 3);
      const col  = new Float32Array(TRAIL_MAX * 3);
      const vel  = new Float32Array(TRAIL_MAX * 3);
      const age  = new Float32Array(TRAIL_MAX);
      const life = new Float32Array(TRAIL_MAX);
      const amp  = new Float32Array(TRAIL_MAX);

      for (let i = 0; i < TRAIL_MAX; i++) { pos[i * 3 + 1] = -999; life[i] = -1; }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      geo.setAttribute("color",    new THREE.BufferAttribute(col, 3));

      const mat = new THREE.PointsMaterial({
        size: 0.0115,
        map: dotTexture,
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true
      });

      const points = new THREE.Points(geo, mat);
      points.frustumCulled = false;
      points.renderOrder = 12;   /* outside the portal, draws last */
      parentObj.add(points);

      let head = 0;

      return {
        spawn(x, y, z, alpha, spread) {
          const i = head; head = (head + 1) % TRAIL_MAX;
          pos[i * 3]     = x;
          pos[i * 3 + 1] = y;
          pos[i * 3 + 2] = z - 0.003;
          const s = spread || 1;
          vel[i * 3]     = (Math.random() - 0.5) * 0.016 * s;
          vel[i * 3 + 1] = (0.020 + Math.random() * 0.014) * s;
          vel[i * 3 + 2] = (Math.random() - 0.5) * 0.004;
          age[i]  = 0;
          life[i] = 560 + Math.random() * 240;
          amp[i]  = alpha;
        },
        update(dt) {
          let dirty = false;
          for (let i = 0; i < TRAIL_MAX; i++) {
            if (life[i] < 0) continue;
            age[i] += dt;
            const p = age[i] / life[i];
            if (p >= 1) {
              life[i] = -1;
              col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = 0;
              pos[i * 3 + 1] = -999;
              dirty = true;
              continue;
            }
            const ease = 1 - Math.pow(1 - p, 2);
            const step = dt / 1000;
            pos[i * 3]     += vel[i * 3] * step * (1 - ease * 0.5);
            pos[i * 3 + 1] += vel[i * 3 + 1] * step * (1 - ease * 0.5);
            pos[i * 3 + 2] += vel[i * 3 + 2] * step;
            /* fade in fast, out slow. additive blending means
               fading the vertex colour to black is the fade. */
            const a = p < 0.12 ? (p / 0.12) : (1 - (p - 0.12) / 0.88);
            const v = Math.max(0, a) * amp[i];
            col[i * 3]     = v * 1.00;   /* #FFF3E0 */
            col[i * 3 + 1] = v * 0.953;
            col[i * 3 + 2] = v * 0.878;
            dirty = true;
          }
          if (dirty) {
            geo.attributes.position.needsUpdate = true;
            geo.attributes.color.needsUpdate = true;
          }
        },
        clear() {
          for (let i = 0; i < TRAIL_MAX; i++) {
            life[i] = -1;
            pos[i * 3 + 1] = -999;
            col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = 0;
          }
          geo.attributes.position.needsUpdate = true;
          geo.attributes.color.needsUpdate = true;
        }
      };
    }

    let trailsFront = null, trailsBack = null;


    /* ====================================================
       TIME OF DAY
       The poster is a sunset. The void behind it isn't — it
       follows the viewer's own clock, so an 11pm scan and an
       8am scan are different pieces.
    ==================================================== */
    function todPalette() {
      const h = CONFIG.timeOfDay ? new Date().getHours() : 18;
      if (h >= 5 && h < 8) return {
        name: "dawn",
        top: "#16223f", mid: "#7d5570", horizon: "#e8956b", horizonLow: "#f6b98c",
        cityFar: "#6d5f74", cityMid: "#3f3446", cityNear: "#241e30",
        window: "#ffd9a0", windowDensity: 0.10,
        stars: 0.30, wallEdge: "#43384a", accent: "#ffb98a",
        glow: "rgba(255,170,110,0.30)", glowX: 0.24,
        cloud: "rgba(255,190,160,0.16)", wind: 0.05
      };
      if (h >= 8 && h < 16) return {
        name: "day",
        top: "#2f6fa8", mid: "#7fb0d4", horizon: "#d8e9f2", horizonLow: "#eaf3f8",
        cityFar: "#9fb4c4", cityMid: "#6d8194", cityNear: "#48586a",
        window: "#eef4f8", windowDensity: 0.03,
        stars: 0.0, wallEdge: "#5a6774", accent: "#ffffff",
        glow: "rgba(255,255,240,0.22)", glowX: 0.30,
        cloud: "rgba(255,255,255,0.30)", wind: 0.045
      };
      if (h >= 16 && h < 19) return {
        name: "golden",
        top: "#22304f", mid: "#8a5f74", horizon: "#f0a05a", horizonLow: "#ffc98a",
        cityFar: "#7a6068", cityMid: "#4a3a42", cityNear: "#2a2128",
        window: "#ffcf90", windowDensity: 0.14,
        stars: 0.12, wallEdge: "#463840", accent: "#ffc078",
        glow: "rgba(255,160,80,0.38)", glowX: 0.20,
        cloud: "rgba(255,200,150,0.20)", wind: 0.05
      };
      /* Night is lifted well off true black on purpose — this gets
         composited over a real wall on a phone in a lit room, and a
         near-black void just reads as "nothing happened". */
      return {
        name: "night",
        top: "#0a1225", mid: "#1c2c4e", horizon: "#4a6493", horizonLow: "#66809f",
        cityFar: "#33455f", cityMid: "#1a2438", cityNear: "#0c1120",
        window: "#ffd48a", windowDensity: 0.30,
        stars: 0.95, wallEdge: "#2a3348", accent: "#9fc0ff",
        glow: "rgba(120,170,255,0.20)", glowX: 0.26,
        cloud: "rgba(150,180,230,0.10)", wind: 0.06
      };
    }


    /* ====================================================
       THE PORTAL
       The poster stops being a surface and becomes an opening.
       A quad at the poster plane writes to the stencil buffer
       but not to colour; everything inside the void draws only
       where that mask passed. The result reads as a hole in the
       wall, and the camera-pose parallax already in place is
       exactly the input that sells it.

       Depth is deliberately modest — pose error is amplified
       with distance from the target plane, so a deep box swims
       more than a shallow one.
    ==================================================== */
    const STENCIL_REF = 1;

    let portalGroup = null, portalMask = null, voidMotes = null, voidClouds = null;
    const voidKites = [];
    const voidLayers = [];

    function stencilInside(mat) {
      mat.stencilWrite  = true;
      mat.stencilRef    = STENCIL_REF;
      mat.stencilFunc   = THREE.EqualStencilFunc;
      mat.stencilFail   = THREE.KeepStencilOp;
      mat.stencilZFail  = THREE.KeepStencilOp;
      mat.stencilZPass  = THREE.KeepStencilOp;
      return mat;
    }

    function canvasTex(c) {
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 4;
      return t;
    }

    /* Sky only — the city now lives on its own parallax layers. */
    function makeSkyTexture(pal) {
      const c = document.createElement("canvas");
      c.width = 1024; c.height = 576;
      const g = c.getContext("2d");

      const grad = g.createLinearGradient(0, 0, 0, 576);
      grad.addColorStop(0, pal.top);
      grad.addColorStop(0.52, pal.mid);
      grad.addColorStop(0.86, pal.horizon);
      grad.addColorStop(1, pal.horizonLow || pal.horizon);
      g.fillStyle = grad;
      g.fillRect(0, 0, 1024, 576);

      if (pal.stars > 0) {
        for (let i = 0; i < 420; i++) {
          const y = Math.random() * 420;
          /* thin out towards the horizon haze */
          g.globalAlpha = pal.stars * (0.2 + Math.random() * 0.8) * (1 - y / 520);
          g.fillStyle = Math.random() < 0.12 ? pal.accent : "#ffffff";
          const r = Math.random() * 1.15 + 0.25;
          g.beginPath();
          g.arc(Math.random() * 1024, y, r, 0, 6.29);
          g.fill();
        }
        g.globalAlpha = 1;
      }

      /* a soft glow where the sun just went down / will come up */
      const gx = 1024 * (pal.glowX != null ? pal.glowX : 0.22);
      const glow = g.createRadialGradient(gx, 500, 0, gx, 500, 430);
      glow.addColorStop(0, pal.glow);
      glow.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = glow;
      g.fillRect(0, 0, 1024, 576);

      return canvasTex(c);
    }

    /* One depth tier of skyline, transparent above the roofline so
       the tiers stack into real layered parallax. */
    function makeSkylineTexture(pal, tier) {
      const c = document.createElement("canvas");
      c.width = 1024; c.height = 576;
      const g = c.getContext("2d");

      const cfg = [
        { scale: 0.34, colour: pal.cityFar,  alpha: 0.55, win: pal.windowDensity * 0.35, detail: false },
        { scale: 0.60, colour: pal.cityMid,  alpha: 0.85, win: pal.windowDensity * 0.8,  detail: true  },
        { scale: 1.00, colour: pal.cityNear, alpha: 1.00, win: pal.windowDensity,        detail: true  }
      ][tier];

      const base = 576;
      const maxH = 230 * cfg.scale;
      g.globalAlpha = cfg.alpha;

      let x = -40;
      while (x < 1064) {
        const w = (30 + Math.random() * 70) * (0.6 + cfg.scale * 0.7);
        const h = (40 + Math.random() * maxH);
        g.fillStyle = cfg.colour;
        g.fillRect(x, base - h, w, h);

        if (cfg.detail) {
          /* rooftop clutter — water tanks and masts, echoing the poster */
          if (Math.random() < 0.45) {
            const tw = 8 + Math.random() * 12;
            g.fillRect(x + w * 0.2, base - h - tw * 0.75, tw, tw * 0.75);
          }
          if (Math.random() < 0.3) {
            g.fillRect(x + w * 0.7, base - h - (18 + Math.random() * 26), 2, 18 + Math.random() * 26);
          }
        }

        if (cfg.win > 0) {
          g.fillStyle = pal.window;
          const step = 11 * cfg.scale + 5;
          for (let wy = base - h + 9; wy < base - 6; wy += step) {
            for (let wx = x + 5; wx < x + w - 6; wx += step) {
              if (Math.random() < cfg.win) {
                g.globalAlpha = cfg.alpha * (0.45 + Math.random() * 0.55);
                g.fillRect(wx, wy, 3.2, 4.2);
              }
            }
          }
          g.globalAlpha = cfg.alpha;
        }
        x += w + 2 + Math.random() * 10;
      }
      g.globalAlpha = 1;
      return canvasTex(c);
    }

    function makeCloudTexture(pal) {
      const c = document.createElement("canvas");
      c.width = 1024; c.height = 576;
      const g = c.getContext("2d");
      for (let i = 0; i < 16; i++) {
        const cx = Math.random() * 1024;
        const cy = 60 + Math.random() * 280;
        const r  = 60 + Math.random() * 150;
        const grd = g.createRadialGradient(cx, cy, 0, cx, cy, r);
        grd.addColorStop(0, pal.cloud);
        grd.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = grd;
        g.beginPath();
        g.ellipse(cx, cy, r, r * (0.36 + Math.random() * 0.2), 0, 0, 6.29);
        g.fill();
      }
      const t = canvasTex(c);
      t.wrapS = THREE.RepeatWrapping;
      return t;
    }

    /* Side walls fade from the lit aperture to darkness at the back.
       Two variants because the UV axis differs per wall orientation. */
    function makeWallTexture(pal, horizontal) {
      const c = document.createElement("canvas");
      c.width = horizontal ? 128 : 8;
      c.height = horizontal ? 8 : 128;
      const g = c.getContext("2d");
      const grad = horizontal
        ? g.createLinearGradient(0, 0, 128, 0)
        : g.createLinearGradient(0, 0, 0, 128);
      grad.addColorStop(0, pal.wallEdge);
      grad.addColorStop(1, "#04060b");
      g.fillStyle = grad;
      g.fillRect(0, 0, c.width, c.height);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }

    function buildPortal() {
      const pal = todPalette();
      const W = POSTER_W, H = POSTER_H, D = CONFIG.portalDepth;

      portalGroup = new THREE.Group();
      portalGroup.visible = false;
      targetEl.object3D.add(portalGroup);

      /* --- the aperture: stencil only, no colour, no depth --- */
      portalMask = new THREE.Mesh(
        new THREE.PlaneGeometry(W, H),
        new THREE.MeshBasicMaterial({
          colorWrite: false,
          depthWrite: false,
          depthTest: false,
          stencilWrite: true,
          stencilRef: STENCIL_REF,
          stencilFunc: THREE.AlwaysStencilFunc,
          stencilFail: THREE.ReplaceStencilOp,
          stencilZFail: THREE.ReplaceStencilOp,
          stencilZPass: THREE.ReplaceStencilOp
        })
      );
      portalMask.position.z = 0.0015;
      portalMask.renderOrder = 0;
      portalMask.scale.set(0, 0.02, 1);
      portalGroup.add(portalMask);

      /* --- sky at the very back --- */
      const back = new THREE.Mesh(
        new THREE.PlaneGeometry(W * 1.6, H * 1.6),
        stencilInside(new THREE.MeshBasicMaterial({ map: makeSkyTexture(pal), toneMapped: false }))
      );
      back.position.z = -D;
      back.renderOrder = 1;
      portalGroup.add(back);

      /* --- drifting cloud band --- */
      const cloudMat = stencilInside(new THREE.MeshBasicMaterial({
        map: makeCloudTexture(pal), transparent: true, toneMapped: false,
        depthWrite: false, opacity: 0.9
      }));
      voidClouds = new THREE.Mesh(new THREE.PlaneGeometry(W * 1.55, H * 1.1), cloudMat);
      voidClouds.position.z = -D + 0.015;
      voidClouds.renderOrder = 1;
      portalGroup.add(voidClouds);

      /* --- three skyline tiers at real depth.
             This is where the beauty comes from: move your head and
             the near rooftops slide against the far ones, because
             they genuinely are at different distances. --- */
      const tierZ = [-D * 0.78, -D * 0.52, -D * 0.28];
      const tierW = [1.5, 1.28, 1.1];
      for (let i = 0; i < 3; i++) {
        const m = new THREE.Mesh(
          new THREE.PlaneGeometry(W * tierW[i], H * tierW[i]),
          stencilInside(new THREE.MeshBasicMaterial({
            map: makeSkylineTexture(pal, i), transparent: true,
            toneMapped: false, depthWrite: false
          }))
        );
        m.position.set(0, -H * 0.06 * (2 - i), tierZ[i]);
        m.renderOrder = 1;
        portalGroup.add(m);
        voidLayers.push(m);
      }

      /* --- side walls (DoubleSide so normal direction can't bite) --- */
      const texH = makeWallTexture(pal, true);
      const texV = makeWallTexture(pal, false);
      const wall = tex => stencilInside(new THREE.MeshBasicMaterial({
        map: tex, toneMapped: false, side: THREE.DoubleSide
      }));

      const left = new THREE.Mesh(new THREE.PlaneGeometry(D, H), wall(texH));
      left.position.set(-W / 2, 0, -D / 2);
      left.rotation.y = Math.PI / 2;

      const right = new THREE.Mesh(new THREE.PlaneGeometry(D, H), wall(texH));
      right.position.set(W / 2, 0, -D / 2);
      right.rotation.y = -Math.PI / 2;

      const top = new THREE.Mesh(new THREE.PlaneGeometry(W, D), wall(texV));
      top.position.set(0, H / 2, -D / 2);
      top.rotation.x = Math.PI / 2;

      const bottom = new THREE.Mesh(new THREE.PlaneGeometry(W, D), wall(texV));
      bottom.position.set(0, -H / 2, -D / 2);
      bottom.rotation.x = -Math.PI / 2;

      [left, right, top, bottom].forEach(m => { m.renderOrder = 1; portalGroup.add(m); });

      /* --- kites drifting inside the void, at real depth --- */
      const srcs = ["#kiteOrange", "#kiteBlue", "#kiteWhite"];
      for (let i = 0; i < 7; i++) {
        const img = document.querySelector(srcs[i % 3]);
        const tex = new THREE.Texture(img);
        tex.needsUpdate = true;
        tex.colorSpace = THREE.SRGBColorSpace;
        const w = 0.030 + Math.random() * 0.030;
        const m = new THREE.Mesh(
          new THREE.PlaneGeometry(w, w * KITE_ASPECT),
          stencilInside(new THREE.MeshBasicMaterial({
            map: tex, transparent: true, toneMapped: false, depthWrite: false, opacity: 0.85
          }))
        );
        m.renderOrder = 2;
        const depth = -0.06 - Math.random() * (D - 0.12);
        m.position.set(
          (Math.random() - 0.5) * W * 0.82,
          (Math.random() - 0.5) * H * 0.66,
          depth
        );
        m.rotation.z = Math.PI / 4 + (Math.random() - 0.5) * 0.5;
        portalGroup.add(m);
        voidKites.push({
          mesh: m,
          baseY: m.position.y,
          baseX: m.position.x,
          phase: Math.random() * 6.28,
          speed: 0.15 + Math.random() * 0.25,
          drift: 0.010 + Math.random() * 0.020
        });
      }

      /* --- slow light motes for depth cueing --- */
      const N = 90;
      const pos = new Float32Array(N * 3);
      const col = new Float32Array(N * 3);
      const acc = new THREE.Color(pal.accent);
      for (let i = 0; i < N; i++) {
        pos[i * 3]     = (Math.random() - 0.5) * W;
        pos[i * 3 + 1] = (Math.random() - 0.5) * H;
        pos[i * 3 + 2] = -0.02 - Math.random() * (D - 0.04);
        const b = 0.25 + Math.random() * 0.75;
        col[i * 3] = acc.r * b; col[i * 3 + 1] = acc.g * b; col[i * 3 + 2] = acc.b * b;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
      voidMotes = new THREE.Points(geo, stencilInside(new THREE.PointsMaterial({
        size: 0.007,
        map: dotTexture,
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true
      })));
      voidMotes.frustumCulled = false;
      voidMotes.renderOrder = 2;
      portalGroup.add(voidMotes);
    }

    /* Built lazily — a viewer who never opens the portal shouldn't
       pay for six 1024px textures they'll never see. */
    let portalOn = false, portalBuilt = false;

    function ensurePortal() {
      if (portalBuilt) return;
      portalBuilt = true;
      buildPortal();
    }

    function setPortal(on, animate) {
      portalOn = !!on;
      store.set(K_PORTAL, portalOn ? "1" : "0");
      if (btnPortal) btnPortal.classList.toggle("on", portalOn);

      if (portalOn) {
        ensurePortal();
        if (portalGroup) { portalGroup.visible = true; openPortal(); }
      } else if (portalGroup) {
        portalGroup.visible = false;
        portalMask.scale.set(0, 0.02, 1);
      }
      applyFilmPlacement(animate);
    }

    /* The film either sits ON the poster (seamless, and the whole
       point of the piece) or hangs INSIDE the void. */
    function applyFilmPlacement(animate) {
      const targetZ = portalOn ? CONFIG.filmDepth : 0.01;
      const targetS = portalOn ? CONFIG.filmScaleInPortal : 1;

      const mesh = arVideo.getObject3D("mesh");
      if (mesh && mesh.material) {
        if (portalOn) { stencilInside(mesh.material); mesh.renderOrder = 3; }
        else { mesh.material.stencilWrite = false; mesh.renderOrder = 0; }

        /* Feather the film's border. Re-applied here because A-Frame
           rebuilds the material when the video source binds. */
        if (CONFIG.featherEdges) {
          if (!featherTex) featherTex = makeFeatherTexture(CONFIG.featherAmount);
          if (mesh.material.alphaMap !== featherTex) {
            mesh.material.alphaMap = featherTex;
            mesh.material.transparent = true;
            mesh.material.needsUpdate = true;
          }
        }
      }

      if (!animate) {
        arVideo.object3D.position.z = targetZ;
        arVideo.object3D.scale.set(targetS, targetS, 1);
        return;
      }
      const z0 = arVideo.object3D.position.z;
      const s0 = arVideo.object3D.scale.x;
      let t = 0;
      addTask(dt => {
        t += dt;
        const p = Math.min(t / 620, 1);
        const e = easeOutCubic(p);
        arVideo.object3D.position.z = z0 + (targetZ - z0) * e;
        const s = s0 + (targetS - s0) * e;
        arVideo.object3D.scale.set(s, s, 1);
        return p < 1;
      });
    }

    function openPortal() {
      if (!portalGroup) return;
      portalGroup.visible = true;
      let t = 0;
      addTask(dt => {
        if (!sessionLive || !portalOn) { return false; }
        t += dt;
        const p = Math.min(t / CONFIG.portalOpenMs, 1);
        const e = easeOutCubic(p);
        portalMask.scale.set(e, 0.02 + 0.98 * e, 1);
        return p < 1;
      });
    }

    function closePortal() {
      if (!portalGroup) return;
      portalGroup.visible = false;
      portalMask.scale.set(0, 0.02, 1);
    }

    function updateVoid(dt) {
      if (!portalGroup || !portalGroup.visible) return;
      const s = dt / 1000;
      if (voidClouds) {
        voidClouds.position.x += s * 0.004;
        if (voidClouds.position.x > POSTER_W * 0.28) voidClouds.position.x = -POSTER_W * 0.28;
      }
      for (const k of voidKites) {
        k.phase += s * k.speed;
        k.mesh.position.y = k.baseY + Math.sin(k.phase) * k.drift;
        k.mesh.position.x = k.baseX + Math.cos(k.phase * 0.7) * k.drift * 0.6;
        k.mesh.rotation.z += s * 0.12 * (1 + gust);
      }
      if (voidMotes) {
        const p = voidMotes.geometry.attributes.position;
        const a = p.array;
        for (let i = 0; i < a.length; i += 3) {
          a[i + 1] += s * (0.006 + gust * 0.03);
          if (a[i + 1] > POSTER_H / 2) a[i + 1] = -POSTER_H / 2;
        }
        p.needsUpdate = true;
      }
    }


    /* ====================================================
       KITES
    ==================================================== */
    const kiteSpecs = [
      { id: "kiteOrangeAR", layer: "front", from: [-0.207, 0.165], to: [-0.46, 0.60], dur: 1700, delay: 0    },
      { id: "kiteWhiteAR",  layer: "back",  from: [-0.105, 0.190], to: [-0.02, 0.68], dur: 1850, delay: 140  },
      { id: "kiteBlueAR",   layer: "front", from: [ 0.135, 0.165], to: [ 0.46, 0.58], dur: 1950, delay: 260  },
      { id: "kiteOrange2",  layer: "front", from: [-0.36,  0.08 ], to: [-0.60, 0.34], dur: 1450, delay: 420  },
      { id: "kiteBlue2",    layer: "back",  from: [ 0.34,  0.12 ], to: [ 0.62, 0.42], dur: 1500, delay: 560  },
      { id: "kiteWhite2",   layer: "back",  from: [ 0.22,  0.25 ], to: [ 0.34, 0.66], dur: 1650, delay: 720  },
      { id: "kiteOrange3",  layer: "front", from: [-0.43,  0.20 ], to: [-0.66, 0.50], dur: 1350, delay: 880  },
      { id: "kiteBlue3",    layer: "front", from: [ 0.43,  0.24 ], to: [ 0.68, 0.54], dur: 1450, delay: 1020 }
    ];

    const kites = [];

    function buildKites() {
      kiteSpecs.forEach(spec => {
        const el = document.querySelector("#" + spec.id);
        if (!el) return;
        kites.push({
          el, spec,
          layer: spec.layer,
          active: false,
          wait: 0, t: 0, dur: spec.dur,
          speed: 1, lift: 0, spin: 0, pop: 0,
          trailAcc: 0
        });
      });
    }

    function resetKites() {
      kites.forEach(k => {
        k.active = false; k.wait = 0; k.t = 0;
        k.speed = 1; k.lift = 0; k.spin = 0; k.pop = 0; k.trailAcc = 0;
        k.el.object3D.position.set(k.spec.from[0], k.spec.from[1], 0.025);
        k.el.object3D.rotation.z = Math.PI / 4;
        k.el.object3D.scale.set(1, 1, 1);
        setOp(k.el, 0);
      });
      sparks.forEach(s => setOp(s, 0));
      glints.forEach(g => { setOp(g, 0); g.object3D.scale.set(0.5, 0.5, 0.5); });
      if (trailsFront) trailsFront.clear();
      if (trailsBack)  trailsBack.clear();
    }

    function launchKites(simultaneous) {
      kites.forEach(k => {
        k.active = true;
        k.wait = simultaneous ? Math.random() * 160 : k.spec.delay;
        k.t = 0;
        k.speed = simultaneous ? 1.25 : 1;
        k.lift = 0; k.spin = 0; k.pop = 0; k.trailAcc = 0;
        k.el.object3D.position.set(k.spec.from[0], k.spec.from[1], 0.025);
        k.el.object3D.rotation.z = Math.PI / 4;
        setOp(k.el, 0);
      });
      playWhoosh(simultaneous ? 1.4 : 1);
      launchSparks();
      launchGlints();
    }

    function launchSparks() {
      sparks.forEach((spark, index) => {
        const home = spark.object3D.position.clone();
        const dur = 900 + index * 120;
        const wait = 450 + index * 90;
        let t = -wait;
        const targetX = home.x + (index % 2 === 0 ? -1 : 1) * (0.06 + index * 0.008);
        const targetY = home.y + 0.10 + index * 0.012;
        addTask(dt => {
          if (!sessionLive) { setOp(spark, 0); return false; }
          t += dt;
          if (t < 0) return true;
          const p = Math.min(t / dur, 1);
          const e = easeOutCubic(p);
          spark.object3D.position.x = home.x + (targetX - home.x) * e;
          spark.object3D.position.y = home.y + (targetY - home.y) * e;
          const op = p < 0.15 ? p / 0.15 : 1 - (p - 0.15) / 0.85;
          setOp(spark, Math.max(0, op * 0.8));
          if (p >= 1) { spark.object3D.position.copy(home); setOp(spark, 0); return false; }
          return true;
        });
      });
    }

    function launchGlints() {
      glints.forEach((glint, index) => {
        const wait = 600 + index * 430;
        let t = -wait;
        addTask(dt => {
          if (!sessionLive) { setOp(glint, 0); return false; }
          t += dt;
          if (t < 0) return true;
          const p = Math.min(t / 700, 1);
          const b = Math.sin(p * Math.PI);
          const s = 0.5 + b * 1.5;
          glint.object3D.scale.set(s, s, s);
          setOp(glint, b * 0.95);
          if (p >= 1) { setOp(glint, 0); return false; }
          return true;
        });
      });
    }

    function updateKites(dt) {
      const trailStep = 95;
      for (let i = 0; i < kites.length; i++) {
        const k = kites[i];
        if (!k.active) continue;
        if (k.wait > 0) { k.wait -= dt; continue; }

        k.t += dt * k.speed * (1 + gust * 0.85);
        const p = Math.min(k.t / k.dur, 1);
        const e = easeOutCubic(p);
        const arc = Math.sin(p * Math.PI) * 0.055;

        /* boost / gust contributions decay back to zero */
        const decay = Math.min(1, dt / 280);
        k.lift += (0 - k.lift) * decay;
        k.spin += (0 - k.spin) * Math.min(1, dt / 420);
        k.pop  += (0 - k.pop)  * Math.min(1, dt / 200);

        const x = k.spec.from[0] + (k.spec.to[0] - k.spec.from[0]) * e;
        const y = k.spec.from[1] + (k.spec.to[1] - k.spec.from[1]) * e + arc + k.lift + gust * 0.045;
        const z = 0.025 + (0.14 - 0.025) * e;

        k.el.object3D.position.set(x, y, z);
        k.el.object3D.rotation.z = Math.PI / 4 + p * Math.PI * 2.35 + k.spin;
        const sc = 1 + k.pop;
        k.el.object3D.scale.set(sc, sc, 1);

        let op = p < 0.08 ? p / 0.08 : (p < 0.72 ? 1 : 1 - (p - 0.72) / 0.28);
        op = Math.max(0, op);
        setOp(k.el, op);

        k.trailAcc += dt;
        if (k.trailAcc >= trailStep && p > 0.06 && p < 0.87) {
          k.trailAcc = 0;
          const sys = k.layer === "front" ? trailsFront : trailsBack;
          if (sys) sys.spawn(x, y, z, op * 0.62, 1 + gust);
        }

        if (p >= 1) { k.active = false; setOp(k.el, 0); }
      }
    }

    function boostKite(k) {
      k.lift  += 0.055;
      k.spin  += 3.4;
      k.pop    = 0.42;
      k.speed  = Math.min(2.3, k.speed + 0.55);
      const sys = k.layer === "front" ? trailsFront : trailsBack;
      if (sys) {
        const pos = k.el.object3D.position;
        for (let n = 0; n < 9; n++) sys.spawn(pos.x, pos.y, pos.z, 0.75, 2.4);
      }
      playPluck();
      vibrate(12);
    }


    /* ====================================================
       TAP A KITE
       Direct raycast first, then a generous screen-space
       fallback — the kites are small and moving, and a strict
       hit test feels broken on a phone.
    ==================================================== */
    const raycaster = new THREE.Raycaster();
    const _v3 = new THREE.Vector3();

    function onPointerDown(e) {
      if (!sessionLive || !tracked || cinema) return;
      if (e.target && e.target.closest && e.target.closest("button")) return;

      const cam = sceneEl.camera;
      if (!cam) return;

      const cx = e.clientX, cy = e.clientY;
      const ndc = {
        x: (cx / window.innerWidth) * 2 - 1,
        y: -(cy / window.innerHeight) * 2 + 1
      };

      const live = kites.filter(k => k.active && getOp(k.el) > 0.15);
      if (!live.length) return;

      raycaster.setFromCamera(ndc, cam);
      const meshes = live.map(k => k.el.getObject3D("mesh")).filter(Boolean);
      const hits = raycaster.intersectObjects(meshes, false);
      if (hits.length) {
        const hit = live.find(k => k.el.getObject3D("mesh") === hits[0].object);
        if (hit) { boostKite(hit); return; }
      }

      /* Screen-space fallback: nearest kite within ~70px */
      let best = null, bestDist = 70;
      for (const k of live) {
        k.el.object3D.getWorldPosition(_v3);
        _v3.project(cam);
        if (!isFinite(_v3.x) || !isFinite(_v3.y)) continue;
        const px = (_v3.x + 1) / 2 * window.innerWidth;
        const py = (-_v3.y + 1) / 2 * window.innerHeight;
        const d = Math.hypot(px - cx, py - cy);
        if (d < bestDist) { bestDist = d; best = k; }
      }
      if (best) boostKite(best);
    }


    /* ====================================================
       PARALLAX FROM THE REAL CAMERA POSE
       The old version read deviceorientation, which is decoupled
       from the AR view: step sideways without rotating and the
       layers wouldn't budge even though your angle on the poster
       changed. Using the camera's position in poster space gives
       parallax that always agrees with what you're looking at,
       needs no motion permission, and works on a desktop webcam.
    ==================================================== */
    const _camWorld = new THREE.Vector3();
    const _camLocal = new THREE.Vector3();
    let paraX = 0, paraY = 0;

    function updateParallax(dt) {
      let tx = 0, ty = 0;

      /* MindAR leaves the anchor matrix all zeros until it has an
         actual pose. Inverting a singular matrix gives NaN, and a
         NaN can never lerp back out again — it would silently kill
         parallax (and every kite's world position) for good. */
      const m = targetEl.object3D.matrixWorld.elements;
      const posed = isFinite(m[15]) && m[15] !== 0;

      if (tracked && posed && sceneEl.camera) {
        sceneEl.camera.getWorldPosition(_camWorld);
        _camLocal.copy(_camWorld);
        targetEl.object3D.worldToLocal(_camLocal);
        if (isFinite(_camLocal.x) && isFinite(_camLocal.y) && isFinite(_camLocal.z)) {
          const z = Math.max(0.35, Math.abs(_camLocal.z));
          tx = clamp(_camLocal.x / z, -CONFIG.parallaxClamp, CONFIG.parallaxClamp);
          ty = clamp(_camLocal.y / z, -CONFIG.parallaxClamp, CONFIG.parallaxClamp);
        }
      }

      /* frame-rate independent damping */
      const f = 1 - Math.pow(1 - 0.12, dt / 16.67);
      paraX += (tx - paraX) * f;
      paraY += (ty - paraY) * f;
      if (!isFinite(paraX)) paraX = 0;
      if (!isFinite(paraY)) paraY = 0;

      /* Objects floating above the poster shift opposite the
         viewer — same direction the perspective camera already
         moves them, just amplified. */
      groupFront.object3D.position.set(-paraX * CONFIG.parallaxFront, -paraY * CONFIG.parallaxFront * 0.7, 0);
      groupBack.object3D.position.set(-paraX * CONFIG.parallaxBack,  -paraY * CONFIG.parallaxBack * 0.7,  0);
    }


    /* ====================================================
       FRAME + VIDEO REVEAL
    ==================================================== */
    function animateFrameIn() {
      const bars = [[0, "x"], [1, "x"], [2, "y"], [3, "y"]];
      const delays = [0, 55, 120, 120];
      bars.forEach(([idx, axis], i) => {
        const el = frameEls[idx];
        setOp(el, 0.7);
        el.object3D.scale[axis] = 0;
        let t = -delays[i];
        addTask(dt => {
          if (!sessionLive) return false;
          t += dt;
          if (t < 0) return true;
          const p = Math.min(t / 380, 1);
          el.object3D.scale[axis] = easeOutCubic(p);
          return p < 1;
        });
      });

      /* Then retire it. A rigid rectangle held against a curved sheet
         is the single most obvious tell that registration is off. */
      let hold = 0;
      addTask(dt => {
        if (!sessionLive) return false;
        hold += dt;
        if (hold < CONFIG.frameHoldMs) return true;
        animateFrameOut(CONFIG.frameFadeMs);
        return false;
      });
    }

    function animateFrameOut(duration) {
      frameEls.forEach(el => {
        const start = getOp(el);
        if (start <= 0) return;
        let t = 0;
        addTask(dt => {
          t += dt;
          const p = Math.min(t / duration, 1);
          setOp(el, start * (1 - p));
          if (p >= 1) { el.object3D.scale.set(1, 1, 1); return false; }
          return true;
        });
      });
    }

    function revealFilm() {
      if (!sessionLive) return;
      hasRevealed = true;
      document.body.classList.add("revealed");
      setWindLevel(0.02, 1.6);   /* duck the wind bed under the film */

      const full = portalOn ? CONFIG.filmScaleInPortal : 1;
      const from = full * 0.85;
      arVideo.object3D.scale.set(from, from, 1);
      setOp(arVideo, 0);
      let t = 0;
      addTask(dt => {
        if (!sessionLive) { setOp(arVideo, 0); return false; }
        t += dt;
        const p = Math.min(t / 1200, 1);
        const ease = p === 1 ? 1 : 1 - Math.pow(2, -10 * p);
        const s = from + (full - from) * ease;
        arVideo.object3D.scale.set(s, s, 1);
        setOp(arVideo, Math.min(p / 0.6, 1));
        return p < 1;
      });
    }

    function fadeAllOut(duration) {
      const kiteStart  = kites.map(k => getOp(k.el));
      const sparkStart = sparks.map(s => getOp(s));
      const glintStart = glints.map(g => getOp(g));
      const vidStart   = getOp(arVideo);
      let t = 0;
      addTask(dt => {
        t += dt;
        const p = Math.min(t / duration, 1);
        const inv = 1 - p;
        kites.forEach((k, i)  => setOp(k.el, kiteStart[i] * inv));
        sparks.forEach((s, i) => setOp(s, sparkStart[i] * inv));
        glints.forEach((g, i) => setOp(g, glintStart[i] * inv));
        setOp(arVideo, vidStart * inv);
        if (p >= 1) { resetKites(); return false; }
        return true;
      });
    }


    /* ====================================================
       MAIN TICK
    ==================================================== */
    AFRAME.registerComponent("experience-driver", {
      tick: function (time, dt) {
        if (!dt || dt > 250) dt = 16.67;   /* guard tab-switch spikes */

        for (let i = tasks.length - 1; i >= 0; i--) {
          if (tasks[i](dt) === false) tasks.splice(i, 1);
        }

        if (sessionLive) {
          updateKites(dt);
          kiteClock += dt;
          if (kiteClock >= CONFIG.kiteCycleMs) {
            kiteClock = 0;
            if (tracked) launchKites(false);
          }
        }

        if (trailsFront) trailsFront.update(dt);
        if (trailsBack)  trailsBack.update(dt);

        updateVoid(dt);
        updateParallax(dt);
        updateSpatialAudio();
        updateMic(dt);
        updateDebug(dt);

        if (document.body.classList.contains("state-scanning")) {
          scanClock += dt;
          updateScanCoach(dt);
        }
        if (lostWindow > 0) lostWindow -= dt; else lostCount = 0;
      }
    });


    /* ====================================================
       SCANNING COACH
       The old scanning state said "Scanning..." forever whether
       the problem was darkness, distance or framing.
    ==================================================== */
    let coachCanvas = null, coachCtx = null, coachAcc = 0, coachDark = false;

    function sampleBrightness() {
      const vid = getCameraVideo();
      if (!vid || !vid.videoWidth) return -1;
      if (!coachCanvas) {
        coachCanvas = document.createElement("canvas");
        coachCanvas.width = coachCanvas.height = 24;
        coachCtx = coachCanvas.getContext("2d", { willReadFrequently: true });
      }
      try {
        coachCtx.drawImage(vid, 0, 0, 24, 24);
        const d = coachCtx.getImageData(0, 0, 24, 24).data;
        let sum = 0;
        for (let i = 0; i < d.length; i += 4) {
